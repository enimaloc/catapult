# Single source of the Spring Boot and dependency-management plugin versions: settings.gradle.kts
# resolves the plugins with them, and catapult-common imports the matching Boot BOM.
springBootVersion=4.1.2
dependencyManagementVersion=1.1.7

# Modules build and test side by side, and task outputs are reused from the build cache
org.gradle.parallel=true
org.gradle.caching=true
