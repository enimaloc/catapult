spring.application.name=Catapult
spring.threads.virtual.enabled=true

# Trust X-Forwarded-* headers from nginx so that OAuth2 redirect URIs
# and Steam OpenID realm are derived from the public URL, not catapult-api:8080.
server.forward-headers-strategy=native

# ============================================================
# Logging
# ============================================================
logging.level.fr.enimaloc.catapult=INFO

# ============================================================
# Base de données
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catapult}
spring.datasource.username=${DB_USERNAME:catapult}
spring.datasource.password=${DB_PASSWORD:catapult}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ============================================================
# Redis (pub/sub pour le canal WebSocket unifié)
# ============================================================
spring.data.redis.host=${REDIS_HOST:catapult-redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# ============================================================
# IGDB (fallback sur TWITCH_CLIENT_ID si non renseigné)
# ============================================================
app.igdb.client-id=${IGDB_CLIENT_ID:${twitch.client-id:}}
app.igdb.preload-ttl-hours=24
app.igdb.preload-limit=500

# ============================================================
# Polling & Scheduler
# ============================================================
app.polling.interval-seconds=30

# Interval between INCOMPLETE binding retry passes (ms, default 6h)
app.retry.incomplete-interval-ms=21600000

# ============================================================
# Gestion des comptes
# ============================================================
app.account.deletion-delay-days=7

# ============================================================
# Admin — identifiant Twitch du propriétaire de l'application
# ============================================================
app.owner-id=${APP_OWNER_ID:}

# ============================================================
# Sécurité — chiffrement des tokens OAuth2
# ============================================================
app.security.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}

# ============================================================
# Twitch OAuth2
# ============================================================
twitch.client-id=${TWITCH_CLIENT_ID:}
twitch.client-secret=${TWITCH_CLIENT_SECRET:}

# Twitch category cache
app.twitch.category-cache-ttl-hours=24
app.twitch.prewarm-mode=BOTH
twitch.default-no-game.id=509658
twitch.default-no-game.name=Just Chatting
twitch.default-incomplete-game.id=66082
twitch.default-incomplete-game.name=Games + Demos

# ============================================================
# Steam (clé API serveur — https://steamcommunity.com/dev/apikey)
# ============================================================
steam.enabled=true
steam.api-key=${STEAM_API_KEY:}
steam.api-keys=${STEAM_API_KEYS:}

# ============================================================
# URL de base de l'application (utilisée pour les redirects OpenID)
# ============================================================
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ============================================================
# Xbox OAuth2 (optionnel)
# ============================================================
xbox.enabled=false
xbox.client-id=${XBOX_CLIENT_ID:}
xbox.client-secret=${XBOX_CLIENT_SECRET:}

# ============================================================
# Battle.net OAuth2 (optionnel)
# ============================================================
battlenet.enabled=false
battlenet.client-id=${BATTLENET_CLIENT_ID:}
battlenet.client-secret=${BATTLENET_CLIENT_SECRET:}

# ============================================================
# Chat Twitch (irc | eventsub | mock — défaut : mock)
# ============================================================
app.chat.provider=eventsub

# ============================================================
# i18n
# ============================================================
spring.messages.basename=lang/messages
spring.messages.encoding=UTF-8

# ============================================================
# Groupes de profils
# ============================================================
spring.profiles.group.mock-web=mock,mock-steam

# ============================================================
# GitLab — feedback form integration
# ============================================================
gitlab.base-url=${GITLAB_BASE_URL:https://git.enimaloc.fr}
gitlab.token=${GITLAB_TOKEN:}
gitlab.project-path=${GITLAB_PROJECT_PATH:1}
app.feedback.poll-interval-ms=${FEEDBACK_POLL_INTERVAL_MS:300000}

# ============================================================
# Monitoring — Prometheus / Grafana
# ============================================================
management.server.port=8090
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=catapult-api
management.metrics.tags.environment=${ENVIRONMENT:production}

# ============================================================
# JWT — émis après login OAuth2, consommé par catapult-web
# ============================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-hours=24

# ============================================================
# URL de catapult-web (pour la redirection post-OAuth2)
# ============================================================
app.web-url=${CATAPULT_WEB_URL:http://localhost:8081}

app.whitelist=${WHITELIST:}

# ============================================================
# Admin config override
# ============================================================
app.admin.config.exposed-prefixes=app.,twitch.,steam.,xbox.,battlenet.,gitlab.,dtdd.,tw.
app.admin.config.secret-patterns=.*\\.secret$,.*\\.password$,.*\\.api\\.key$,.*\\.api\\.keys$,.*token.*
app.admin.config.taboo-keys=app.owner-id,app.security.token-encryption-key,app.jwt.secret
app.admin.config.restart-required-prefixes=app.jwt.,app.security.,twitch.client-,steam.api-,app.web-url,dtdd.api-,dtdd.enabled,tw.enabled

# ============================================================
# Twitch system bot account (chat commands)
# ============================================================
twitch.system.mod-cache-ttl-seconds=600

# ============================================================
# DoesTheDogDie.com
# ============================================================
dtdd.enabled=${DTDD_ENABLED:false}
dtdd.api-base-url=https://www.doesthedogdie.com/api
dtdd.cache.search-ttl-days=30
dtdd.cache.game-info-ttl-days=180
dtdd.cache.topics-ttl-hours=168
dtdd.match.min-confidence=0.85
dtdd.match.min-candidate-score=0.30
dtdd.match.weight-name=0.7
dtdd.match.weight-media-type=0.3

# ============================================================
# Trigger Warnings
# ============================================================
tw.enabled=${TW_ENABLED:true}
tw.backfill.batch-size=50
tw.backfill.throttle-per-second=2