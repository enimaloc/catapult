# ============================================================
# Base de données — H2 in-memory
# ============================================================
spring.datasource.url=jdbc:h2:mem:catapult;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ============================================================
# Flyway désactivé — schéma créé par Hibernate
# MockWebConfig définit un bean "flyway" factice pour satisfaire @DependsOn("flyway")
# ============================================================
spring.flyway.enabled=false

# ============================================================
# H2 Console (utile pour déboguer le schéma et les données)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Clé de chiffrement factice — 32 octets en base64
# ============================================================
app.security.token-encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# ============================================================
# Identifiant du propriétaire (correspond au twitchId de l'admin mock)
# ============================================================
app.owner-id=mock-admin

# ============================================================
# Twitch — valeurs factices (aucun appel réseau en mock-web)
# ============================================================
twitch.client-id=mock-client-id
twitch.client-secret=mock-client-secret

# ============================================================
# URL de base
# ============================================================
app.base-url=http://localhost:8080

# ============================================================
# IGDB — vide pour court-circuiter les appels réseau dès IgdbService.init()
# ============================================================
app.igdb.client-id=
app.igdb.preload-ttl-hours=999
app.igdb.preload-limit=0

# ============================================================
# Steam actif via MockSteamApiClient (profil mock-steam inclus)
# ============================================================
steam.enabled=true

# ============================================================
# Mock services — tous les services réseau remplacés par des stubs
# ============================================================
app.mock.twitch-category=true
app.mock.twitch=true
app.mock.steam=true
app.mock.xbox-store=true
app.mock.igdb=true
app.mock.twitch-eventsub=true

app.experiment.show-definition=true

# ============================================================
# Nombre d'utilisateurs mock générés au démarrage (user_mock_0 … user_mock_N-1)
# ============================================================
app.mock.users-count=${MOCK_USER_COUNT:3}
