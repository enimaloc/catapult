# ============================================================
# Database — in-memory H2
# ============================================================
spring.datasource.url=jdbc:h2:mem:catapult;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ============================================================
# Flyway disabled — schema created by Hibernate
# MockWebConfig defines a dummy "flyway" bean to satisfy @DependsOn("flyway")
# ============================================================
spring.flyway.enabled=false

# ============================================================
# H2 Console (useful to debug the schema and the data)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Dummy encryption key — 32 bytes in base64
# ============================================================
app.security.token-encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# ============================================================
# Owner id (matches the mock admin's twitchId)
# ============================================================
app.owner-id=mock-admin

# ============================================================
# Twitch — dummy values (no network call in mock-web)
# ============================================================
twitch.client-id=mock-client-id
twitch.client-secret=mock-client-secret

# ============================================================
# Base URL
# ============================================================
app.base-url=http://localhost:8080

# ============================================================
# IGDB — empty to short-circuit network calls from IgdbService.init()
# ============================================================
app.igdb.client-id=

# ============================================================
# Steam active through MockSteamApiClient (mock-steam profile included)
# ============================================================
steam.enabled=true

# ============================================================
# Mock services — every network service replaced by stubs
# ============================================================
app.mock.twitch-category=true
app.mock.twitch=true
app.mock.steam=true
app.mock.xbox-store=true
app.mock.igdb=true
app.mock.twitch-eventsub=true

app.experiment.show-definition=true

# ============================================================
# Number of mock users generated at startup (user_mock_0 … user_mock_N-1)
# ============================================================
app.mock.users-count=${MOCK_USER_COUNT:3}
