# Backup server profile: these values win over the admin config overrides stored in the database.

# Twitch/Steam polling loop (default 30)
app.polling.interval-seconds=60
# Minecraft friends sync (default 300000)
minecraft.friends-sync-interval-ms=900000
# Retry of incomplete game data (default 21600000)
app.retry.incomplete-interval-ms=43200000
# Feedback poll (default 300000)
app.feedback.poll-interval-ms=900000
