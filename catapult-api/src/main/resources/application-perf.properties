# ============================================================
# perf — the throwaway stack of the Playwright and k6 runs, never a real deployment.
# Seeds fake accounts (PerfDataSeeder) and opens a test login (PerfController): it refuses to start
# without catapult.perf.enabled=true (PerfGuard), which is set by the stack, never here.
# Every external call goes through the simulation layer, all simulated (PerfDataSeeder sets the global ones that
# would default to real). Postgres + Flyway as in production: no H2.
# ============================================================
catapult.perf.accounts=100

# The seeded perf-admin is the owner, hence ROLE_ADMIN, by the real login's rule
app.owner-id=perf-admin-twitch

# Sentry stays off without a DSN; with one, perf runs are tagged apart from production
sentry.dsn=${API_SENTRY_DSN:}
sentry.environment=perf

# ============================================================
# The simulation layer in place of the outbound clients
# ============================================================
catapult.simulation.enabled=true
# Apart from a developer's own state (the mock profile's, under the home directory)
catapult.simulation.state-file=${java.io.tmpdir}/catapult-perf-simulation.json
steam.enabled=true
app.chat.provider=eventsub
experiment.provider=internal
# DTDD on, as in production; without a key, its calls are never real
dtdd.enabled=true

# Twitch: no secret, so no app token is ever requested. IGDB: a client id without that secret, so
# only its DB cache answers, never IGDB: PerfDataSeeder fills it for the perf games (the channel
# page's DTDD card, in place, as in production)
twitch.client-id=perf
twitch.client-secret=
app.igdb.client-id=perf
app.twitch.prewarm-mode=NONE

# ============================================================
# Integrations perf does not use: off, or pointed at a closed local port
# ============================================================
xbox.enabled=false
minecraft.enabled=false
battlenet.enabled=false
dtdd.api-base-url=http://127.0.0.1:9
gitlab.base-url=
gitlab.token=
