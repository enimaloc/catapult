# Only keys resolved server-side by catapult-api:
#  - ApiHelpController        → help.<cardId>.{title,body}
#  - ChatCommandPresetCatalog → chat.preset.<key>.{name,template}
#  - TwLabelService           → tw.<id>.label
#  - ApiGameInfoController    → game_info.store.<GameBinding.SourceType>
# UI strings live in catapult-web/src/main/resources/lang/messages.properties.
# No more chat.builtin.<command>.template keys — !setgame (the last Java-backed one with an
# editable template) is now a normal data-driven preset (chat.preset.setgame.*, see
# ChatCommandSetGameMigration for the one-time migration of existing "builtin:setgame" rows);
# !debug remains the only static ChatCommand bean, and it's owner-only (no UI row, no template).

# ---- help cards ------------------------------------------------------------
help.connections.title=Connections
help.connections.body=<p>This section shows the services connected to your {2} account.</p><ul><li><strong>Twitch</strong> is the main provider. To disconnect from Twitch, use the Logout button in the navigation bar.</li><li><strong>Steam</strong> lets {2} detect the game you are currently playing. Connect your Steam account to enable automatic detection.</li><li><strong>OBS</strong>: enter obs-websocket''s address, port and password (in OBS: Tools → WebSocket Server Settings). Your {2} pages then connect to OBS from your browser; the saved password is never shown again. The <strong>widget link</strong>, added as a browser source in OBS, relays {2}''s events to Twitchat even when no {2} page is open: {2} checks that the source exists and can create it for you. Regenerating this link cuts off the sources using the old one.</li><li><strong>Twitchat</strong> talks with {2} through OBS: also set up the OBS connection in Twitchat itself (Parameters → Connections → OBS). Its version is detected automatically, or picked by hand. For each {2} event (category changed, stream started, bot enabled or disabled, no game found…), you define the payloads sent to Twitchat, through a form or as raw JSON, and can test them before saving. A button in a payload can trigger a {2} action, such as going back to the previous category or disabling the bot.</li></ul>
help.connections.body.minecraft=<p><strong>Minecraft</strong> lets {2} detect when you are playing Minecraft, through a friend request sent by a service account (accept it in game: Social → friend requests). Detection relies on the in-game friends system, available from <strong>Minecraft Java 26.3-Snapshot 2</strong>, or on older versions with a mod such as <a href="https://modrinth.com/mod/friends-list-backport" target="_blank" rel="noopener">Friends List Backport</a> or <a href="https://openfriend.net/?mod=release#mod" target="_blank" rel="noopener">OpenFriend</a>.</p>
help.connections.body.xbox=<p><strong>Xbox</strong> lets {2} detect the game you are currently playing on Xbox/Xbox app. Connect your Xbox account to enable automatic detection.</p>

help.status.title=Status
help.status.body=<p>This panel shows the real-time status of {2}.</p><ul><li><strong>Bot</strong>: indicates whether the bot is active and monitoring your stream.</li><li><strong>Stream</strong>: indicates whether you are currently live on Twitch.</li><li><strong>Current game</strong>: the game detected from your active source (Steam, etc.).</li></ul>
help.status.body.chat=<h3>Chat commands</h3><p>Type these in your chat (streamer and moderators):</p><ul><li><strong>@{3} off</strong>: turns the bot off. It keeps listening to your chat, so you can turn it back on.</li><li><strong>@{3} on</strong>: turns the bot back on, and resumes the detection of a provider suspended on your channel.</li><li><strong>@{3} refresh</strong>: detects the game again as if it had just started, and applies again what follows a game change (category, title...).</li><li><strong>@{3} emergency [provider]</strong>: reports a provider that changes your categories wrongly. Its detection is suspended on your channel right away, and for the whole instance if several channels report it, for {4} hours.</li></ul>
help.status.bot_fallback=the bot

help.bindings.title=Associations
help.bindings.body=<p>An association links a game (detected via Steam or another source) to a Twitch category and content labels.</p><ul><li><strong>AUTO</strong>: the category was set automatically by {2}.</li><li><strong>MANUAL</strong>: you set the category yourself.</li><li><strong>INCOMPLETE</strong>: no Twitch category has been assigned to this game yet.</li><li>The <strong>Content labels</strong> toggle enables or disables content restrictions for this game.</li><li>The <strong>Ignored</strong> toggle excludes this game from automatic updates.</li></ul>

help.no-game.title=Default category
help.no-game.body=<p>This category is applied automatically when no game is detected.</p><p>Configure the Twitch category and content labels to use when you are live without playing a recognised game (e.g. {1}).</p>

help.danger-zone.title=Danger zone
help.danger-zone.body=<p>This section lets you permanently delete your {2} account.</p><ul><li>Deletion is <strong>irreversible</strong> after a {0}-day delay.</li><li>During that delay you can cancel the deletion.</li><li>All your data (bindings, settings, connections) will be erased.</li></ul>

help.ccl-settings.title=Content label filters
help.ccl-settings.body=<p>This section controls the content labels (CCLs) that {2} applies to your stream.</p><ul><li><strong>Enable content labels</strong>: globally enables or disables automatic label updates on Twitch.</li><li><strong>Labels to never apply</strong>: labels checked here will never be sent to Twitch, even if a game suggests them. Useful for blocking <em>Gambling</em> in France, for example.</li></ul>

help.tw-settings.title=Trigger Warnings
help.tw-settings.body=Use <code>&lcub;tw#active&rcub;</code> for the aggregated list, or <code>&lcub;tw#&lt;slug&gt;&rcub;</code> for a specific category. Auto-suggestion uses IGDB age ratings, Steam content descriptors, Steam mature-content notes, and DoesTheDogDie.com topics.
help.title-settings.title=Stream title
help.title-settings.body=When it is on, Catapult changes your stream title each time it changes your category. What has a title of its own uses it: a game (in its row, under Overview), a custom binding, and the "no game" and incomplete game categories (in their cards); the rest uses the title for every game. In a title, <code>&lcub;&lcub;GAME&rcub;&rcub;</code> becomes the game detected (a custom binding''s name, nothing without a game), <code>&lcub;&lcub;CATEGORY&rcub;&rcub;</code> its Twitch category, <code>&lcub;&lcub;TITLE&rcub;&rcub;</code> the title the stream had just before (even when Catapult set it), and <code>&lcub;&lcub;ORIGINAL_TITLE&rcub;&rcub;</code> your own title, the one you set before Catapult changed it (change it by hand and that one becomes your own). Write them exactly so, in capitals: anything else between double braces stays as typed. With no title to use, yours is left as it is; when the title before can''t be read from Twitch, it is left as it is too. A title holds up to 140 characters of your own text: the variables and the ternaries syntax dont count (the title sent is still cut at 140 by Twitch).
help.title-settings.body.conditions=<br><br><code>&lcub;&lcub;HAS_TW ? [[[TW] ]] : [[]]&rcub;&rcub;</code> keeps the first part when the condition holds and the second otherwise. The conditions are IS_NO_GAME (no game detected), HAS_GAME (a game is detected), IS_CUSTOM (it is a custom binding), IS_INCOMPLETE (the game is detected but no Twitch category was found), HAS_TW (Catapult found warnings, the TWs, on the game) and IS_MATURE (Catapult found the Mature CCL on the game); combine them with !, &amp;&amp; and ||, put variables or other conditions in the parts. A condition that doesn''t read through stays as typed.
help.title-settings.body.drops=<br><br>For Twitch drops, the DROP_ENABLED condition holds when a drops campaign runs for your channel on the category; <code>&lcub;&lcub;DROP_NAME&rcub;&rcub;</code> then names the campaign and <code>&lcub;&lcub;DROP_END&rcub;&rcub;</code> gives its end date (dd/MM, Paris time). Without a campaign, both are empty.
help.title-settings.body.guest_stars=<br><br>With Twitch Guest Star, <code>&lcub;&lcub;GUEST_STARS&rcub;&rcub;</code> gives the names of the guests on air, separated by commas (empty without guests). While the title is the one Catapult sent, it follows their arrivals and departures live; edit it by hand and Catapult leaves it alone until the next category change. Catapult needs your Guest Star authorization (button under the title).
help.title-settings.body.guest_stars_condition= The HAS_GUEST_STARS condition holds while at least one guest is on air.

help.dtdd.title=DTDD association
help.dtdd.body=<p>{2} links the current game to its page on <strong>DoesTheDogDie.com</strong>: the sensitive topics it lists are used to suggest the game''s trigger warnings.</p><ul><li>The percentage is the confidence of the association found automatically.</li><li><strong>Validate</strong> confirms it is right; this is possible as long as it isn''t verified and no correction is pending.</li><li><strong>Correct</strong> lets you search for the right page and propose it: the correction applies once an administrator validates it.</li></ul>

help.incomplete-fallback.title=Incomplete game
help.incomplete-fallback.body=<p>A game is <strong>incomplete</strong> when {2} detected it but found no matching Twitch category.</p><p>Pick here the category and content labels to apply in that case. Without a category, {2} leaves your stream as it is while the association stays incomplete; you can also complete it yourself from the associations.</p>

help.invite.title=Invitations
help.invite.body=<p>{2} is invitation-only. Share your <strong>invitation link</strong> (or your code) with the people you want to let in.</p><ul><li><strong>Regenerate the code</strong> creates a new code: the previous link stops working.</li><li><strong>Invited people</strong> lists the accounts that joined {2} with your invitation.</li></ul><p>The right to invite is granted by an administrator.</p>

# ---- chat command presets --------------------------------------------------
chat.preset.game.name=!game
chat.preset.game.template={if catapult#getGame().sourceName != ""}Currently playing {print catapult#getGame().sourceName} — {if catapult#getGame().sourceType == "STEAM"}{print steam#getGame(catapult#getGame().sourceId, ctx.settings.language).short_description}{else}{print igdb#getGame(catapult#getGame().sourceName).summary}{/if}{/if}
chat.preset.description.name=!description
chat.preset.description.template={if catapult#getGame().sourceName != ""}{if catapult#getGame().sourceType == "STEAM"}{print steam#getGame(catapult#getGame().sourceId, ctx.settings.language).short_description}{else}{print igdb#getGame(catapult#getGame().sourceName).summary}{/if}{else}I'm not playing anything right now{/if}
chat.preset.store.name=!store
chat.preset.store.template={if igdb#getCurrentGame().storeUrl != ""}Get it here: {print igdb#getCurrentGame().storeUrl}{/if}
chat.preset.release.name=!release
chat.preset.release.template={if igdb#getCurrentGame().releaseDate != ""}Released on {print igdb#getCurrentGame().releaseDate}{/if}
chat.preset.igdb.name=!igdb
chat.preset.igdb.template={if igdb#getCurrentGame().igdbUrl != ""}IGDB page: {print igdb#getCurrentGame().igdbUrl}{/if}
chat.preset.triggers.name=!triggers
chat.preset.triggers.template=⚠ Known triggers for {if igdb#getCurrentGame().name != ""}{print igdb#getCurrentGame().name}{else}this game{/if}: {if tw#active() != ""}{print tw#active()}{else}{if igdb#getCurrentGame().ageRating != ""}{print igdb#getCurrentGame().ageRating}{else}no information available{/if}{/if}
chat.preset.setgame.name=!setgame
chat.preset.setgame.template={var game = arr#join(list(args), " ")}{if igdb#getGame(game).id != ""}{catapult#setGame(game, igdb#getGame(game).id)}Game updated: {game}{else}{game} not found{/if}

