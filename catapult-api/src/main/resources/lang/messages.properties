# Only keys resolved server-side by catapult-api:
#  - ApiHelpController        → help.<cardId>.{title,body}
#  - ChatCommandPresetCatalog → chat.preset.<key>.{name,template}
#  - TwLabelService           → tw.<id>.label
# UI strings live in catapult-web/src/main/resources/lang/messages.properties.
# No more chat.builtin.<command>.template keys — !setgame (the last Java-backed one with an
# editable template) is now a normal data-driven preset (chat.preset.setgame.*, see
# ChatCommandSetGameMigration for the one-time migration of existing "builtin:setgame" rows);
# !debug remains the only static ChatCommand bean, and it's owner-only (no UI row, no template).

# ---- help cards ------------------------------------------------------------
help.connections.title=Connections
help.connections.body=<p>This section shows the services connected to your {2} account.</p><ul><li><strong>Twitch</strong> is the main provider. To disconnect from Twitch, use the Logout button in the navigation bar.</li><li><strong>Steam</strong> lets {2} detect the game you are currently playing. Connect your Steam account to enable automatic detection.</li></ul>
help.connections.body.minecraft=<p><strong>Minecraft</strong> lets {2} detect when you are playing Minecraft, through a friend request sent by a service account (accept it in game: Social → friend requests). Detection relies on the in-game friends system, available from <strong>Minecraft Java 26.3-Snapshot 2</strong>, or on older versions with a mod such as <a href="https://modrinth.com/mod/friends-list-backport" target="_blank" rel="noopener">Friends List Backport</a> or <a href="https://openfriend.net/?mod=release#mod" target="_blank" rel="noopener">OpenFriend</a>.</p>
help.connections.body.xbox=<p><strong>Xbox</strong> lets {2} detect the game you are currently playing on Xbox/Xbox app. Connect your Xbox account to enable automatic detection.</p>

help.status.title=Status
help.status.body=<p>This panel shows the real-time status of {2}.</p><ul><li><strong>Bot</strong>: indicates whether the bot is active and monitoring your stream.</li><li><strong>Stream</strong>: indicates whether you are currently live on Twitch.</li><li><strong>Current game</strong>: the game detected from your active source (Steam, etc.).</li></ul>

help.bindings.title=Associations
help.bindings.body=<p>An association links a game (detected via Steam or another source) to a Twitch category and content labels.</p><ul><li><strong>AUTO</strong>: the category was set automatically by {2}.</li><li><strong>MANUAL</strong>: you set the category yourself.</li><li><strong>INCOMPLETE</strong>: no Twitch category has been assigned to this game yet.</li><li>The <strong>Content labels</strong> toggle enables or disables content restrictions for this game.</li><li>The <strong>Ignored</strong> toggle excludes this game from automatic updates.</li></ul>

help.no-game.title=Default category
help.no-game.body=<p>This category is applied automatically when no game is detected.</p><p>Configure the Twitch category and content labels to use when you are live without playing a recognised game (e.g. {1}).</p>

help.danger-zone.title=Danger zone
help.danger-zone.body=<p>This section lets you permanently delete your {2} account.</p><ul><li>Deletion is <strong>irreversible</strong> after a {0}-day delay.</li><li>During that delay you can cancel the deletion.</li><li>All your data (bindings, settings, connections) will be erased.</li></ul>

help.ccl-settings.title=Content label filters
help.ccl-settings.body=<p>This section controls the content labels (CCLs) that {2} applies to your stream.</p><ul><li><strong>Enable content labels</strong>: globally enables or disables automatic label updates on Twitch.</li><li><strong>Labels to never apply</strong>: labels checked here will never be sent to Twitch, even if a game suggests them. Useful for blocking <em>Gambling</em> in France, for example.</li></ul>

help.chat-commands.title=Chat commands
help.chat-commands.body=<p>Each row defines what your bot replies in chat when someone types the command. Toggle <strong>Enabled</strong>, customise the text, click <strong>Save</strong>.</p><h5>Template syntax</h5><p>Use <code>&lcub;path&rcub;</code> for placeholders and <code>&lcub;path|fallback&rcub;</code> for a fallback when the value is missing. If a required placeholder has no value and no fallback, the command stays silent.</p><h5>Placeholders</h5><ul><li><code>&lcub;game#name&rcub;</code> — current game name, e.g. <em>Hades II</em></li><li><code>&lcub;game#summary&rcub;</code> — short description from IGDB</li><li><code>&lcub;game#release_date&rcub;</code> — release date</li><li><code>&lcub;game#store#url&rcub;</code> — store URL for the active platform</li><li><code>&lcub;game#store#steam&rcub;</code> / <code>&lcub;game#store#xbox&rcub;</code> / <code>&lcub;game#store#battlenet&rcub;</code> / <code>&lcub;game#store#official&rcub;</code> — specific store</li><li><code>&lcub;game#igdb#url&rcub;</code> — IGDB page</li></ul><h5>Examples</h5><ul><li><code>Currently playing &lcub;game#name&rcub; — &lcub;game#summary|no description&rcub;</code></li><li><code>Get it on Steam: &lcub;game#store#steam|—&rcub;</code></li><li><code>Released on &lcub;game#release_date|date unknown&rcub;</code></li></ul>

help.tw-settings.title=Trigger Warnings
help.tw-settings.body=Use <code>&lcub;tw#active&rcub;</code> for the aggregated list, or <code>&lcub;tw#&lt;slug&gt;&rcub;</code> for a specific category. Auto-suggestion uses IGDB age ratings, Steam content descriptors, Steam mature-content notes, and DoesTheDogDie.com topics.

# ---- chat command presets --------------------------------------------------
chat.preset.game.name=!game
chat.preset.game.template={if catapult#getGame().sourceName != ""}Currently playing {print catapult#getGame().sourceName} — {if catapult#getGame().sourceType == "STEAM"}{print steam#getGame(catapult#getGame().sourceId, ctx.settings.language).short_description}{else}{print igdb#getGame(catapult#getGame().sourceName).summary}{/if}{/if}
chat.preset.description.name=!description
chat.preset.description.template={if catapult#getGame().sourceName != ""}{if catapult#getGame().sourceType == "STEAM"}{print steam#getGame(catapult#getGame().sourceId, ctx.settings.language).short_description}{else}{print igdb#getGame(catapult#getGame().sourceName).summary}{/if}{else}I'm not playing anything right now{/if}
chat.preset.store.name=!store
chat.preset.store.template={if igdb#getCurrentGame().storeUrl != ""}Get it here: {print igdb#getCurrentGame().storeUrl}{/if}
chat.preset.release.name=!release
chat.preset.release.template={if igdb#getCurrentGame().releaseDate != ""}Released on {print igdb#getCurrentGame().releaseDate}{/if}
chat.preset.igdb.name=!igdb
chat.preset.igdb.template={if igdb#getCurrentGame().igdbUrl != ""}IGDB page: {print igdb#getCurrentGame().igdbUrl}{/if}
chat.preset.triggers.name=!triggers
chat.preset.triggers.template=⚠ Known triggers for {if igdb#getCurrentGame().name != ""}{print igdb#getCurrentGame().name}{else}this game{/if}: {if tw#active() != ""}{print tw#active()}{else}{if igdb#getCurrentGame().ageRating != ""}{print igdb#getCurrentGame().ageRating}{else}no information available{/if}{/if}
chat.preset.setgame.name=!setgame
chat.preset.setgame.template={var game = arr#join(list(args), " ")}{if igdb#getGame(game).id != ""}{catapult#setGame(game, igdb#getGame(game).id)}Game updated: {game}{else}{game} not found{/if}

