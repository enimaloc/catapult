twitchat_quick_config.stream-started-disable.group_label=Disable the bot (on stream start)
twitchat_quick_config.stream-started-disable-link.label=Link button: disable the bot
twitchat_quick_config.stream-started-disable-link.description=A plain (link) button to disable the bot when the stream starts.
twitchat_quick_config.stream-started-disable-chat.label=Chat button: custom command
twitchat_quick_config.stream-started-disable-chat.description=A button that sends a chat command of your choice (e.g. /so) followed by the action's token, to disable the bot when the stream starts. ⚠️ This button alone does nothing: you must also create a Twitchat "chat command" trigger with the same name (e.g. /catapult), an optional command parameter named TOKEN, and an "HTTP call" action (GET) to {{baseUrl}}/widget/twitchat/action/{TOKEN} — that trigger is what actually runs the action, without opening a page.
twitchat_quick_config.stream-started-disable-chat.param.command.label=Command name (without the /)
