# Seules les clés résolues côté serveur par catapult-api :
#  - ApiHelpController        → help.<cardId>.{title,body}
#  - ChatCommandPresetCatalog → chat.preset.<key>.{name,template}
#  - TwLabelService           → tw.<id>.label
# Les chaînes UI sont dans catapult-web/src/main/resources/lang/messages_fr.properties.
# Plus de clés chat.builtin.<command>.template — !setgame (le dernier bean Java avec un template
# customisable) est maintenant un preset data-driven comme les autres (chat.preset.setgame.*, voir
# ChatCommandSetGameMigration pour la migration one-shot des lignes "builtin:setgame" existantes) ;
# !debug reste la seule commande statique, et elle est owner-only (pas de ligne UI, pas de template).

# ---- cartes d'aide ---------------------------------------------------------
help.connections.title=Connexions
help.connections.body=<p>Cette section affiche les services connectés à ton compte {2}.</p><ul><li><strong>Twitch</strong> est le provider principal. Pour te déconnecter de Twitch, utilise le bouton Déconnexion dans la barre de navigation.</li><li><strong>Steam</strong> permet à {2} de détecter le jeu que tu joues en cours. Connecte ton compte Steam pour activer la détection automatique.</li></ul>
help.connections.body.minecraft=<p><strong>Minecraft</strong> permet à {2} de détecter quand tu joues à Minecraft, via une demande d''ami envoyée par un compte de service (à accepter en jeu : Social → demandes d''amis). La détection repose sur le système d''amis du jeu, disponible à partir de <strong>Minecraft Java 26.3-Snapshot 2</strong>, ou sur les versions antérieures avec un mod comme <a href="https://modrinth.com/mod/friends-list-backport" target="_blank" rel="noopener">Friends List Backport</a> ou <a href="https://openfriend.net/?mod=release#mod" target="_blank" rel="noopener">OpenFriend</a>.</p>
help.connections.body.xbox=<p><strong>Xbox</strong> permet à {2} de détecter le jeu que tu joues actuellement sur Xbox/l''app Xbox. Connecte ton compte Xbox pour activer la détection automatique.</p>

help.status.title=État
help.status.body=<p>Ce panneau affiche l''état en temps réel de {2}.</p><ul><li><strong>Bot</strong> : indique si le bot est actif et surveille ton stream.</li><li><strong>Stream</strong> : indique si tu es actuellement en live sur Twitch.</li><li><strong>Jeu en cours</strong> : le jeu détecté depuis ta source active (Steam, etc.).</li></ul>

help.bindings.title=Associations
help.bindings.body=<p>Une association lie un jeu (détecté via Steam ou autre source) à une catégorie Twitch et des labels de contenu.</p><ul><li><strong>AUTO</strong> : la catégorie a été définie automatiquement par {2}.</li><li><strong>MANUAL</strong> : tu as défini la catégorie manuellement.</li><li><strong>INCOMPLETE</strong> : aucune catégorie Twitch n''est encore associée à ce jeu.</li><li>Le toggle <strong>Labels de contenu</strong> active/désactive les restrictions de contenu pour ce jeu.</li><li>Le toggle <strong>Ignoré</strong> exclut ce jeu de la mise à jour automatique.</li></ul>

help.no-game.title=Catégorie par défaut
help.no-game.body=<p>Cette catégorie est appliquée automatiquement quand aucun jeu n''est détecté.</p><p>Configure ici la catégorie Twitch et les labels de contenu à utiliser quand tu es en live sans jouer à un jeu reconnu (ex : {1}).</p>

help.danger-zone.title=Zone danger
help.danger-zone.body=<p>Cette section permet de supprimer définitivement ton compte {2}.</p><ul><li>La suppression est <strong>irréversible</strong> après un délai de {0} jours.</li><li>Pendant ce délai, tu peux annuler la suppression.</li><li>Toutes tes données (bindings, paramètres, connexions) seront effacées.</li></ul>

help.ccl-settings.title=Filtres de labels de contenu
help.ccl-settings.body=<p>Cette section contrôle les labels de contenu (CCL) que {2} applique à ton stream.</p><ul><li><strong>Activer les labels de contenu</strong> : active ou désactive entièrement la mise à jour automatique des labels sur Twitch.</li><li><strong>Labels à ne jamais appliquer</strong> : les labels cochés ici ne seront jamais envoyés à Twitch, même si un jeu les suggère. Utile pour bloquer <em>Gambling</em> en France par exemple.</li></ul>

help.chat-commands.title=Commandes chat
help.chat-commands.body=<p>Chaque ligne définit ce que ton bot répond dans le chat quand quelqu''un tape la commande. Active le switch <strong>Activé</strong>, personnalise le texte, clique <strong>Enregistrer</strong>.</p><h5>Syntaxe du template</h5><p>Utilise <code>&lcub;chemin&rcub;</code> pour les placeholders et <code>&lcub;chemin|fallback&rcub;</code> pour fournir un texte de repli si la valeur est absente. Si un placeholder requis n''a ni valeur ni fallback, la commande reste silencieuse.</p><h5>Placeholders</h5><ul><li><code>&lcub;game#name&rcub;</code> — nom du jeu en cours, ex. <em>Hades II</em></li><li><code>&lcub;game#summary&rcub;</code> — courte description IGDB</li><li><code>&lcub;game#release_date&rcub;</code> — date de sortie</li><li><code>&lcub;game#store#url&rcub;</code> — URL store de la plateforme active</li><li><code>&lcub;game#store#steam&rcub;</code> / <code>&lcub;game#store#xbox&rcub;</code> / <code>&lcub;game#store#battlenet&rcub;</code> / <code>&lcub;game#store#official&rcub;</code> — store spécifique</li><li><code>&lcub;game#igdb#url&rcub;</code> — page IGDB</li></ul><h5>Exemples</h5><ul><li><code>Je joue à &lcub;game#name&rcub; — &lcub;game#summary|aucune description&rcub;</code></li><li><code>Récupère-le sur Steam : &lcub;game#store#steam|—&rcub;</code></li><li><code>Sortie le &lcub;game#release_date|date inconnue&rcub;</code></li></ul>

help.tw-settings.title=Trigger Warnings
help.tw-settings.body=Utilise <code>&lcub;tw#active&rcub;</code> pour la liste agrégée, ou <code>&lcub;tw#&lt;slug&gt;&rcub;</code> pour une catégorie spécifique. L''auto-suggestion s''appuie sur les classifications IGDB, les content_descriptors Steam, les notes mature Steam, et les topics DoesTheDogDie.com.

# ---- presets de commandes chat ---------------------------------------------
chat.preset.game.name=!game
chat.preset.game.template={if catapult#getGame().sourceName != ""}Je joue à {print catapult#getGame().sourceName} — {if catapult#getGame().sourceType == "STEAM"}{print steam#getGame(catapult#getGame().sourceId, ctx.settings.language).short_description}{else}{print igdb#getGame(catapult#getGame().sourceName).summary}{/if}{/if}
chat.preset.description.name=!description
chat.preset.description.template={if catapult#getGame().sourceName != ""}{if catapult#getGame().sourceType == "STEAM"}{print steam#getGame(catapult#getGame().sourceId, ctx.settings.language).short_description}{else}{print igdb#getGame(catapult#getGame().sourceName).summary}{/if}{else}Je ne joue à rien actuellement{/if}
chat.preset.store.name=!store
chat.preset.store.template={if igdb#getCurrentGame().storeUrl != ""}Disponible ici : {print igdb#getCurrentGame().storeUrl}{/if}
chat.preset.release.name=!release
chat.preset.release.template={if igdb#getCurrentGame().releaseDate != ""}Sortie le {print igdb#getCurrentGame().releaseDate}{/if}
chat.preset.igdb.name=!igdb
chat.preset.igdb.template={if igdb#getCurrentGame().igdbUrl != ""}Fiche IGDB : {print igdb#getCurrentGame().igdbUrl}{/if}
chat.preset.triggers.name=!triggers
chat.preset.triggers.template=⚠ Triggers connus pour {if igdb#getCurrentGame().name != ""}{print igdb#getCurrentGame().name}{else}ce jeu{/if} : {if tw#active() != ""}{print tw#active()}{else}{if igdb#getCurrentGame().ageRating != ""}{print igdb#getCurrentGame().ageRating}{else}aucune information disponible{/if}{/if}
chat.preset.setgame.name=!setgame
chat.preset.setgame.template={var game = arr#join(list(args), " ")}{if igdb#getGame(game).id != ""}{catapult#setGame(game, igdb#getGame(game).id)}Jeu mis à jour: {game}{else}{game} non trouvé{/if}

