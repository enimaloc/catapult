<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" id="changelog-content">
    <div th:if="${#lists.isEmpty(sections)}" style="color:var(--muted); padding:1rem;">
        Aucun historique disponible.
    </div>

    <div th:each="section : ${sections}" style="margin-bottom:1.5rem;">
        <h3 th:text="${section.version()}" style="font-size:1rem; margin-bottom:0.5rem;
            padding-bottom:0.25rem; border-bottom:1px solid var(--border);"></h3>

        <!-- Groupement par type -->
        <div th:with="feats=${section.entries().?[type == 'feat']},
                      fixes=${section.entries().?[type == 'fix']},
                      others=${section.entries().?[type != 'feat' and type != 'fix']}">

            <div th:if="${!#lists.isEmpty(feats)}" style="margin-bottom:0.5rem;">
                <div style="font-weight:600; margin-bottom:0.25rem;">✨ Nouveautés</div>
                <ul style="margin:0; padding-left:1.25rem;">
                    <li th:each="e : ${feats}">
                        <strong th:if="${e.breaking()}" style="color:var(--danger)">BREAKING </strong>
                        <span th:if="${e.scope() != null}" style="color:var(--muted);"
                              th:text="${'(' + e.scope() + ') '}"></span>
                        <span th:text="${e.subject()}"></span>
                    </li>
                </ul>
            </div>

            <div th:if="${!#lists.isEmpty(fixes)}" style="margin-bottom:0.5rem;">
                <div style="font-weight:600; margin-bottom:0.25rem;">🐛 Corrections</div>
                <ul style="margin:0; padding-left:1.25rem;">
                    <li th:each="e : ${fixes}">
                        <span th:if="${e.scope() != null}" style="color:var(--muted);"
                              th:text="${'(' + e.scope() + ') '}"></span>
                        <span th:text="${e.subject()}"></span>
                    </li>
                </ul>
            </div>

            <div th:if="${!#lists.isEmpty(others)}" style="margin-bottom:0.5rem;">
                <div style="font-weight:600; margin-bottom:0.25rem;">🔧 Autres</div>
                <ul style="margin:0; padding-left:1.25rem;">
                    <li th:each="e : ${others}">
                        <span th:if="${e.scope() != null}" style="color:var(--muted);"
                              th:text="${'(' + e.scope() + ') '}"></span>
                        <span th:text="${e.subject()}"></span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

</body>
</html>
