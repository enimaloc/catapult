server.port=0
management.server.port=0
# OAuth2ClientConfig needs a client id; a blank secret makes AdminCclService and the category prewarm skip Twitch
twitch.client-id=full-context-test
twitch.client-secret=
app.igdb.client-id=
app.twitch.prewarm-mode=NONE
sentry.dsn=
app.security.token-encryption-key=full-context-test-key-32-bytes!!
app.base-url=http://localhost
app.web-url=http://localhost
# configurable third parties: a closed local port
dtdd.api-base-url=http://127.0.0.1:9
gitlab.base-url=http://127.0.0.1:9
# the game enrichment sources call hard-coded third-party hosts: off, so no test calls them (their routes answer 404)
catapult.enrichment.hltb.enabled=false
catapult.enrichment.protondb.enabled=false
catapult.enrichment.steamgriddb.enabled=false
catapult.enrichment.steamdeck.enabled=false
catapult.enrichment.pcgamingwiki.enabled=false
catapult.enrichment.trailer.enabled=false
