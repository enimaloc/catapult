# ============================================================
# h2-test — a whole application context on an in-memory H2 database, without Postgres nor Redis containers.
# Hibernate creates the schema (Flyway off: FlywayConfig then only stands in for the beans that wait on it).
# Each test names its own database (spring.datasource.url) so that two cached contexts never share one.
# The simulation layer is off here: the real clients run, so a test that triggers a Steam or Xbox store lookup
# (public, keyless) would reach the internet. Mock such a client in the test.
# ============================================================
spring.datasource.url=jdbc:h2:mem:catapult;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Dummy encryption key — 32 bytes in base64
app.security.token-encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.owner-id=h2-test-owner
app.base-url=http://localhost:8080

# Twitch: a client id for OAuth2ClientConfig; no secret, so no app token is ever requested
twitch.client-id=h2-test-client-id
twitch.client-secret=
app.twitch.prewarm-mode=NONE
app.chat.provider=eventsub
# IGDB: empty, which short-circuits its startup calls
app.igdb.client-id=
# Steam on, as in production (its beans are part of the wiring); no key is configured
steam.enabled=true

# Configurable third parties: a closed local port
dtdd.api-base-url=http://127.0.0.1:9
gitlab.base-url=http://127.0.0.1:9
