stages:
  - build
  - test
  - release

default:
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches/

build:
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - ./gradlew :catapult-api:build :catapult-web:build -x test

test:
  stage: test
  image: eclipse-temurin:21-jdk
  tags:
    - privileged
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: catapult_test
    POSTGRES_USER: catapult
    POSTGRES_PASSWORD: catapult
    DB_URL: jdbc:postgresql://postgres:5432/catapult_test
    DB_USERNAME: catapult
    DB_PASSWORD: catapult
    TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
    TWITCH_CLIENT_ID: test
    TWITCH_CLIENT_SECRET: test
    DISCORD_CLIENT_ID: test
    DISCORD_CLIENT_SECRET: test
    STEAM_CLIENT_ID: test
    STEAM_CLIENT_SECRET: test
    IGDB_CLIENT_ID: test
    JWT_SECRET: $TEST_JWT_SECRET
  script:
    - ./gradlew :catapult-api:test :catapult-api:jacocoTestReport
    - >
      grep 'type="INSTRUCTION"' catapult-api/build/reports/jacoco/test/jacocoTestReport.xml | tail -1 |
      awk '{for(i=1;i<=NF;i++){if($i~/^missed=/){split($i,a,"\"");m=a[2]} if($i~/^covered=/){split($i,a,"\"");c=a[2]}}}
           END{printf "Coverage: %.1f%%\n", c/(m+c)*100}'
  coverage: '/Coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - catapult-api/build/reports/jacoco/
      - catapult-api/build/classes/
      - catapult-api/build/test-results/test/
    reports:
      junit: catapult-api/build/test-results/test/TEST-*.xml
    expire_in: 1 week

# ── Release jobs (triggered on git tags) ──────────────────────────────────────

.release-common: &release-common
  stage: release
  image: docker:latest
  tags:
    - privileged
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@noreply.gitlab.com"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

release-api:
  <<: *release-common
  script:
    - docker build
        -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG"
        -t "$CI_REGISTRY_IMAGE/api:latest"
        -f catapult-api/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/api:latest"

release-web:
  <<: *release-common
  script:
    - docker build
        -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG"
        -t "$CI_REGISTRY_IMAGE/web:latest"
        -f catapult-web/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"

release-maintenance:
  <<: *release-common
  script:
    - docker build
        -t "$CI_REGISTRY_IMAGE/maintenance:$CI_COMMIT_TAG"
        -t "$CI_REGISTRY_IMAGE/maintenance:latest"
        catapult-maintenance/
    - docker push "$CI_REGISTRY_IMAGE/maintenance:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/maintenance:latest"

release-nginx-router:
  <<: *release-common
  script:
    - docker build
        -t "$CI_REGISTRY_IMAGE/nginx-router:$CI_COMMIT_TAG"
        -t "$CI_REGISTRY_IMAGE/nginx-router:latest"
        nginx-router/
    - docker push "$CI_REGISTRY_IMAGE/nginx-router:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE/nginx-router:latest"

release-git-branch:
  <<: *release-common
  script:
    - git checkout -b "v/${CI_COMMIT_TAG}"
    - git push origin "v/${CI_COMMIT_TAG}"
  needs: []
