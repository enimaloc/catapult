stages:
  - build
  - test
  - analyze
  - release

default:
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches/
      - .sonar/cache/

build:
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - ./gradlew build -x test

test:
  stage: test
  image: eclipse-temurin:21-jdk
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: catapult_test
    POSTGRES_USER: catapult
    POSTGRES_PASSWORD: catapult
    DB_URL: jdbc:postgresql://postgres:5432/catapult_test
    DB_USERNAME: catapult
    DB_PASSWORD: catapult
    TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
    TWITCH_CLIENT_ID: test
    TWITCH_CLIENT_SECRET: test
    DISCORD_CLIENT_ID: test
    DISCORD_CLIENT_SECRET: test
    STEAM_CLIENT_ID: test
    STEAM_CLIENT_SECRET: test
    IGDB_CLIENT_ID: test
  script:
    - ./gradlew test jacocoTestReport
    - >
      grep 'type="INSTRUCTION"' build/reports/jacoco/test/jacocoTestReport.xml | tail -1 |
      awk '{for(i=1;i<=NF;i++){if($i~/^missed=/){split($i,a,"\"");m=a[2]} if($i~/^covered=/){split($i,a,"\"");c=a[2]}}}
           END{printf "Coverage: %.1f%%\n", c/(m+c)*100}'
  coverage: '/Coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - build/reports/jacoco/
      - build/classes/
      - build/test-results/test/
    reports:
      junit: build/test-results/test/TEST-*.xml
    expire_in: 1 week
#  rules:
#    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

sonar:
  stage: analyze
  image: eclipse-temurin:21-jdk
  needs:
    - job: test
      artifacts: true
  script:
    - ./gradlew sonar -x test -x jacocoTestReport --info
  tags:
    - sonar
#  rules:
#    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

release:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@noreply.gitlab.com"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - git checkout -b "v/${CI_COMMIT_TAG}"
    - git push origin "v/${CI_COMMIT_TAG}"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
