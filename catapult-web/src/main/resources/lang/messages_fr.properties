channel.commands.migration.twitchat.name=Twitchat
channel.commands.migration.twitchat.step1=Dans Twitchat, ouvre les paramètres, section Triggers, et crée un trigger « Chat command » par commande ci-dessous, avec les utilisateurs autorisés indiqués.
channel.commands.migration.twitchat.step2=Ajoute une action « HTTP call » en GET avec l'URL ci-dessous, et range son résultat dans le placeholder CATAPULT (« Store result in placeholder »).
channel.commands.migration.twitchat.step3=Ajoute une action « Extract JSON data » : source CATAPULT, puis un placeholder nommé comme dans le message ci-dessous, avec le chemin JSON indiqué.
channel.commands.migration.twitchat.step4=Ajoute une action « Send chat message » avec le message ci-dessous. Twitchat doit rester ouvert pendant ton stream.
channel.commands.migration.streamerbot.name=Streamer.bot
channel.commands.migration.streamerbot.step1=Dans l'onglet Commands, ajoute une commande par commande ci-dessous, avec les permissions indiquées.
channel.commands.migration.streamerbot.step2=Crée une action déclenchée par elle (Core › Commands › Command Triggered), puis ajoute la sous-action Core › Network › Fetch URL : l'URL ci-dessous, le nom de variable catapult, et « Parse result as JSON » coché.
channel.commands.migration.streamerbot.step3=Ajoute la sous-action Twitch › Chat › Send Message avec le message ci-dessous. Streamer.bot doit tourner pendant ton stream.
channel.commands.migration.nightbot.name=Nightbot
channel.commands.migration.nightbot.step1=Ajoute Nightbot à ta chaîne depuis nightbot.tv (« Join Channel »), puis passe-le modérateur en tapant /mod nightbot dans ton chat.
channel.commands.migration.nightbot.step2=Colle chaque ligne ci-dessous dans ton chat Twitch : Nightbot crée la commande, avec sa permission, et lit sa réponse dans l'API à chaque utilisation.
channel.commands.migration.nightbot.step3=Tape la commande dans ton chat pour vérifier sa réponse.
channel.commands.migration.streamelements.name=StreamElements
channel.commands.migration.streamelements.step1=Active le bot StreamElements sur ta chaîne depuis streamelements.com, puis passe-le modérateur en tapant /mod streamelements dans ton chat.
channel.commands.migration.streamelements.step2=Colle chaque ligne ci-dessous dans ton chat Twitch : la première crée la commande, la seconde (quand il y en a une) règle sa permission.
channel.commands.migration.streamelements.step3=Tape la commande dans ton chat pour vérifier sa réponse.
channel.commands.migration.wizebot.name=Wizebot
channel.commands.migration.wizebot.step1=Sur panel.wizebot.tv, ouvre les commandes personnalisées et crée une commande de type « Dire un texte » par commande ci-dessous.
channel.commands.migration.wizebot.step2=Colle le texte ci-dessous comme texte de la commande : il lit l'information dans l'API à chaque utilisation.
channel.commands.migration.wizebot.step3=Donne-lui la permission indiquée, puis enregistre et essaie-la dans ton chat.

