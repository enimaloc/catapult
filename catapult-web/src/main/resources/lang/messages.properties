channel.commands.migration.twitchat.name=Twitchat
channel.commands.migration.twitchat.step1=In Twitchat, open the parameters, Triggers section, and create a "Chat command" trigger for each command below, with the allowed users shown.
channel.commands.migration.twitchat.step2=Add an "HTTP call" action using GET with the URL below, and store its result in the placeholder CATAPULT ("Store result in placeholder").
channel.commands.migration.twitchat.step3=Add an "Extract JSON data" action: source CATAPULT, then a placeholder named as in the message below, with the JSON path shown.
channel.commands.migration.twitchat.step4=Add a "Send chat message" action with the message below. Twitchat must stay open during your stream.
channel.commands.migration.streamerbot.name=Streamer.bot
channel.commands.migration.streamerbot.step1=In the Commands tab, add a command for each command below, with the permissions shown.
channel.commands.migration.streamerbot.step2=Create an action it triggers (Core › Commands › Command Triggered), then add the Core › Network › Fetch URL sub-action: the URL below, the variable name catapult, and "Parse result as JSON" checked.
channel.commands.migration.streamerbot.step3=Add the Twitch › Chat › Send Message sub-action with the message below. Streamer.bot must be running during your stream.
channel.commands.migration.nightbot.name=Nightbot
channel.commands.migration.nightbot.step1=Add Nightbot to your channel from nightbot.tv ("Join Channel"), then make it a moderator by typing /mod nightbot in your chat.
channel.commands.migration.nightbot.step2=Paste each line below in your Twitch chat: Nightbot creates the command, with its permission, and reads its answer from the API each time it is used.
channel.commands.migration.nightbot.step3=Type the command in your chat to check its answer.
channel.commands.migration.streamelements.name=StreamElements
channel.commands.migration.streamelements.step1=Enable the StreamElements bot on your channel from streamelements.com, then make it a moderator by typing /mod streamelements in your chat.
channel.commands.migration.streamelements.step2=Paste each line below in your Twitch chat: the first creates the command, the second (when there is one) sets its permission.
channel.commands.migration.streamelements.step3=Type the command in your chat to check its answer.
channel.commands.migration.wizebot.name=Wizebot
channel.commands.migration.wizebot.step1=On panel.wizebot.tv, open the custom commands and create a "Say text" command for each command below.
channel.commands.migration.wizebot.step2=Paste the text below as the command's text: it reads the information from the API each time it is used.
channel.commands.migration.wizebot.step3=Give it the permission shown, then save it and try it in your chat.

