# The site's port: catapult-web is its only entry point (it relays catapult-api's public paths, see
# ApiRelayController), catapult-api keeping 8080 on the inside.
server.port=${SERVER_PORT:8081}
# Behind the TLS proxy: take the client IP and scheme from X-Forwarded-* (the access log shows the real IP).
server.forward-headers-strategy=native

spring.messages.basename=lang/messages
spring.messages.encoding=UTF-8
spring.messages.use-code-as-default-message=false

# catapult-api base URL every ApiService call goes to (docker-compose sets CATAPULT_API_URL).
catapult.backend-url=${CATAPULT_API_URL:http://localhost:8080}
# A catapult-api that hangs fails its calls instead of holding the pages waiting on it.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=30s

# Redis: catapult-api's events (ChannelEventRedisBridge, NotificationRedisBridge, TwitchatDispatchRedisBridge),
# the messages between catapult-web instances (InstanceBus), and the sessions they all share.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Sessions: kept in Redis (Spring Session), so that any catapult-web instance behind the proxy serves any
# browser. Their attributes are strings only (the JWTs, SessionChannels' JSON). The cookie keeps its name.
spring.session.data.redis.namespace=catapult:web:session
server.servlet.session.cookie.name=JSESSIONID

# Monitoring: Prometheus scrapes /actuator/prometheus on the management port, kept off the public
# one. Health is also served on the site's port at /up, for the proxy in front's probe.
management.server.port=${MANAGEMENT_PORT:8092}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.group.public.include=*
management.endpoint.health.group.public.additional-path=server:/up
management.metrics.tags.application=catapult-web
management.metrics.tags.environment=${ENVIRONMENT:production}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles-histogram.catapult.web.actions=true

# Sentry: errors, traces and logs, off without a DSN. Traces continue the browser's (see
# SentryConfig, which also names the release and the member); logs at INFO and up become
# breadcrumbs and Sentry logs, errors become events.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${ENVIRONMENT:production}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}
sentry.send-default-pii=false
sentry.logs.enabled=true
sentry.logging.minimum-breadcrumb-level=info
sentry.logging.minimum-event-level=error
sentry.in-app-includes=fr.enimaloc.catapult
# Share of pages the browser replays whole (the others only when they hit an error).
catapult.sentry.replays-session-sample-rate=0
