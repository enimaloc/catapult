spring.application.name=Catapult
spring.threads.virtual.enabled=true

server.port=8081

# nginx doesn't forward reliable X-Forwarded-Proto/Port to this app, so absolute
# redirects built from request.getScheme()/getServerPort() end up wrong (http://
# instead of https://, or the internal port). Relative redirects sidestep this
# entirely: the browser resolves "/channels" against its own current origin.
server.tomcat.use-relative-redirects=true

# catapult-web and catapult-api are reverse-proxied under the same public host;
# explicit distinct cookie names avoid the two apps clobbering each other's
# session cookie (default name "JSESSIONID" would collide on the same domain/path).
server.servlet.session.cookie.name=CATAPULT_WEB_SESSION

# ============================================================
# Logging
# ============================================================
logging.level.fr.enimaloc.catapult=INFO

# ============================================================
# i18n
# ============================================================
spring.messages.basename=lang/messages
spring.messages.encoding=UTF-8

# ============================================================
# Redis (pub/sub pour le canal WebSocket unifié)
# ============================================================
spring.data.redis.host=${REDIS_HOST:catapult-redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# ============================================================
# WebSocket
# ============================================================
# Comma-separated allowed origins for the /ws handshake.
# Default "*" is dev-only. Production MUST set CATAPULT_WS_ALLOWED_ORIGIN_PATTERNS
# (e.g. https://catapult.example.com) to prevent Cross-Site WebSocket Hijacking.
catapult.ws.allowed-origin-patterns=${CATAPULT_WS_ALLOWED_ORIGIN_PATTERNS:*}

# ============================================================
# URL interne de catapult-api
# ============================================================
catapult.api.url=${CATAPULT_API_URL:http://localhost:8080}

# Public-facing URL of catapult-api OAuth endpoint.
# In production behind nginx (nginx routes /oauth2/** to catapult-api), set CATAPULT_API_PUBLIC_URL= (empty).
# In dev without nginx, defaults to catapult.api.url so the join page links to catapult-api directly.
catapult.api.public-url=${CATAPULT_API_PUBLIC_URL:${catapult.api.url:}}

# ============================================================
# JWT — même secret partagé que catapult-api pour valider les tokens
# ============================================================
catapult.jwt.secret=${JWT_SECRET:}

# ============================================================
# Monitoring — Prometheus / Grafana
# ============================================================
management.server.port=8091
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=catapult-web
management.metrics.tags.environment=${ENVIRONMENT:production}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles-histogram.catapult.ws.action.duration=true
management.metrics.distribution.percentiles-histogram.catapult.ws.snapshot.duration=true

# ============================================================
# Admin config override (web side)
# ============================================================
app.admin.web-config.exposed-prefixes=catapult.,app.
app.admin.web-config.secret-patterns=.*\\.secret$,.*\\.password$,.*\\.api\\.key$,.*\\.api\\.keys$,.*token.*
app.admin.web-config.taboo-keys=catapult.jwt.secret

# ============================================================
# .well-known
# ============================================================
catapult.well-known.raw=${WELL_KNOWN_RAW:}
catapult.well-known.microsoft-identity-association.application-id=${WELL_KNOWN_MICROSOFT_IDENTITY_ASSOCATION_APP_ID:}
catapult.well-known.security.contact=${WELL_KNOWN_SECURITY_CONTACT:}
catapult.well-known.security.expires=${WELL_KNOWN_SECURITY_EXPIRES:}
catapult.well-known.security.encryption=${WELL_KNOWN_SECURITY_ENCRYPTION:}
catapult.well-known.security.acknowledgments=${WELL_KNOWN_SECURITY_ACKNOWLEDGMENTS:}
catapult.well-known.security.preferred-languages=${WELL_KNOWN_SECURITY_PREFERRED_LANGUAGES:}
catapult.well-known.security.policy=${WELL_KNOWN_SECURITY_POLICY:}
catapult.well-known.security.canonical=${WELL_KNOWN_SECURITY_CANONICAL:}
catapult.well-known.acme.challenges=${WELL_KNOWN_ACME_CHALLENGES:}

# ============================================================
# 3rd parties verification at root (/) domain
# ============================================================
catapult.3rd-parties-verification-root-domain.raw=${3RD_PARTIES_CERIFICATION_ROOT_DOMAIN_RAW:}
catapult.3rd-parties-verification-root-domain.riot=${3RD_PARTIES_CERIFICATION_ROOT_DOMAIN_RIOT:}
