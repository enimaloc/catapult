spring.application.name=Catapult
spring.threads.virtual.enabled=true

server.port=8081

# ============================================================
# Logging
# ============================================================
logging.level.fr.enimaloc.catapult=INFO

# ============================================================
# i18n
# ============================================================
spring.messages.basename=lang/messages
spring.messages.encoding=UTF-8

# ============================================================
# URL interne de catapult-api
# ============================================================
catapult.api.url=${CATAPULT_API_URL:http://localhost:8080}

# ============================================================
# JWT — même secret partagé que catapult-api pour valider les tokens
# ============================================================
catapult.jwt.secret=${JWT_SECRET:}

# ============================================================
# Monitoring — Prometheus / Grafana
# ============================================================
management.server.port=8091
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=catapult-web
management.metrics.tags.environment=${ENVIRONMENT:production}
