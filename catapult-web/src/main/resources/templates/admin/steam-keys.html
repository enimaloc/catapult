<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{template::layout(~{::title}, 'steam-keys', ~{::body}, null, 'container', null, null)}">
<head>
    <title>Catapult — Steam API Keys</title>
</head>
<body>
<!--/*@thymesvar id="keys" type="java.util.List"*/-->
<!--/*@thymesvar id="steamEnabled" type="java.lang.Boolean"*/-->
    <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1rem;">
        <h2 th:text="#{admin.steam_keys.title}" style="margin:0">Administration — Steam API Keys</h2>
        <form th:if="${steamEnabled}" th:action="@{/admin/steam-keys/refresh}" method="post"> <!-- nosemgrep -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-sm" th:text="#{admin.steam_keys.refresh}">↺ Refresh</button>
        </form>
    </div>

    <div th:unless="${steamEnabled}" class="text-muted">
        <p th:text="#{admin.steam_keys.disabled}">Steam integration is disabled. Enable it with <code>steam.enabled=true</code>.</p>
    </div>

    <div th:if="${steamEnabled}">
        <div th:if="${param.error != null}" class="text-danger" style="margin-bottom:0.5rem;">
            <span th:text="#{admin.steam_keys.error.invalid}">Invalid API key format.</span>
        </div>

        <div class="card" style="margin-bottom:1rem; padding:1rem;">
            <form th:action="@{/admin/steam-keys/add}" method="post" style="display:flex; gap:0.5rem; align-items:center;"> <!-- nosemgrep -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="password" name="apiKey" required
                       th:placeholder="#{admin.steam_keys.add.placeholder}"
                       style="flex:1; max-width:320px;"/>
                <button type="submit" class="btn btn-primary" th:text="#{admin.steam_keys.add.button}">Add</button>
            </form>
        </div>

        <div th:if="${keys.isEmpty()}" class="text-muted">
            <p th:text="#{admin.steam_keys.empty}">No shared Steam API keys configured.</p>
        </div>

        <div th:unless="${keys.isEmpty()}" class="card">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th th:text="#{admin.steam_keys.column.api_key}">API Key</th>
                            <th th:text="#{admin.steam_keys.column.owner}">Owner</th>
                            <th th:text="#{admin.steam_keys.column.status}">Status</th>
                            <th th:text="#{admin.steam_keys.column.actions}">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="status : ${keys}">
                            <td>
                                <span class="badge" th:text="${status.masked()}"></span>
                            </td>
                            <td>
                                <span th:if="${status.owner() != null}" class="badge badge-default" th:text="${status.owner()}"></span>
                                <span th:if="${status.owner() == null}" class="text-muted" th:text="#{admin.steam_keys.owner.admin}">Admin</span>
                            </td>
                            <td>
                                <span th:if="${!status.blocked()}" class="badge badge-connected" th:text="#{admin.steam_keys.status.available}">Available</span>
                                <span th:if="${status.blocked()}" class="badge badge-warning"
                                      th:text="#{admin.steam_keys.status.blocked} + ' ' + ${status.blockedForSeconds()} + 's'">Blocked</span>
                            </td>
                            <td>
                                <form th:action="@{/admin/steam-keys/delete}" method="post"> <!-- nosemgrep -->
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="keyId" th:value="${status.id()}"/>
                                    <button type="submit" class="btn btn-sm" th:text="#{admin.steam_keys.action.delete}">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
