<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:ws="https://catapult.enimaloc.fr/ws"
      th:replace="~{template::layout(~{::title}, 'ccl', ~{::body}, null, 'container', null, null)}">
<head>
    <title th:text="${app.name} + ' — Admin CCL'">Catapult — Admin CCL</title>
</head>
<body>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
        <h2 th:text="#{admin.ccl.title}">Administration — CCL</h2>
        <form th:action="@{/admin/ccl/refresh}" method="post"
              ws:post="@{/admin/ccl/refresh}" ws:swap="none"> <!-- nosemgrep -->
            <button type="submit" class="btn btn-outline" th:text="#{ccl.refresh}"></button>
        </form>
    </div>

    <div class="ccl-wrapper" data-ccl-card
         th:attr="data-mappings-base=@{/admin/ccl},
                  data-i18n-save=#{common.save}">
        <div class="text-muted" data-ccl-empty th:style="${#lists.isEmpty(ccls)} ? '' : 'display:none'">
            <p th:text="#{ccl.no_result(#{ccl.refresh})}"></p>
        </div>

        <div class="table-container" data-ccl-table th:style="${#lists.isEmpty(ccls)} ? 'display:none' : ''">
            <table class="table">
                <thead>
                    <tr>
                        <th th:text="#{ccl.column.twitch}">CCL Twitch</th>
                        <th th:text="#{ccl.column.description}">Description</th>
                        <th th:text="#{ccl.column.igdb_mappings}">Descripteurs de contenu IGDB associés</th>
                        <th th:text="#{ccl.column.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody data-ccl-body>
                    <tr th:each="ccl : ${ccls}" th:attr="data-ccl-id=${ccl.id}">
                        <td>
                            <strong th:text="${ccl.name}"></strong><br>
                            <span class="badge" th:text="${ccl.id}"></span>
                        </td>
                        <td class="text-muted" th:text="${ccl.description}"></td>
                        <td>
                            <form th:action="@{/admin/ccl/{id}/mappings(id=${ccl.id})}" method="post"
                                  ws:post="@{/admin/ccl/{id}/mappings(id=${ccl.id})}" ws:swap="none"> <!-- nosemgrep -->
                                <select name="igdbCategoryIds" multiple size="8" style="width:100%; min-width:250px;" aria-label="Catégories IGDB">
                                    <option th:each="desc : ${igdbDescriptors}"
                                            th:value="${desc.id}"
                                            th:text="${desc.description}"
                                            th:selected="${ccl.mappedDescriptions.contains(desc.description)}">
                                    </option>
                                </select>
                                <div style="margin-top:0.5rem;">
                                    <button type="submit" class="btn btn-sm btn-primary" th:text="#{common.save}">Enregistrer</button>
                                </div>
                            </form>
                        </td>
                        <td data-ccl-badges>
                            <span th:each="desc : ${ccl.mappedDescriptions}" class="badge badge-ccl" th:text="${desc}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
