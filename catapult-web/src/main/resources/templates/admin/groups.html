<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:ws="https://catapult.enimaloc.fr/ws"
      th:replace="~{template::layout(~{::title}, 'groups', ~{::body}, null, 'container', null, null)}">
<head>
    <title th:text="#{admin.groups.title(${app.name})}">Administration — Groupes</title>
</head>
<body>
<!--/*@thymesvar id="groups" type="java.util.List"*/-->

    <h2 th:text="#{admin.groups.title('Administration')}" style="margin-bottom:1rem">Administration — Groupes</h2>

    <div class="card" style="margin-bottom:1.5rem">
        <h3 th:text="#{admin.groups.create.title}" style="margin-bottom:0.75rem">Créer un groupe</h3>
        <form th:action="@{/admin/groups}" method="post"
              ws:post="@{/admin/groups}" ws:swap="none" data-groups-create-form> <!-- nosemgrep -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:flex-end">
                <div class="form-group" style="margin:0">
                    <label th:for="create-key" th:text="#{admin.groups.column.key}">Clé</label>
                    <input id="create-key" type="text" name="key" class="form-control"
                           th:placeholder="#{admin.groups.create.key_placeholder}" required/>
                </div>
                <div class="form-group" style="margin:0">
                    <label th:for="create-name" th:text="#{admin.groups.column.name}">Nom</label>
                    <input id="create-name" type="text" name="name" class="form-control"
                           th:placeholder="#{admin.groups.create.name_placeholder}" required/>
                </div>
                <div class="form-group" style="margin:0">
                    <label th:for="create-desc" th:text="#{admin.groups.column.description}">Description</label>
                    <input id="create-desc" type="text" name="description" class="form-control"
                           th:placeholder="#{admin.groups.create.desc_placeholder}"/>
                </div>
                <button type="submit" class="btn btn-sm btn-primary" th:text="#{admin.groups.create.button}">+ Créer</button>
            </div>
        </form>
    </div>

    <div data-groups-card>
        <div class="text-muted" data-groups-empty th:style="${#lists.isEmpty(groups)} ? '' : 'display:none'">
            <p th:text="#{admin.groups.empty}">Aucun groupe défini.</p>
        </div>

        <div class="card" data-groups-table th:style="${#lists.isEmpty(groups)} ? 'display:none' : ''">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th th:text="#{admin.groups.column.key}">Clé</th>
                            <th th:text="#{admin.groups.column.name}">Nom</th>
                            <th th:text="#{admin.groups.column.description}">Description</th>
                            <th th:text="#{admin.groups.column.member_count}">Membres</th>
                            <th th:text="#{admin.groups.column.actions}">Actions</th>
                        </tr>
                    </thead>
                    <tbody data-groups-body>
                        <tr th:each="g : ${groups}" th:attr="data-group-id=${g.id}">
                            <td><code data-field="key" th:text="${g.key}"></code></td>
                            <td data-field="name" th:text="${g.name}"></td>
                            <td data-field="description" th:text="${g.description ?: '—'}"></td>
                            <td data-field="memberCount" th:text="${g.memberCount}"></td>
                            <td th:insert="~{fragments/admin-groups :: actions(${g.id}, ${g.name}, ${g.description})}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Row template cloned by admin-groups.js on group.created. IDPLACEHOLDER is
         replaced with the real group id and [data-field] cells are filled.
         (Avoid a __x__ token: Thymeleaf treats double underscores as preprocessing.) -->
    <template data-groups-row-tpl>
        <tr data-group-id="">
            <td><code data-field="key"></code></td>
            <td data-field="name"></td>
            <td data-field="description"></td>
            <td data-field="memberCount"></td>
            <td th:insert="~{fragments/admin-groups :: actions('IDPLACEHOLDER', '', '')}"></td>
        </tr>
    </template>
</body>
</html>
