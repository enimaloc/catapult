<!--/*@thymesVar id="channelPage" type="fr.enimaloc.catapult.common.dto.channel.ChannelPageData"*/-->
<!--/*@thymesVar id="integrations" type="java.util.List<fr.enimaloc.catapult.dto.integration.IntegrationDto>"*/-->
<mdui-tab-panel slot="panel" value="integrations" th:if="${channelPage.isOwner()}" th:fragment="panel"
                xmlns:spa="urn:fr.enimaloc.catapult:spa">
    <div class="section-header">
        <h2 th:text="#{channel.connections.title}">Connexions</h2>
    </div>

    <!--/* Cards are built by IntegrationCards: every state is pre-rendered and toggled with the
         `hidden` class, by visibility.js (spa:state) or channel-connections.js. */-->
    <div id="channel-connections">
        <mdui-card th:each="integration : ${integrations}" class="connection-card" variant="outlined"
                   th:attr="data-conn=${integration.id()}">
            <span th:replace="~{pages/channel-tab/integrations :: message(${integration.name()})}">Twitch</span>
            <th:block th:each="node : ${integration.nodes()}"><th:block th:insert="~{pages/channel-tab/integrations :: node(${node})}"></th:block></th:block>
        </mdui-card>
    </div>
</mdui-tab-panel>

<!--/* A Message as a <span>: its key resolved with its arguments, or its literal. */-->
<span th:fragment="message(m)"
      th:text="${m.isKey()} ? ${#messages.msgWithParams(m.key(), m.argsArray())} : ${m.literal()}"></span>

<!--/* One IntegrationNode, recursing into Container children. */-->
<th:block th:fragment="node(n)" th:switch="${n.type()}"
          th:with="text=${n.text() == null ? null : (n.text().isKey() ? #messages.msgWithParams(n.text().key(), n.text().argsArray()) : n.text().literal())}"
          xmlns:spa="urn:fr.enimaloc.catapult:spa">
    <span th:case="'span'" th:id="${n.attrs().id()}" th:classappend="${n.attrs().className()}"
          spa:state="${n.attrs().state()}" th:text="${text}"></span>
    <p th:case="'paragraph'" th:id="${n.attrs().id()}" th:classappend="${n.attrs().className()}"
       spa:state="${n.attrs().state()}" th:text="${text}"></p>
    <mdui-chip th:case="'chip'" th:id="${n.attrs().id()}" th:classappend="${n.attrs().className()}"
               spa:state="${n.attrs().state()}" th:text="${text}"></mdui-chip>
    <input th:case="'input'" th:type="${n.inputType()}" th:id="${n.attrs().id()}"
           th:classappend="${n.attrs().className()}" spa:state="${n.attrs().state()}"
           th:placeholder="${text}"
           th:aria-label="${n.ariaLabel().isKey() ? #messages.msgWithParams(n.ariaLabel().key(), n.ariaLabel().argsArray()) : n.ariaLabel().literal()}"
           th:value="${n.value()}" th:min="${n.min()}" th:max="${n.max()}"/>
    <label th:case="'switch'">
        <mdui-switch th:id="${n.attrs().id()}" th:classappend="${n.attrs().className()}"
                     spa:state="${n.attrs().state()}" th:checked="${n.checked()}"></mdui-switch>
        <span th:text="${text}"></span>
    </label>
    <mdui-select th:case="'select'" variant="outlined" th:id="${n.attrs().id()}"
                 th:classappend="${n.attrs().className()}" spa:state="${n.attrs().state()}"
                 th:value="${n.value()}" th:label="${text}">
        <mdui-menu-item th:each="option : ${n.options()}" th:value="${option.value()}"
                        th:text="${option.text().isKey() ? #messages.msgWithParams(option.text().key(), option.text().argsArray()) : option.text().literal()}"></mdui-menu-item>
    </mdui-select>
    <mdui-segmented-button th:case="'segmented-button'" th:id="${n.attrs().id()}"
                           th:classappend="${n.attrs().className()}" spa:state="${n.attrs().state()}"
                           th:text="${text}"></mdui-segmented-button>
    <mdui-button th:case="'button'" th:id="${n.attrs().id()}" th:classappend="${n.attrs().className()}"
                 spa:state="${n.attrs().state()}" th:text="${text}"></mdui-button>
    <div th:case="'div'" th:id="${n.attrs().id()}" th:classappend="${n.attrs().className()}"
         spa:state="${n.attrs().state()}">
        <th:block th:each="child : ${n.children()}"><th:block th:insert="~{pages/channel-tab/integrations :: node(${child})}"></th:block></th:block>
    </div>
    <mdui-segmented-button-group th:case="'segmented-group'" th:id="${n.attrs().id()}"
                                 th:classappend="${n.attrs().className()}" spa:state="${n.attrs().state()}">
        <th:block th:each="child : ${n.children()}"><th:block th:insert="~{pages/channel-tab/integrations :: node(${child})}"></th:block></th:block>
    </mdui-segmented-button-group>
    <th:block th:case="'raw'" th:utext="${n.html()}"></th:block>
</th:block>
