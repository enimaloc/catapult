<!--/*@thymesVar id="channelPage" type="fr.enimaloc.catapult.common.dto.channel.ChannelPageData"*/-->
<!--/*@thymesVar id="commandMigration" type="fr.enimaloc.catapult.controller.CommandMigration"*/-->
<!--/* The owner's alone, and only while they have chat commands to move (the model's `commandMigration`). */-->
<mdui-tab-panel slot="panel" value="commands" th:if="${channelPage.isOwner() and commandMigration != null}" th:fragment="panel">
    <div class="section-header">
        <div class="title-row">
            <h2 th:text="#{channel.tab.commands}">Commandes</h2>
        </div>
    </div>

    <div class="channel-commands">
        <th:block th:insert="~{pages/channel-tab/commands :: command-migration(${commandMigration})}"></th:block>
    </div>
</mdui-tab-panel>

<!--/* The chat commands moving to another chat bot (CommandMigration), laid out as a connection card:
     a tool picked from the menu shows its steps, then what to paste per command, each in a read-only
     field with its copy button; channel-command-migration.js switches the tool and copies. */-->
<!--/*@thymesVar id="m" type="fr.enimaloc.catapult.controller.CommandMigration"*/-->
<mdui-card th:fragment="command-migration(m)" id="command-migration" class="connection-card command-migration sentry-block" variant="outlined"
           th:attr="data-label-copied=#{channel.commands.migration.copied},data-label-copy-failed=#{channel.commands.migration.copy_failed}">
    <span th:text="#{channel.commands.migration.title}">Tes commandes de chat</span>
    <mdui-chip th:text="#{channel.commands.migration.retiring}">Bientôt retirées</mdui-chip>
    <p th:text="#{channel.commands.migration.intro}">Les commandes de chat de catapult vont être retirées.</p>
    <p th:text="#{channel.commands.migration.overlap}">Deux réponses peuvent apparaître.</p>
    <p th:text="#{channel.commands.migration.token}">Ces liens contiennent le jeton de ton widget.</p>
    <div class="command-migration-tool">
        <mdui-select id="command-migration-tool" variant="outlined" th:value="${m.tools()[0].id()}"
                     th:attr="label=#{channel.commands.migration.tool}">
            <mdui-menu-item th:each="tool : ${m.tools()}" th:value="${tool.id()}"
                            th:text="#{|channel.commands.migration.${tool.id()}.name|}">Tool</mdui-menu-item>
        </mdui-select>
    </div>
    <div th:each="tool, it : ${m.tools()}" class="command-migration-panel" th:classappend="${it.first} ? '' : 'hidden'"
         th:attr="data-tool=${tool.id()}">
        <ol class="command-migration-steps">
            <li th:each="i : ${#numbers.sequence(1, tool.steps())}" th:text="#{|channel.commands.migration.${tool.id()}.step${i}|}">step</li>
        </ol>
        <section class="command-migration-row" th:each="row : ${tool.rows()}">
            <div class="command-migration-head">
                <span class="command-migration-name" th:text="${row.command()}">!game</span>
                <mdui-chip th:text="#{|channel.commands.migration.role.${row.role()}|}">Tout le monde</mdui-chip>
            </div>
            <mdui-text-field th:each="line : ${row.lines()}" readonly variant="outlined"
                             th:attr="label=#{|channel.commands.migration.line.${line.label()}|},value=${line.value()}">
                <mdui-button-icon slot="end-icon" icon="content_copy" class="command-migration-copy"
                                  th:attr="data-copy=${line.value()},aria-label=#{channel.commands.migration.copy}"></mdui-button-icon>
            </mdui-text-field>
        </section>
    </div>
    <p th:unless="${m.unmatched().isEmpty()}"
       th:text="#{channel.commands.migration.unmatched(${#strings.listJoin(m.unmatched(), ', ')})}">!setgame n'a pas d'équivalent.</p>
</mdui-card>
