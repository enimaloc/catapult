<!--/*@thymesVar id="channelPage" type="fr.enimaloc.catapult.common.dto.channel.ChannelPageData"*/-->
<!--/* The owner's account, not the channel's (the Settings tab, which moderators share): where else
     notifications reach them, and the account's deletion. The owner's alone, as catapult-api refuses
     anyone else on both. */-->
<mdui-tab-panel slot="panel" value="account" th:if="${channelPage.isOwner()}" th:fragment="panel">
    <div class="section-header">
        <div class="title-row">
            <h2 th:text="#{channel.account.title}">Compte</h2>
        </div>
    </div>

    <mdui-card th:replace="~{fragments/notification-channels :: card(${notificationChannels})}"></mdui-card>

    <mdui-card id="channel-danger-zone" class="settings-card danger-zone-card" variant="outlined"
               th:if="${dangerZone != null}" th:attr="data-username=${username},data-label-refused=#{channel.settings.danger.error.refused},data-label-unavailable=#{channel.settings.danger.error.unavailable}">
        <div class="title-row">
            <h3 th:text="${dangerZone.pending()} ? #{channel.settings.danger.pending_title} : #{channel.settings.danger.title}">Zone danger</h3>
            <mdui-button-icon th:replace="~{fragments/controls :: helpButton('danger-zone')}"></mdui-button-icon>
        </div>
        <th:block th:if="${dangerZone.pending()}">
            <p th:if="${dangerZone.deletesAt() != null}">
                <span th:text="#{channel.settings.danger.pending_description(${#temporals.format(dangerZone.deletesAt(), #messages.msg('format.date'))})}">Ton compte sera supprimé le</span>
                <span data-live-time="countdown" th:attr="datetime=${dangerZone.deletesAt()},data-label-future=#{channel.settings.danger.pending_countdown('{0}')}"></span>
            </p>
            <mdui-button id="danger-zone-cancel-btn" variant="tonal" th:text="#{channel.settings.danger.cancel_button}">Annuler la suppression</mdui-button>
        </th:block>
        <th:block th:unless="${dangerZone.pending()}">
            <p th:utext="#{channel.settings.danger.description(${dangerZone.delayDays()})}">Irréversible</p>
            <mdui-button id="danger-zone-delete-btn" variant="filled" th:text="#{channel.settings.danger.delete_button}">Supprimer mon compte</mdui-button>
            <mdui-dialog id="danger-zone-delete-dialog" close-on-overlay-click
                         th:attr="headline=#{channel.settings.danger.dialog.title}">
                <p th:text="#{channel.settings.danger.dialog.prompt}">Saisis ton nom</p>
                <mdui-text-field name="confirmUsername" variant="outlined" autocomplete="off"
                                 th:attr="placeholder=#{channel.settings.danger.dialog.placeholder}"></mdui-text-field>
                <mdui-button slot="action" variant="text" class="danger-zone-dismiss" th:text="#{channel.settings.danger.dialog.dismiss}">Annuler</mdui-button>
                <mdui-button slot="action" variant="filled" class="danger-zone-confirm" disabled
                             th:text="#{channel.settings.danger.dialog.confirm}">Supprimer définitivement</mdui-button>
            </mdui-dialog>
        </th:block>
    </mdui-card>
</mdui-tab-panel>
