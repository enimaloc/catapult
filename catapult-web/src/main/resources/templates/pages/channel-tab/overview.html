<!--/*@thymesVar id="channelPage" type="fr.enimaloc.catapult.common.dto.channel.ChannelPageData"*/-->
<!--/*@thymesVar id="app" type="fr.enimaloc.catapult.controller.ModelFiller$AppModel"*/-->
<mdui-tab-panel slot="panel" value="overview" th:with="ch=${channelPage}" th:fragment="panel" xmlns:spa="urn:fr.enimaloc.catapult:spa">
    <div class="section-header">
        <h2 th:text="#{channel.status.title}">Statut</h2>
    </div>

    <mdui-card class="status-card" variant="outlined">
        <div class="status-row">
            <mdui-chip id="channel-state-live" spa:if="live:${ch.isLive()}"
                       spa:on="live:ChannelLiveStateEvent.state"
                       th:text="#{channel.status.live}">channel.status.live
            </mdui-chip>
            <mdui-chip id="channel-state-offline" spa:if="offline:${!ch.isLive()}"
                       spa:on="offline:ChannelLiveStateEvent.!state"
                       th:text="#{channel.status.offline}">channel.status.offline
            </mdui-chip>

            <span id="channel-current-game" spa:if="hasGame:${ch.currentGame() != null}"
                  spa:on="hasGame:GameChangedEvent"
                  spa:value="textContent:GameChangedEvent.sourceName"
                  th:text="${ch.currentGame() != null ? ch.currentGame().sourceName() : ''}">Game</span>
            <mdui-chip id="channel-current-platform" spa:if="hasGame:${ch.currentGame() != null}"
                       spa:on="hasGame:GameChangedEvent"
                       spa:value="textContent:GameChangedEvent.sourceType"
                       th:text="${ch.currentGame() != null ? ch.currentGame().sourceType() : ''}">Game
            </mdui-chip>
            <!-- noGame has no spa:on: no event signals a detected game being cleared yet
                 (only GameChangedEvent exists), so this direction only ever updates on
                 the next full render — known gap, not something spa:on can fix alone. -->
            <span id="channel-no-game" spa:if="noGame:${ch.currentGame() == null}"
                  th:text="#{channel.status.no_game}">Aucun jeu détecté</span>

            <mdui-button-icon icon="refresh" th:if="${ch.isOwner()}"
                              th:attr="data-recheck-url=@{/channel/{u}/game/recheck(u=${ch.channelUsername()})}"
                              id="channel-recheck-game"></mdui-button-icon>
        </div>

        <div class="bot-toggle-row" th:if="${ch.isOwner()}">
            <mdui-switch th:checked="${ch.botEnabled()}"
                         th:attr="data-toggle-url=@{/channel/{u}/settings/bot(u=${ch.channelUsername()})}"
                         spa:value="checked:BotStateChangedEvent.state"
                         id="channel-bot-toggle"></mdui-switch>
            <label for="channel-bot-toggle" th:text="#{channel.status.bot_enabled}">Bot activé</label>
        </div>
    </mdui-card>

    <mdui-card id="channel-dtdd-mapping-card" class="settings-card" variant="outlined"
               th:if="${dtddMapping != null and dtddMapping.igdbId() != null}"
               th:attr="data-igdb-id=${dtddMapping.igdbId()}">
        <h3 th:text="#{channel.dtdd.title}">Association DTDD</h3>

        <div th:if="${dtddMapping.current() != null}">
            <span th:text="${dtddMapping.current().name() ?: '—'}">DTDD name</span>
            <mdui-chip th:text="${dtddMapping.current().confidence() * 100} + '%'">confidence</mdui-chip>
            <mdui-chip th:if="${dtddMapping.current().verified()}" th:text="#{channel.dtdd.verified}">
                Vérifié
            </mdui-chip>
        </div>
        <div th:unless="${dtddMapping.current() != null}" th:text="#{channel.dtdd.no_mapping}">
            Aucune association DTDD.
        </div>

        <mdui-button th:if="${dtddMapping.canValidateDirectly()}" id="dtdd-validate-btn"
                     th:text="#{channel.dtdd.validate}">
            Valider
        </mdui-button>
        <mdui-button id="dtdd-correct-btn" th:text="#{channel.dtdd.correct}">Corriger</mdui-button>

        <div id="dtdd-search-dialog" hidden>
            <input type="text" id="dtdd-search-input" th:placeholder="#{channel.dtdd.search_placeholder}"
                   th:aria-label="#{channel.dtdd.search_placeholder}"/>
            <mdui-list id="dtdd-search-results"></mdui-list>
        </div>
    </mdui-card>

    <div class="section-header">
        <h2 th:text="#{channel.bindings.title}">Associations</h2>
        <mdui-segmented-button-group class="bindings-filters">
            <mdui-segmented-button data-link th:href="@{/channel/{u}(u=${ch.channelUsername()})}"
                                   th:classappend="${ch.filterStatus() == null and ch.filterSource() == null} ? 'filter-active'"
                                   th:text="#{channel.bindings.filter.all}">Toutes
            </mdui-segmented-button>
            <mdui-segmented-button data-link
                                   th:each="status : ${ {'AUTO', 'MANUAL', 'INCOMPLETE'} }"
                                   th:href="@{/channel/{u}(u=${ch.channelUsername()},status=${status})}"
                                   th:classappend="${ch.filterStatus() == status} ? 'filter-active'"
                                   th:text="#{${'channel.bindings.filter.' + #strings.toLowerCase(status)}}">Auto
            </mdui-segmented-button>
            <mdui-segmented-button data-link
                                   th:each="platform : ${app.platforms}"
                                   th:href="@{/channel/{u}(u=${ch.channelUsername()},source=${platform.id().toUpperCase()})}"
                                   th:classappend="${ch.filterSource() == platform.id().toUpperCase()} ? 'filter-active'"
                                   th:text="#{${platform.titleKey()}}">platform
            </mdui-segmented-button>
        </mdui-segmented-button-group>
    </div>

    <mdui-list id="channel-bindings-list">
        <mdui-collapse accordion th:if="${!ch.bindings().content().isEmpty()}"
                       th:value="${ch.currentGame()?.bindingId()}">
            <mdui-collapse-item th:each="b : ${ch.bindings().content()}"
                                th:attr="data-binding-id=${b.id()},disabled=${!ch.isOwner()} ? 'disabled'"
                                th:value="${b.id()}"
                                th:class="${ch.currentGame()?.bindingId() == b.id() ? 'is-open' : ''}">
                <mdui-list-item slot="header">
                    <!-- spa:value only mirrors the twitchGameName branch: BindingUpdatedEvent
                         never carries sourceName (ApiChannelActionsController's update action
                         only ever touches twitchGameName/ccls), so there's nothing to keep a
                         sourceName-primary live update in sync with — same limitation the
                         hand-written updateBindingGame() already had. -->
                    <span class="binding-game-name"
                          spa:value="textContent:BindingUpdatedEvent.twitchGameName|—"
                          th:text="${b.sourceName() ?: b.twitchGameName() ?: '—'}"></span>
                    <span class="binding-platform-chips" th:text="${b.sourceType()}"></span>
                    <span th:text="${b.status()}"></span>
                </mdui-list-item>
                <mdui-list-item th:if="${ch.isOwner()}">
                    <div class="binding-toggle">
                        <mdui-switch th:id="'binding-ignored-toggle-' + ${b.id()}"
                                     class="binding-ignored-toggle"
                                     data-post="ignored-toggle" data-key="ignored"
                                     spa:value="checked:BindingIgnoredStateEvent.ignored"
                                     th:checked="${b.ignored()}"></mdui-switch>
                        <label th:for="'binding-ignored-toggle-' + ${b.id()}"
                               th:text="#{channel.bindings.ignored}">Ignoré</label>
                    </div>
                    <mdui-button-icon icon="delete" data-post="delete"
                                      class="binding-delete-btn"></mdui-button-icon>

                    <div class="binding-edit-panel">
                        <input type="text" class="binding-edit-game-input"
                               th:placeholder="#{channel.bindings.edit.game_placeholder}"
                               th:aria-label="#{channel.bindings.edit.game_placeholder}"
                               th:value="${b.twitchGameName()}"/>
                        <input type="hidden" class="binding-edit-game-id" th:value="${b.twitchGameId()}"/>
                        <mdui-list class="binding-edit-game-results"></mdui-list>
                    </div>

                    <div class="binding-ccl-panel">
                        <label class="binding-toggle">
                            <mdui-switch class="binding-ccl-enabled"
                                         th:id="'binding-ccl-toggle-' + ${b.id()}"
                                         th:checked="${b.cclEnabled()}"
                                         spa:value="checked:CclStateEvent.enabled"
                                         data-post="ccl-toggle" data-key="enabled"></mdui-switch>
                            <span th:text="#{channel.bindings.ccl.enabled}">Activer les CCL</span>
                        </label>
                        <label th:each="ccl : ${ch.availableCcls()}">
                            <mdui-switch class="binding-edit-ccl-checkbox" th:value="${ccl.id()}"
                                         spa:in="checked:BindingUpdatedEvent.ccls"
                                         th:checked="${b.ccls().contains(ccl.id())}"
                                         th:disabled="${ch.blockedCcls().contains(ccl.id())}"></mdui-switch>
                            <span th:text="${ccl.name()}">ccl name</span>
                        </label>
                    </div>

                    <div class="binding-tw-panel">
                        <label>
                            <mdui-switch class="binding-tw-enabled-checkbox"
                                         spa:value="checked:TwEnabledStateEvent.enabled"
                                         th:checked="${b.twEnabled()}"></mdui-switch>
                            <span th:text="#{channel.bindings.tw.enabled}">Activer les avertissements</span>
                        </label>
                        <label th:each="tw : ${ch.availableTws()}">
                            <!-- TwResetEvent carries no `tws` field at all; looking it up as the
                                 array source still works here because an absent field resolves
                                 to "not a member" (false) — exactly what a reset should do. -->
                            <mdui-switch class="binding-tw-checkbox" th:value="${tw.id()}"
                                         spa:in="checked:TwUpdatedEvent.tws,checked:TwResetEvent.tws"
                                         th:checked="${b.tws().contains(tw.id())}"></mdui-switch>
                            <span th:text="${tw.label()}">tw label</span>
                        </label>
                        <mdui-button spa:if="hasOverride:${b.twOverride()}" class="binding-tw-reset-btn"
                                     spa:on="hasOverride:TwUpdatedEvent.tws,hasOverride:!TwResetEvent"
                                     th:text="#{channel.bindings.tw.reset}">Réinitialiser
                        </mdui-button>
                    </div>
                </mdui-list-item>
            </mdui-collapse-item>
        </mdui-collapse>
        <!-- Always rendered (instead of created on demand) so removeBinding() only ever
             reveals an already-translated element — no translated label needs stashing
             in a data-* attribute for JS to read, unlike the old data-empty-text. -->
        <mdui-list-item id="channel-bindings-empty"
                        th:class="${!ch.bindings().content().isEmpty()} ? 'hidden' : ''"
                        th:text="#{channel.bindings.empty}">
            Aucune association.
        </mdui-list-item>
    </mdui-list>

    <div class="bindings-pagination" th:if="${ch.bindings().totalPages() > 1}">
        <a data-link th:unless="${ch.bindings().first()}"
           th:href="@{/channel/{u}(u=${ch.channelUsername()},page=${ch.bindings().number()-1},status=${ch.filterStatus()},source=${ch.filterSource()})}"
           th:text="#{channel.bindings.prev}">Précédent</a>
        <span th:text="${ch.bindings().number()+1} + ' / ' + ${ch.bindings().totalPages()}">1 / 1</span>
        <a data-link th:unless="${ch.bindings().last()}"
           th:href="@{/channel/{u}(u=${ch.channelUsername()},page=${ch.bindings().number()+1},status=${ch.filterStatus()},source=${ch.filterSource()})}"
           th:text="#{channel.bindings.next}">Suivant</a>
    </div>
</mdui-tab-panel>
