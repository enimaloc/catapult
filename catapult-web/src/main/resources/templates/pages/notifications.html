<!--/*@thymesVar id="notifications" type="fr.enimaloc.catapult.common.dto.admin.AdminPage<fr.enimaloc.catapult.common.dto.notification.NotificationDto>"*/-->
<!--/* The member's notification history, 20 a page, newest first. Items are the bell's (fragments/notifications :: item) and notifications.js drives both; data-page tells it whether live notifications belong on top of this page. */-->
<mdui-layout-main th:fragment="notifications">
    <section class="section channel-section">
        <div class="section-header channel-header">
            <div>
                <span class="eyebrow" th:text="#{notifications.page.eyebrow}">notifications.page.eyebrow</span>
                <h1 th:text="#{notifications.page.title}">notifications.page.title</h1>
            </div>
            <mdui-button th:if="${notifications != null}" variant="tonal" icon="done_all" data-notifications-read-all
                         th:text="#{notifications.mark_all_read}">notifications.mark_all_read</mdui-button>
        </div>

        <!--/* Where else notifications reach the member; notification-channels.js saves each switch. */-->
        <mdui-card th:if="${notificationChannels != null}" id="notification-channels" class="settings-card" variant="outlined">
            <h3 th:text="#{notifications.channels.title}">notifications.channels.title</h3>
            <p class="notification-channel-hint" th:text="#{notifications.channels.site}">notifications.channels.site</p>
            <div class="notification-channel">
                <label>
                    <mdui-switch data-channel="TWITCHAT"
                                 th:checked="${notificationChannels.channels().contains(T(fr.enimaloc.catapult.common.dto.notification.NotificationChannel).TWITCHAT)}"></mdui-switch>
                    <span th:text="#{notifications.channels.twitchat}">notifications.channels.twitchat</span>
                </label>
                <p class="notification-channel-hint" th:text="#{notifications.channels.twitchat.hint}">notifications.channels.twitchat.hint</p>
            </div>
            <div class="notification-channel">
                <label>
                    <mdui-switch data-channel="STREAM_START_CHAT"
                                 th:checked="${notificationChannels.channels().contains(T(fr.enimaloc.catapult.common.dto.notification.NotificationChannel).STREAM_START_CHAT)}"></mdui-switch>
                    <span th:text="#{notifications.channels.chat}">notifications.channels.chat</span>
                </label>
                <p class="notification-channel-hint" th:text="#{notifications.channels.chat.hint}">notifications.channels.chat.hint</p>
            </div>
        </mdui-card>

        <mdui-card th:if="${notifications == null}" id="notifications-page-unavailable" class="settings-card admin-placeholder" variant="outlined">
            <mdui-icon name="error_outline"></mdui-icon>
            <span th:text="#{notifications.unavailable}">notifications.unavailable</span>
        </mdui-card>

        <th:block th:if="${notifications != null}">
            <!--/* notifications.js builds live items from the bell menu's template, or this one while the menu has not loaded. */-->
            <th:block th:replace="~{fragments/notifications :: itemTemplate('notification-page-item-template')}"></th:block>
            <div id="notifications-page" class="notification-list" th:attr="data-page=${notifications.number()}">
                <th:block th:each="n : ${notifications.content()}"><th:block th:replace="~{fragments/notifications :: item(${n})}"></th:block></th:block>
                <p class="notification-empty" th:hidden="${!#lists.isEmpty(notifications.content())}"
                   th:text="#{notifications.empty}">notifications.empty</p>
            </div>

            <div class="admin-pagination" th:if="${notifications.totalPages() > 1}">
                <mdui-button-icon icon="chevron_left" data-link th:disabled="${notifications.first()}"
                                  th:attr="href=@{/notifications(page=${notifications.number() - 1})},aria-label=#{admin.pagination.previous}"></mdui-button-icon>
                <span th:text="|${notifications.number() + 1} / ${notifications.totalPages()}|">1 / 1</span>
                <mdui-button-icon icon="chevron_right" data-link th:disabled="${notifications.last()}"
                                  th:attr="href=@{/notifications(page=${notifications.number() + 1})},aria-label=#{admin.pagination.next}"></mdui-button-icon>
            </div>
        </th:block>
    </section>
</mdui-layout-main>
