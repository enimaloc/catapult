<mdui-layout-main th:fragment="channel" xmlns:spa="urn:fr.enimaloc.catapult:spa">
    <!--/*@thymesVar id="channelPage" type="fr.enimaloc.catapult.common.dto.ChannelPageData"*/-->
    <!--/*@thymesVar id="app" type="fr.enimaloc.catapult.controller.ModelFiller$AppModel"*/-->
    <section class="section channel-section">
        <div class="section-header channel-header">
            <mdui-avatar class="channel-header-avatar" th:src="${channelPage.channelUser().profileImageUrl()}"></mdui-avatar>
            <div>
                <span class="eyebrow" th:text="#{channel.eyebrow}">channel.eyebrow</span>
                <h1 th:text="${channelPage.channelUser().twitchUsername()}">username</h1>
            </div>
        </div>

        <!-- The active tab is mirrored into location.hash by channel-page.js, so a
             CatapultChannel.refresh() (which re-renders this whole fragment) lands back
             on the same tab instead of resetting to the overview. -->
        <mdui-tabs id="channel-tabs" class="channel-tabs" value="overview" placement="top"
                   th:classappend="${!channelPage.isOwner()} ? 'channel-tabs-single'">
            <mdui-tab value="overview" th:text="#{channel.tab.overview}">channel.tab.overview</mdui-tab>
            <mdui-tab value="settings" th:if="${channelPage.isOwner()}" th:text="#{channel.tab.settings}">channel.tab.settings</mdui-tab>
            <mdui-tab value="integrations" th:if="${channelPage.isOwner()}" th:text="#{channel.tab.integrations}">channel.tab.integrations</mdui-tab>

            <th:block th:replace="~{pages/channel-tab/overview::panel}"></th:block>
            <th:block th:replace="~{pages/channel-tab/settings::panel}"></th:block>
            <th:block th:replace="~{pages/channel-tab/integrations::panel}"></th:block>
        </mdui-tabs>
    </section>
</mdui-layout-main>
