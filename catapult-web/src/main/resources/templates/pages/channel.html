<mdui-layout-main th:fragment="channel" xmlns:spa="urn:fr.enimaloc.catapult:spa">
    <!--/*@thymesVar id="channelPage" type="fr.enimaloc.catapult.common.dto.channel.ChannelPageData"*/-->
    <!--/*@thymesVar id="app" type="fr.enimaloc.catapult.controller.ModelFiller$AppModel"*/-->
    <section class="section channel-section">
        <div class="section-header channel-header">
            <mdui-avatar class="channel-header-avatar" th:src="${channelPage.channelUser().profileImageUrl()}"></mdui-avatar>
            <div>
                <span class="eyebrow" th:text="#{channel.eyebrow}">channel.eyebrow</span>
                <h1 th:text="${channelPage.channelUser().twitchUsername()}">username</h1>
            </div>
        </div>

        <!-- The active tab is mirrored into location.hash by channel-page.js, so a
             CatapultChannel.refresh() (which re-renders this whole fragment) lands back
             on the same tab instead of resetting to the overview. -->
        <mdui-tabs id="channel-tabs" class="channel-tabs" value="overview" placement="top" data-hash-tabs>
            <mdui-tab value="overview"><th:block th:text="#{channel.tab.overview}">channel.tab.overview</th:block><th:block th:replace="~{fragments/new-feature :: dot('channel.overview')}"></th:block></mdui-tab>
            <mdui-tab value="settings"><th:block th:text="#{channel.tab.settings}">channel.tab.settings</th:block><th:block th:replace="~{fragments/new-feature :: dot('channel.settings')}"></th:block></mdui-tab>
            <mdui-tab value="integrations" th:if="${channelPage.isOwner()}"><th:block th:text="#{channel.tab.integrations}">channel.tab.integrations</th:block><th:block th:replace="~{fragments/new-feature :: dot('channel.integrations')}"></th:block></mdui-tab>
            <mdui-tab value="commands" th:if="${channelPage.isOwner() and commandMigration != null}"><th:block th:text="#{channel.tab.commands}">channel.tab.commands</th:block><th:block th:replace="~{fragments/new-feature :: dot('channel.commands')}"></th:block></mdui-tab>
            <mdui-tab value="invitations" th:if="${channelPage.isOwner()}"><th:block th:text="#{channel.tab.invitations}">channel.tab.invitations</th:block><th:block th:replace="~{fragments/new-feature :: dot('channel.invitations')}"></th:block></mdui-tab>

            <th:block th:replace="~{pages/channel-tab/overview::panel}"></th:block>
            <th:block th:replace="~{pages/channel-tab/settings::panel}"></th:block>
            <th:block th:replace="~{pages/channel-tab/integrations::panel}"></th:block>
            <th:block th:replace="~{pages/channel-tab/commands::panel}"></th:block>
            <th:block th:replace="~{pages/channel-tab/invitations::panel}"></th:block>
        </mdui-tabs>
    </section>
</mdui-layout-main>
