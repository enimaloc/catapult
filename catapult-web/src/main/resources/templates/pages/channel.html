<mdui-layout-main th:fragment="channel">
    <section class="section channel-section" th:with="ch=${channelPage}">
        <div class="section-header">
            <span class="eyebrow" th:text="${ch.channelUser().twitchUsername()}">username</span>
            <h1 th:text="#{channel.status.title}">Statut</h1>
        </div>

        <mdui-card class="status-card" variant="outlined">
            <div class="status-row">
                <mdui-chip th:if="${ch.isLive()}" th:text="#{channel.status.live}">En direct</mdui-chip>
                <mdui-chip th:unless="${ch.isLive()}" th:text="#{channel.status.offline}">Hors ligne</mdui-chip>

                <span th:if="${ch.currentGame() != null}" th:text="${ch.currentGame().sourceName()}">Game</span>
                <span th:unless="${ch.currentGame() != null}" th:text="#{channel.status.no_game}">Aucun jeu détecté</span>

                <mdui-button-icon icon="refresh" th:if="${ch.isOwner()}"
                                   th:attr="data-recheck-url=@{/channel/{u}/game/recheck(u=${ch.channelUsername()})}"
                                   id="channel-recheck-game"></mdui-button-icon>
            </div>

            <mdui-switch th:if="${ch.isOwner()}" th:checked="${ch.botEnabled()}"
                         th:attr="data-toggle-url=@{/channel/{u}/settings/bot(u=${ch.channelUsername()})}"
                         id="channel-bot-toggle"></mdui-switch>
            <label th:if="${ch.isOwner()}" for="channel-bot-toggle" th:text="#{channel.status.bot_enabled}">Bot activé</label>
        </mdui-card>

        <div class="section-header">
            <h2 th:text="#{channel.bindings.title}">Associations</h2>
            <div class="bindings-filters">
                <a data-link th:href="@{/channel/{u}(u=${ch.channelUsername()})}" th:text="#{channel.bindings.filter.all}">Toutes</a>
                <a data-link th:href="@{/channel/{u}(u=${ch.channelUsername()},status='AUTO')}" th:text="#{channel.bindings.filter.auto}">Auto</a>
                <a data-link th:href="@{/channel/{u}(u=${ch.channelUsername()},status='MANUAL')}" th:text="#{channel.bindings.filter.manual}">Manuel</a>
                <a data-link th:href="@{/channel/{u}(u=${ch.channelUsername()},status='INCOMPLETE')}" th:text="#{channel.bindings.filter.incomplete}">Incomplet</a>
                <a data-link th:href="@{/channel/{u}(u=${ch.channelUsername()},source='STEAM')}" th:text="#{channel.bindings.filter.steam}">Steam</a>
            </div>
        </div>

        <mdui-list id="channel-bindings-list">
            <mdui-list-item th:each="b : ${ch.bindings().content()}" th:attr="data-binding-id=${b.id()}">
                <span th:text="${b.twitchGameName() ?: '—'}">Game</span>
                <mdui-chip th:each="ccl : ${b.ccls()}" th:text="${ccl}">ccl</mdui-chip>
                <span th:text="${b.status()}">STATUS</span>
                <mdui-switch th:if="${ch.isOwner()}" class="binding-ccl-toggle" th:checked="${b.cclEnabled()}"></mdui-switch>
                <mdui-switch th:if="${ch.isOwner()}" class="binding-ignored-toggle" th:checked="${b.ignored()}"></mdui-switch>
            </mdui-list-item>
            <mdui-list-item th:if="${ch.bindings().content().isEmpty()}" th:text="#{channel.bindings.empty}">
                Aucune association.
            </mdui-list-item>
        </mdui-list>

        <div class="bindings-pagination" th:if="${ch.bindings().totalPages() > 1}">
            <a data-link th:unless="${ch.bindings().first()}"
               th:href="@{/channel/{u}(u=${ch.channelUsername()},page=${ch.bindings().number()-1},status=${ch.filterStatus()},source=${ch.filterSource()})}"
               th:text="#{channel.bindings.prev}">Précédent</a>
            <span th:text="${ch.bindings().number()+1} + ' / ' + ${ch.bindings().totalPages()}">1 / 1</span>
            <a data-link th:unless="${ch.bindings().last()}"
               th:href="@{/channel/{u}(u=${ch.channelUsername()},page=${ch.bindings().number()+1},status=${ch.filterStatus()},source=${ch.filterSource()})}"
               th:text="#{channel.bindings.next}">Suivant</a>
        </div>
    </section>
    <script src="/js/channel-status.js"></script>
    <script src="/js/channel-bindings.js"></script>
</mdui-layout-main>
