<!DOCTYPE html>
<html th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--/* See ModelFiller#seo: a member's page and an error stay out of search engines. */-->
    <title th:text="${seo.title}">Catapult</title>
    <th:block th:if="${seo.indexed}">
        <meta name="description" th:content="${seo.description}">
        <link th:if="${seo.canonicalUrl}" rel="canonical" th:href="${seo.canonicalUrl}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" th:content="#{app.brand}">
        <meta property="og:title" th:content="${seo.title}">
        <meta property="og:description" th:content="${seo.description}">
        <meta th:if="${seo.canonicalUrl}" property="og:url" th:content="${seo.canonicalUrl}">
        <meta name="twitter:card" content="summary">
    </th:block>
    <meta th:unless="${seo.indexed}" name="robots" content="noindex">
    <script th:if="${seo.indexed and page == '' and seo.canonicalUrl != null}" type="application/ld+json" th:inline="javascript">
        {"@context": "https://schema.org", "@type": "WebSite", "name": /*[[#{app.brand}]]*/ "", "url": /*[[${seo.canonicalUrl}]]*/ ""}
    </script>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/_static/mdui/2.1.4/mdui.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/css/catapult.css">

    <script src="/_static/mdui/2.1.4/mdui.global.js"></script>
    <script th:inline="javascript">
        window.Catapult = {
            page: /*[[${page}]]*/,
            spa: /*[[${app.spa}]]*/,
            titles: /*[[${titles}]]*/
        };
    </script>
</head>

<body>
<mdui-layout>
    <!-- Navigation -->
    <mdui-top-app-bar class="app-bar">
        <a data-link href="/" class="brand-link">
            <mdui-top-app-bar-title>
            <span class="brand">
                <span class="brand-icon">🚀</span>
                <span th:text="#{app.brand}">app.brand</span>
            </span>
            </mdui-top-app-bar-title>
        </a>

        <!-- The channels the member can act on: spa.js fills it from /spa/nav-channels once the page is shown. -->
        <nav th:if="${loggedIn}" id="nav-channels" class="nav-channels" th:aria-label="#{nav.channels}"></nav>

        <!--/* mdui-top-app-bar only has a default slot: this is a plain flex item, sized like the brand. */-->
        <div class="app-bar-end">
            <!--/* Admins only (ROLE_ADMIN): opens the admin page, marked active there by spa.js like a channel. */-->
            <a th:if="${admin}" id="nav-admin" data-link class="nav-channel nav-admin" href="/admin" th:title="#{nav.admin}">
                <mdui-icon name="admin_panel_settings"></mdui-icon>
                <span th:text="#{nav.admin}">nav.admin</span>
            </a>
            <!-- Mock profile only: reopens the member's config popout (mock-popout.js). -->
            <mdui-button th:if="${mock}" id="mock-popout-btn" variant="text" icon="tune">Mock</mdui-button>
            <mdui-button th:unless="${loggedIn}" variant="text" href="/oauth2/authorization/twitch"
                         th:text="#{nav.login}">nav.login</mdui-button>
        </div>

    </mdui-top-app-bar>

    <mdui-linear-progress id="nav-progress" hidden></mdui-linear-progress>

    <div id="app">
        <th:block th:if="${error}"><div th:replace="~{pages/error::error}"></div></th:block>
        <th:block th:unless="${error}" th:each="spaPage : ${app.spa}" th:if="${page == spaPage.id}">
            <div th:replace="~{${spaPage.template} :: ${spaPage.fragment}}"></div>
        </th:block>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-brand">
            <span class="brand-icon">🚀</span><span th:text="#{app.brand}">app.brand</span>
        </div>

        <div class="footer-links">
            <a data-link href="/privacy" th:text="#{footer.privacy}">footer.privacy</a>
            <a href="https://github.com/enimaloc/catapult" target="_blank" rel="noopener noreferrer"
               th:text="#{footer.github}">footer.github</a>
            <span class="version" th:text="#{footer.version('TODO: Fetch version')}">footer.version</span>
        </div>
    </footer>
</mdui-layout>

<script src="/js/csrf.js"></script>
<script src="/js/catapult.js"></script>
<script src="/js/spa.js"></script>
<!-- Page-wide, not per-fragment: the OBS connection must survive SPA navigation. -->
<script src="/js/suggest.js"></script>
<script src="/js/obs.js"></script>
<script src="/js/obs-session.js"></script>
<script src="/js/twitchat-protocol.js"></script>
<script src="/js/twitchat.js"></script>
<script src="/js/twitchat-stream.js"></script>

<!--
    These scripts back interactive fragments (currently only the /channel/{username}
    dashboard). They are loaded here, once per full page load, rather than inlined in
    their fragment templates: a script tag inserted via innerHTML (which is exactly what
    spa.js's navigate() does to swap #app's content) never executes per the HTML/DOM spec.
    Each file instead listens for the "catapult:render" event spa.js dispatches on both
    initial load and every SPA swap, and no-ops via a null-guard when its DOM isn't present.
-->
<script src="/js/visibility.js"></script>
<script src="/js/channel-page.js"></script>
<script src="/js/channel-events.js"></script>
<script src="/js/channel-status.js"></script>
<script src="/js/game-search.js"></script>
<script src="/js/channel-bindings.js"></script>
<script src="/js/channel-connections.js"></script>
<script src="/js/twitchat-events.js"></script>
<script src="/js/channel-settings.js"></script>
<script src="/js/channel-dtdd.js"></script>
<script th:if="${mock}" src="/js/mock-popout.js"></script>
</body>
</html>
