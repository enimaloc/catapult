<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{template::layout(~{::title}, 'invite', ~{::section}, null, 'container', null, null)}">
<head>
    <title>Catapult — Invitations</title>
</head>
<body>
<!--/*@thymesvar id="canInvite" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="code" type="java.lang.String"*/-->
<!--/*@thymesvar id="inviteUrl" type="java.lang.String"*/-->
<!--/*@thymesvar id="redemptions" type="java.util.List"*/-->
<section>
    <h2 th:text="#{invite.title}" style="margin-bottom:1.5rem;">Invitations</h2>

    <div th:unless="${canInvite}" class="card" style="padding:1.5rem;">
        <p style="margin:0; font-weight:600;" th:text="#{invite.no_permission}">Vous ne pouvez pas inviter d'autres utilisateurs.</p>
        <p class="text-muted" style="margin-top:0.5rem;" th:text="#{invite.no_permission.desc}"></p>
    </div>

    <div th:if="${canInvite}">
        <div class="card" style="padding:1.5rem; margin-bottom:1.5rem;">
            <div style="margin-bottom:1rem;">
                <label class="label" th:text="#{invite.code.label}">Votre code d'invitation</label>
                <div style="display:flex; gap:0.5rem; align-items:center; margin-top:0.4rem;">
                    <span class="badge" style="font-size:1.2rem; letter-spacing:0.15em; padding:0.4rem 0.8rem;"
                          th:text="${code}"></span>
                </div>
            </div>
            <div style="margin-bottom:1.5rem;">
                <label class="label" th:text="#{invite.link.label}">Lien d'invitation</label>
                <div style="display:flex; gap:0.5rem; align-items:center; margin-top:0.4rem; flex-wrap:wrap;">
                    <input type="text" readonly th:value="${inviteUrl}" id="invite-url-input"
                           style="flex:1; min-width:200px; max-width:480px; font-family:monospace; font-size:0.85rem;"/>
                    <button type="button" class="btn btn-sm"
                            onclick="copyInviteLink()"
                            th:text="#{invite.link.copy}">Copier</button>
                </div>
            </div>
            <form th:action="@{/invite/regenerate}" method="post" th:onsubmit="|return confirm('#{invite.regenerate.confirm}')|"> <!-- nosemgrep -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline"
                        th:text="#{invite.regenerate}">Regénérer le code</button>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 th:text="#{invite.redemptions.title}" style="margin:0;">Personnes invitées</h3>
            </div>
            <div th:if="${#lists.isEmpty(redemptions)}" style="padding:1rem; color:var(--muted);"
                 th:text="#{invite.redemptions.empty}">Personne n'a encore utilisé votre invitation.</div>
            <div th:unless="${#lists.isEmpty(redemptions)}" class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th th:text="#{invite.redemptions.column.twitchId}">Twitch ID</th>
                            <th th:text="#{invite.redemptions.column.date}">Rejoint le</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${redemptions}">
                            <td><span class="badge" th:text="${r.inviteeTwitchId}"></span></td>
                            <td th:text="${#temporals.format(r.redeemedAt, 'dd/MM/yyyy HH:mm', 'UTC')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
<script th:inline="javascript">
function copyInviteLink() {
    var input = document.getElementById('invite-url-input');
    navigator.clipboard.writeText(input.value).catch(function() {
        input.select();
        document.execCommand('copy');
    });
}
</script>
</body>
</html>
