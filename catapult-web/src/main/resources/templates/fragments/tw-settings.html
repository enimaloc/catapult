<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:ws="https://catapult.enimaloc.fr/ws">
<body>
<!--/*@thymesvar id="twSettings" type="fr.enimaloc.catapult.domain.UserSettings"*/-->
<!--/*@thymesvar id="availableTws" type="java.util.List"*/-->
<section th:fragment="tw-settings" class="card">
    <div class="card-header">
        <h3 th:text="#{tw_settings.title}">Trigger Warnings</h3>
        <button class="btn-help"
                hx-get="/help/tw-settings"
                hx-target="#help-panel-body"
                hx-swap="innerHTML"
                hx-on::after-request="openHelpPanel()"
                th:title="#{help.panel.title}">?</button>
    </div>
    <p class="text-muted mb-16" th:text="#{tw_settings.subtitle}">Catégories affichées par ta commande !triggers et tes placeholders {tw.*}.</p>

    <form th:action="@{/channels/{u}/settings/tws(u=${channelUsername})}" method="post" ws:post="@{/channels/{u}/settings/tws(u=${channelUsername})}" ws:swap="none"> <!-- nosemgrep -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="inline-edit-fields">
            <div class="inline-edit-field">
                <label th:text="#{tw_settings.enabled}">Activer la fonctionnalité TW</label>
                <input type="checkbox" name="twEnabled"
                       th:checked="${twSettings.twFeatureEnabled}">
            </div>
            <div class="inline-edit-field">
                <label th:text="#{tw_settings.blocked}">TW à toujours masquer</label>
                <div class="ccl-checkboxes">
                    <div th:each="tw : ${availableTws}">
                        <label>
                            <input type="checkbox" name="blockedTws"
                                   th:value="${tw.id}"
                                   th:checked="${twSettings.blockedTws.contains(tw.id)}">
                            <span th:text="${tw.label}"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <div class="inline-edit-actions" style="margin-top:12px">
            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Enregistrer</button>
        </div>
    </form>

</section>
</body>
</html>
