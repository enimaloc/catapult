<!--/*@thymesVar id="snapshot" type="fr.enimaloc.catapult.common.dto.notification.NotificationSnapshotDto"*/-->
<!--/* The bell's dropdown content (NotificationsController#menu): the newest notifications, at most 10. data-unread is -1 when catapult-api was unreachable. notifications.js fills the relative dates and builds live items from the template below. */-->
<div id="notifications-menu" th:fragment="menu"
     th:attr="data-unread=${snapshot == null ? -1 : snapshot.unreadCount()},data-new=#{notifications.new('{0}')}">
    <div class="notification-list">
        <th:block th:each="n, stat : ${snapshot?.items()}">
            <th:block th:if="${stat.index < 10}"><th:block th:replace="~{this :: item(${n})}"></th:block></th:block>
        </th:block>
        <p class="notification-empty" th:hidden="${snapshot != null and !#lists.isEmpty(snapshot.items())}"
           th:text="#{notifications.empty}">notifications.empty</p>
    </div>
    <div class="notification-actions">
        <mdui-button variant="text" data-notifications-read-all
                     th:text="#{notifications.mark_all_read}">notifications.mark_all_read</mdui-button>
        <mdui-button variant="text" data-link href="/notifications"
                     th:text="#{notifications.see_all}">notifications.see_all</mdui-button>
    </div>
    <th:block th:replace="~{this :: itemTemplate('notification-item-template')}"></th:block>
</div>

<!--/* One notification; the markup notifications.js's item builder mirrors for live events. bodyHtml is sanitized by catapult-api. */-->
<div th:fragment="item(n)" class="notification-item" tabindex="0" th:attr="data-id=${n.id()},data-read=${n.read()},data-severity=${n.severity()}">
    <mdui-icon class="notification-icon"
               th:attr="name=${n.severity().name() == 'ERROR' ? 'error' : (n.severity().name() == 'WARNING' ? 'warning' : 'info')},title=#{${'notifications.severity.' + #strings.toLowerCase(n.severity().name())}}"></mdui-icon>
    <div class="notification-content">
        <div class="notification-title" th:text="${n.title()}">title</div>
        <div class="notification-body" th:utext="${n.bodyHtml()}">body</div>
        <time class="notification-date" data-live-time="relative" th:datetime="${n.createdAt()}"></time>
        <mdui-button th:if="${n.ctaUrl() != null}" class="notification-cta" variant="text" target="_blank" rel="noopener"
                     th:href="${n.ctaUrl()}" th:text="${n.ctaLabel() != null ? n.ctaLabel() : n.ctaUrl()}">cta</mdui-button>
    </div>
</div>

<!--/* What notifications.js builds live items from: in the menu, and on the /notifications page under another id, which it falls back to while the menu has not loaded. */-->
<template th:fragment="itemTemplate(templateId)" th:id="${templateId}">
    <div class="notification-item" tabindex="0" data-id="" data-read="false" data-severity="INFO">
        <mdui-icon class="notification-icon" name="info"
                   th:attr="data-label-info=#{notifications.severity.info},data-label-warning=#{notifications.severity.warning},data-label-error=#{notifications.severity.error}"></mdui-icon>
        <div class="notification-content">
            <div class="notification-title"></div>
            <div class="notification-body"></div>
            <time class="notification-date" data-live-time="relative" datetime=""></time>
            <mdui-button class="notification-cta" variant="text" target="_blank" rel="noopener" hidden></mdui-button>
        </div>
    </div>
</template>
