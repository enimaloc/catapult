<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="twitchat-settings" th:if="${isOwner and twitchatSettings != null}" class="card">
    <div class="card-header">
        <h3 th:text="#{twitchat_settings.title}">Notifications Twitchat</h3>
    </div>
    <p class="text-muted mb-16" th:text="#{twitchat_settings.subtitle}">
        Reçois une notification Twitchat (visible de toi seul) quand Catapult change ta catégorie,
        quand tu la changes toi-même, ou quand le bot s'active/désactive.
    </p>

    <form th:action="@{/channels/{u}/settings/twitchat(u=${channelUsername})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="inline-edit-fields">
            <div class="inline-edit-field">
                <label th:text="#{twitchat_settings.enabled}">Activer</label>
                <input type="checkbox" name="enabled" th:checked="${twitchatSettings.enabled}">
            </div>
            <div class="inline-edit-field">
                <label th:text="#{twitchat_settings.obs_host}">Adresse OBS-websocket</label>
                <input type="text" name="obsHost" th:value="${twitchatSettings.obsHost}" placeholder="127.0.0.1">
            </div>
            <div class="inline-edit-field">
                <label th:text="#{twitchat_settings.obs_port}">Port OBS-websocket</label>
                <input type="number" name="obsPort" th:value="${twitchatSettings.obsPort}" placeholder="4455">
            </div>
            <div class="inline-edit-field">
                <label th:text="#{twitchat_settings.obs_password}">Mot de passe OBS-websocket</label>
                <input type="password" name="obsPassword"
                       th:placeholder="${twitchatSettings.hasPassword} ? #{twitchat_settings.password_unchanged} : ''">
            </div>
        </div>
        <div class="inline-edit-actions" style="margin-top:12px">
            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Enregistrer</button>
        </div>
    </form>

    <div style="margin-top:16px">
        <label th:text="#{twitchat_settings.widget_url}">Lien à mettre dans une source web OBS (ou à ouvrir en onglet) :</label>
        <code th:text="${twitchatWidgetUrl}">https://.../widget/twitchat/...</code>
        <form th:action="@{/channels/{u}/settings/twitchat/regenerate(u=${channelUsername})}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-secondary" th:text="#{twitchat_settings.regenerate}">Régénérer le lien</button>
        </form>
    </div>
</section>
</body>
</html>
