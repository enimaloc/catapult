<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*@thymesvar id="bindings" type="org.springframework.data.domain.Page"*/-->
<!--/*@thymesvar id="filterStatus" type="java.lang.String"*/-->
<!--/*@thymesvar id="filterSource" type="java.lang.String"*/-->
<!--/*@thymesvar id="availableCcls" type="java.util.List"*/-->
<!--/*@thymesvar id="blockedCcls" type="java.util.Set"*/-->
<!--/*@thymesvar id="availableTws" type="java.util.List"*/-->
<!--/*@thymesvar id="blockedTws" type="java.util.Set"*/-->
<div th:fragment="bindings" class="card"
     th:attr="hx-get=@{/channels/{u}/fragments/bindings(u=${channelUsername},page=${bindings.number},status=${filterStatus},source=${filterSource})}"
     hx-trigger="every 10s [!isEditing()]"
     hx-swap="outerHTML">

    <div class="card-header">
        <h3 th:text="#{bindings.title}">Bindings</h3>
        <button class="btn-help"
                hx-get="/help/bindings"
                hx-target="#help-panel-body"
                hx-swap="innerHTML"
                hx-on::after-request="openHelpPanel()"
                th:title="#{help.panel.title}">?</button>
    </div>

    <div class="filters mb-16">
        <a th:href="@{/channels/{u}(u=${channelUsername})}" class="btn btn-sm btn-outline" th:text="#{bindings.filter.all}">Tous</a>
        <a th:href="@{/channels/{u}(u=${channelUsername},status='AUTO')}" class="btn btn-sm btn-outline">AUTO</a>
        <a th:href="@{/channels/{u}(u=${channelUsername},status='MANUAL')}" class="btn btn-sm btn-outline">MANUAL</a>
        <a th:href="@{/channels/{u}(u=${channelUsername},status='INCOMPLETE')}" class="btn btn-sm btn-outline">INCOMPLETE</a>
        <a th:href="@{/channels/{u}(u=${channelUsername},source='STEAM')}" class="btn btn-sm btn-outline">Steam</a>
    </div>

    <div class="table-container">
        <table class="table">
            <thead>
                <tr>
                    <th th:text="#{bindings.column.game}">Jeu (source)</th>
                    <th th:text="#{bindings.column.twitch_category}">Catégorie Twitch</th>
                    <th th:text="#{bindings.column.ccls}">CCLs</th>
                    <th th:text="#{bindings.column.status}">Statut</th>
                    <th th:text="#{bindings.column.ccl}">CCL</th>
                    <th th:text="#{bindings.column.ignored}">Ignoré</th>
                    <th th:text="#{bindings.column.actions}">Actions</th>
                </tr>
            </thead>
            <!--/*@thymesvar id="binding" type="fr.enimaloc.catapult.domain.GameBinding"*/-->
            <tbody th:each="binding : ${bindings.content}">
                <tr>
                    <td>
                        <span class="badge" th:text="${binding.sourceType}"></span>
                        <span th:text="${binding.sourceName}"></span>
                    </td>
                    <td>
                        <span th:if="${binding.twitchGameName}" th:text="${binding.twitchGameName}"></span>
                        <span th:unless="${binding.twitchGameName}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span th:each="ccl : ${binding.ccls}"
                              class="badge"
                              th:classappend="${blockedCcls != null and blockedCcls.contains(ccl)} ? 'badge-warning' : 'badge-ccl'"
                              th:title="${blockedCcls != null and blockedCcls.contains(ccl)} ? #{ccl_settings.blocked_tooltip} : ''"
                              th:text="${ccl}"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${binding.status.name() == 'INCOMPLETE'} ? 'badge-warning' : 'badge-default'"
                              th:text="${binding.status}"></span>
                    </td>
                    <td>
                        <form th:action="@{/channels/{u}/bindings/{id}/ccl-toggle(u=${channelUsername},id=${binding.id})}" method="post"> <!-- nosemgrep -->
                            <label class="toggle-label">
                                <input type="checkbox" name="enabled"
                                       th:checked="${binding.cclEnabled}"
                                       onchange="this.form.submit()">
                                <span class="toggle-slider"></span>
                            </label>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/channels/{u}/bindings/{id}/ignored-toggle(u=${channelUsername},id=${binding.id})}" method="post"> <!-- nosemgrep -->
                            <label class="toggle-label">
                                <input type="checkbox" name="ignored"
                                       th:checked="${binding.ignored}"
                                       onchange="this.form.submit()">
                                <span class="toggle-slider"></span>
                            </label>
                        </form>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline"
                                th:data-id="${binding.id}"
                                onclick="toggleEdit(this.dataset.id)"
                                th:text="#{common.edit}">
                            Modifier
                        </button>
                        <button th:if="${availableTws != null}"
                                class="btn btn-sm btn-outline"
                                th:data-id="${binding.id}"
                                onclick="toggleTwEdit(this.dataset.id)"
                                th:text="#{bindings.tw.edit}">
                            TW
                        </button>
                        <form th:action="@{/channels/{u}/bindings/{id}/delete(u=${channelUsername},id=${binding.id})}" method="post" style="display:inline"> <!-- nosemgrep -->
                            <button type="submit" class="btn btn-sm btn-danger" th:text="#{common.delete}">Supprimer</button>
                        </form>
                    </td>
                </tr>
                <tr th:id="'edit-row-' + ${binding.id}" class="edit-row" style="display:none">
                    <td colspan="7">
                        <form th:action="@{/channels/{u}/bindings/{id}(u=${channelUsername},id=${binding.id})}" method="post"> <!-- nosemgrep -->
                            <div class="inline-edit-fields">
                                <div class="inline-edit-field">
                                    <label th:for="'gameSearch-' + ${binding.id}" th:text="#{bindings.edit.twitch_category}">Catégorie Twitch</label>
                                    <div class="search-wrapper">
                                        <input type="text"
                                               th:id="'gameSearch-' + ${binding.id}"
                                               th:attr="data-search-url=@{/channels/{u}/api/games/search(u=${channelUsername})},data-results-id=|gameResults-${binding.id}|,data-gameid-field=|twitchGameId-${binding.id}|,data-gamename-field=|twitchGameName-${binding.id}|"
                                               th:value="${binding.twitchGameName}"
                                               th:placeholder="#{common.search_placeholder}"
                                               autocomplete="off"
                                               oninput="gameSearch(event)">
                                        <ul th:id="'gameResults-' + ${binding.id}" class="game-results"></ul>
                                    </div>
                                    <input type="hidden" th:id="'twitchGameId-' + ${binding.id}"
                                           name="twitchGameId" th:value="${binding.twitchGameId}">
                                    <input type="hidden" th:id="'twitchGameName-' + ${binding.id}"
                                           name="twitchGameName" th:value="${binding.twitchGameName}">
                                </div>
                                <div class="inline-edit-field">
                                    <label th:text="#{bindings.edit.ccls}">CCLs</label>
                                    <div class="ccl-checkboxes">
                                        <div th:each="ccl : ${availableCcls}">
                                            <label th:title="${blockedCcls != null and blockedCcls.contains(ccl.id)} ? #{ccl_settings.blocked_tooltip} : ''">
                                                <!-- hidden input preserves blocked CCL value so it survives the form submit -->
                                                <input th:if="${blockedCcls != null and blockedCcls.contains(ccl.id) and binding.ccls.contains(ccl.id)}"
                                                       type="hidden" name="ccls" th:value="${ccl.id}">
                                                <input type="checkbox" name="ccls"
                                                       th:value="${ccl.id}"
                                                       th:checked="${binding.ccls.contains(ccl.id)}"
                                                       th:disabled="${blockedCcls != null and blockedCcls.contains(ccl.id)}">
                                                <span th:text="${ccl.name}"
                                                      th:classappend="${blockedCcls != null and blockedCcls.contains(ccl.id)} ? 'text-muted' : ''"></span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="inline-edit-actions">
                                <button type="button"
                                        th:data-id="${binding.id}"
                                        onclick="toggleEdit(this.dataset.id)"
                                        class="btn btn-sm btn-outline"
                                        th:text="#{common.cancel}">Annuler</button>
                                <button type="submit" class="btn btn-sm btn-primary" th:text="#{common.save}">Enregistrer</button>
                            </div>
                        </form>
                    </td>
                </tr>
                <tr th:if="${availableTws != null}" th:id="'tw-row-' + ${binding.id}" class="edit-row" style="display:none">
                    <td colspan="7">
                        <form th:action="@{/channels/{u}/bindings/{id}/tws(u=${channelUsername},id=${binding.id})}" method="post"> <!-- nosemgrep -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="inline-edit-fields">
                                <div class="inline-edit-field">
                                    <label>
                                        <input type="checkbox" name="twEnabled" th:checked="${binding.twEnabled}">
                                        <span th:text="#{bindings.tw.enable}">Enable TW for this game</span>
                                    </label>
                                </div>
                                <div class="inline-edit-field">
                                    <label th:text="#{bindings.tw.title}">Trigger Warnings</label>
                                    <div class="ccl-checkboxes">
                                        <div th:each="tw : ${availableTws}">
                                            <label th:title="${blockedTws != null and blockedTws.contains(tw.id)} ? #{tw_settings.blocked_tooltip} : ''">
                                                <input th:if="${blockedTws != null and blockedTws.contains(tw.id) and binding.tws.contains(tw.id)}"
                                                       type="hidden" name="tws" th:value="${tw.id}">
                                                <input type="checkbox" name="tws"
                                                       th:value="${tw.id}"
                                                       th:checked="${binding.tws.contains(tw.id)}"
                                                       th:disabled="${blockedTws != null and blockedTws.contains(tw.id)}">
                                                <span th:text="${tw.label}"
                                                      th:classappend="${blockedTws != null and blockedTws.contains(tw.id)} ? 'text-muted' : ''"></span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div th:if="${binding.twOverride}" class="text-muted mb-16" style="margin-top:8px">
                                <span th:text="#{bindings.tw.override.notice}">You overrode this binding's TWs.</span>
                                <button th:formaction="@{/channels/{u}/bindings/{id}/tws/reset(u=${channelUsername},id=${binding.id})}"
                                        formmethod="post" type="submit" class="btn btn-sm btn-outline"
                                        th:text="#{bindings.tw.reset}">Reset to auto</button>
                            </div>
                            <div class="inline-edit-actions">
                                <button type="button"
                                        th:data-id="${binding.id}"
                                        onclick="toggleTwEdit(this.dataset.id)"
                                        class="btn btn-sm btn-outline"
                                        th:text="#{common.cancel}">Annuler</button>
                                <button type="submit" class="btn btn-sm btn-primary" th:text="#{common.save}">Enregistrer</button>
                            </div>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${bindings.totalPages > 1}" class="pagination">
        <a th:if="${!bindings.first}"
           th:href="@{/channels/{u}(u=${channelUsername},page=${bindings.number - 1},status=${filterStatus},source=${filterSource})}"
           class="btn btn-sm"
           th:text="#{bindings.pagination.previous}">Précédent</a>
        <span th:text="${bindings.number + 1} + ' / ' + ${bindings.totalPages}"></span>
        <a th:if="${!bindings.last}"
           th:href="@{/channels/{u}(u=${channelUsername},page=${bindings.number + 1},status=${filterStatus},source=${filterSource})}"
           class="btn btn-sm"
           th:text="#{bindings.pagination.next}">Suivant</a>
    </div>
</div>
</body>
</html>
