<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:ws="https://catapult.enimaloc.fr/ws">
<body>
<div id="twitchat-presets-body" th:fragment="twitchat-presets-body">
    <div th:each="eventType : ${twitchatEventTypes}" class="twitchat-preset-event-group" style="margin-top:16px">
        <h4 th:text="#{'twitchat_presets.event.' + ${eventType}}">Event</h4>

        <form th:action="@{/channels/{u}/settings/twitchat/active-presets/{t}(u=${channelUsername},t=${eventType})}"
              method="post"
              ws:post="@{/channels/{u}/settings/twitchat/active-presets/{t}(u=${channelUsername},t=${eventType})}"
              ws:target="#twitchat-presets-body" ws:swap="outerHTML"> <!-- nosemgrep -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label th:text="#{twitchat_presets.active_label}">Preset actif</label>
            <select name="presetId" onchange="this.form.requestSubmit()">
                <option value="" th:selected="${twitchatActivePresets.get(eventType) == null}"
                        th:text="#{twitchat_presets.default_option}">Défaut</option>
                <option th:each="preset : ${twitchatPresetsByEvent.get(eventType)}"
                        th:value="${preset.id}"
                        th:selected="${preset.id == twitchatActivePresets.get(eventType)}"
                        th:text="${preset.name}">Preset name</option>
            </select>
        </form>

        <ul>
            <li th:each="preset : ${twitchatPresetsByEvent.get(eventType)}">
                <details>
                    <summary th:text="${preset.name}">Preset name</summary>
                    <form th:action="@{/channels/{u}/settings/twitchat/presets/{id}/update(u=${channelUsername},id=${preset.id})}"
                          method="post"
                          ws:post="@{/channels/{u}/settings/twitchat/presets/{id}/update(u=${channelUsername},id=${preset.id})}"
                          ws:target="#twitchat-presets-body" ws:swap="outerHTML"
                          onsubmit="return window.validateTwitchatPresetJson(this)"> <!-- nosemgrep -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="text" name="name" th:value="${preset.name}" required>
                        <textarea name="payloadJson" rows="8" required th:text="${preset.payloadJson}"></textarea>
                        <button type="submit" th:text="#{common.save}">Enregistrer</button>
                    </form>
                    <form th:action="@{/channels/{u}/settings/twitchat/presets/{id}/delete(u=${channelUsername},id=${preset.id})}"
                          method="post"
                          ws:post="@{/channels/{u}/settings/twitchat/presets/{id}/delete(u=${channelUsername},id=${preset.id})}"
                          ws:target="#twitchat-presets-body" ws:swap="outerHTML"> <!-- nosemgrep -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" th:text="#{twitchat_presets.delete}">Supprimer</button>
                    </form>
                </details>
            </li>
        </ul>

        <details>
            <summary th:text="#{twitchat_presets.new}">+ Nouveau preset</summary>
            <form th:action="@{/channels/{u}/settings/twitchat/presets(u=${channelUsername})}"
                  method="post"
                  ws:post="@{/channels/{u}/settings/twitchat/presets(u=${channelUsername})}"
                  ws:target="#twitchat-presets-body" ws:swap="outerHTML"
                  onsubmit="return window.validateTwitchatPresetJson(this)"> <!-- nosemgrep -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="eventType" th:value="${eventType}"/>
                <input type="text" name="name" required th:placeholder="#{twitchat_presets.name_placeholder}">
                <textarea name="payloadJson" rows="8" required
                          th:text="${twitchatDefaultsJson != null ? twitchatDefaultsJson.get(eventType) : ''}"></textarea>
                <button type="submit" th:text="#{twitchat_presets.create}">Créer</button>
            </form>
        </details>
    </div>

    <script th:inline="none">
        // Client-side feedback only — the server is the source of truth for validation
        // (TwitchatPayloadPresetService rejects invalid JSON / blank message with a 400).
        window.validateTwitchatPresetJson = function (form) {
            var textarea = form.querySelector("textarea[name=payloadJson]");
            if (!textarea) return true;
            try {
                var parsed = JSON.parse(textarea.value);
                if (!parsed.message || !String(parsed.message).trim()) {
                    alert("Le champ \"message\" est obligatoire dans le JSON du preset.");
                    return false;
                }
            } catch (e) {
                alert("JSON invalide : " + e.message);
                return false;
            }
            return true;
        };
    </script>
</div>
</body>
</html>
