<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:ws="https://catapult.enimaloc.fr/ws">
<body>
<div id="twitchat-presets-body" th:fragment="twitchat-presets-body"
     th:attr="data-channel-username=${channelUsername},
              data-i18n-message-required=#{twitchat_presets.error.message_required},
              data-i18n-invalid-json=#{twitchat_presets.error.invalid_json('')},
              data-i18n-test-error=#{twitchat_presets.test.error},
              data-i18n-test-success=#{twitchat_presets.test.success},
              data-i18n-test-connection-lost=#{twitchat_presets.test.connection_lost},
              data-i18n-quick-config-link-help=#{twitchat_presets.quick_config_link_help},
              data-i18n-quick-config-chat-help=#{twitchat_presets.quick_config_chat_help},
              data-i18n-quick-config-command-label=#{twitchat_presets.quick_config_command_label}">
    <p class="text-muted" th:text="#{twitchat_presets.help_placeholders}">Variables disponibles...</p>
    <p th:if="${twitchatPresetError != null}" class="text-danger" th:text="${twitchatPresetError}">Erreur</p>
    <script type="application/json" id="twitchat-quick-configs-data" th:utext="${twitchatQuickConfigsJson}">[]</script>

    <div class="inline-edit-actions" style="margin-bottom:16px">
        <button type="button" class="btn btn-outline"
                onclick="document.getElementById('quickConfigModal').style.display='flex'; populateQuickConfigModal();"
                th:text="#{twitchat_presets.quick_config_label}">Configuration rapide</button>
    </div>

    <div id="quickConfigModal" class="modal" style="display:none">
        <div class="modal-content" style="max-width:520px">
            <h3 th:text="#{twitchat_presets.quick_config_modal_title}">Configuration rapide</h3>

            <div class="inline-edit-field">
                <label th:text="#{twitchat_presets.quick_config_label}">Configuration rapide</label>
                <select id="quickConfigModalSelect" onchange="onQuickConfigModalVariantChange()">
                    <option value="" th:text="#{twitchat_presets.quick_config_none}">-- Choisir --</option>
                    <option value="link" th:text="#{twitchat_presets.quick_config_variant_link}">Lien</option>
                    <option value="chat" th:text="#{twitchat_presets.quick_config_variant_chat}">Trigger</option>
                </select>
            </div>

            <p id="quickConfigModalDescription" class="text-muted" style="margin-top:8px"></p>

            <div id="quickConfigModalParams" class="quick-config-params" style="margin-top:8px"></div>

            <div id="quickConfigModalTargets" style="margin-top:12px">
                <label style="display:flex; align-items:center; gap:6px; font-weight:600; cursor:pointer">
                    <input type="checkbox" id="quickConfigModalTargetAll" onchange="onQuickConfigModalTargetAllChange()">
                    <span th:text="#{twitchat_presets.quick_config_target_all}">Toutes les actions</span>
                </label>
                <!-- One checkbox per action (groupKey), populated client-side from the
                     quick-configs JSON — see populateQuickConfigModal() below. -->
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline"
                        onclick="document.getElementById('quickConfigModal').style.display='none'"
                        th:text="#{common.cancel}">Annuler</button>
                <button type="button" class="btn btn-primary" onclick="applyQuickConfigFromModal()"
                        th:text="#{twitchat_presets.quick_config_apply}">Appliquer</button>
            </div>
        </div>
    </div>

    <div th:each="eventType : ${twitchatEventTypes}" class="card twitchat-preset-event-group">
        <div class="card-header twitchat-preset-header">
            <h4 th:text="#{'twitchat_presets.event.' + ${eventType}}">Event</h4>

            <form class="twitchat-preset-active-form"
                  th:action="@{/channels/{u}/settings/twitchat/active-presets/{t}(u=${channelUsername},t=${eventType})}"
                  method="post"
                  ws:post="@{/channels/{u}/settings/twitchat/active-presets/{t}(u=${channelUsername},t=${eventType})}"
                  ws:target="#twitchat-presets-body" ws:swap="outerHTML"> <!-- nosemgrep -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label th:text="#{twitchat_presets.active_label}">Preset actif</label>
                <select name="presetId" onchange="this.form.requestSubmit()">
                    <option value="" th:selected="${twitchatActivePresets.get(eventType) == null}"
                            th:text="#{twitchat_presets.default_option}">Défaut</option>
                    <option th:each="preset : ${twitchatPresetsByEvent.get(eventType)}"
                            th:value="${preset.id}"
                            th:selected="${preset.id == twitchatActivePresets.get(eventType)}"
                            th:text="${preset.name}">Preset name</option>
                </select>
            </form>

            <details class="twitchat-new-preset twitchat-new-preset-header" th:attr="data-event-type=${eventType}">
                <summary th:text="#{twitchat_presets.new}">+ Nouveau preset</summary>
                <form class="twitchat-preset-form"
                      th:action="@{/channels/{u}/settings/twitchat/presets(u=${channelUsername})}"
                      method="post"
                      ws:post="@{/channels/{u}/settings/twitchat/presets(u=${channelUsername})}"
                      ws:target="#twitchat-presets-body" ws:swap="outerHTML"
                      onsubmit="return window.validateTwitchatPresetJson(this)"> <!-- nosemgrep -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="eventType" th:value="${eventType}"/>
                    <input type="text" name="name" required th:placeholder="#{twitchat_presets.name_placeholder}">
                    <textarea class="query-textarea" name="payloadJson" rows="8" cols="80" required
                              th:text="${twitchatDefaultsJson != null ? twitchatDefaultsJson.get(eventType) : ''}"></textarea>
                    <div class="inline-edit-actions">
                        <button type="submit" class="btn btn-primary" th:text="#{twitchat_presets.create}">Créer</button>
                        <button type="button" class="btn btn-outline" onclick="testTwitchatPreset(this)"
                                th:attr="data-event-type=${eventType}"
                                th:text="#{twitchat_presets.test}">Tester</button>
                    </div>
                </form>
            </details>
        </div>

        <ul class="twitchat-preset-list">
            <li th:each="preset : ${twitchatPresetsByEvent.get(eventType)}">
                <details>
                    <summary th:text="${preset.name}">Preset name</summary>
                    <form class="twitchat-preset-form"
                          th:action="@{/channels/{u}/settings/twitchat/presets/{id}/update(u=${channelUsername},id=${preset.id})}"
                          method="post"
                          ws:post="@{/channels/{u}/settings/twitchat/presets/{id}/update(u=${channelUsername},id=${preset.id})}"
                          ws:target="#twitchat-presets-body" ws:swap="outerHTML"
                          onsubmit="return window.validateTwitchatPresetJson(this)"> <!-- nosemgrep -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="text" name="name" th:value="${preset.name}" required>
                        <textarea class="query-textarea" name="payloadJson" rows="8" cols="80" required
                                  th:text="${preset.payloadJson}"></textarea>
                        <div class="inline-edit-actions">
                            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Enregistrer</button>
                            <button type="button" class="btn btn-outline" onclick="testTwitchatPreset(this)"
                                    th:attr="data-event-type=${eventType}"
                                    th:text="#{twitchat_presets.test}">Tester</button>
                        </div>
                    </form>
                    <form th:action="@{/channels/{u}/settings/twitchat/presets/{id}/delete(u=${channelUsername},id=${preset.id})}"
                          method="post"
                          ws:post="@{/channels/{u}/settings/twitchat/presets/{id}/delete(u=${channelUsername},id=${preset.id})}"
                          ws:target="#twitchat-presets-body" ws:swap="outerHTML"> <!-- nosemgrep -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger btn-sm" th:text="#{twitchat_presets.delete}">Supprimer</button>
                    </form>
                </details>
            </li>
        </ul>
    </div>

    <script th:inline="none">
        // Uses the app's toast overlay when available (see maintenance-overlay.js), falling
        // back to alert() only if that module hasn't loaded for some reason.
        function notifyTwitchat(msg, kind) {
            if (window.catapultOverlay && window.catapultOverlay.showToast) {
                window.catapultOverlay.showToast(msg, { kind: kind, duration: kind === "error" ? 6000 : 3000 });
            } else {
                alert(msg);
            }
        }

        // Client-side feedback only — the server is the source of truth for validation
        // (TwitchatPayloadPresetService rejects invalid JSON / blank message with a 400).
        window.validateTwitchatPresetJson = function (form) {
            var textarea = form.querySelector("textarea[name=payloadJson]");
            if (!textarea) return true;
            var container = document.getElementById("twitchat-presets-body");
            try {
                var parsed = JSON.parse(textarea.value);
                if (!parsed.message || !String(parsed.message).trim()) {
                    notifyTwitchat(container.dataset.i18nMessageRequired, "error");
                    return false;
                }
            } catch (e) {
                notifyTwitchat(container.dataset.i18nInvalidJson + e.message, "error");
                return false;
            }
            return true;
        };

        // Sends whatever is currently in the sibling payloadJson textarea as a one-off test
        // notification — never saved, and the server mints ephemeral tokens for it (never
        // persisted), so any button in the test notification is inert if clicked for real.
        window.testTwitchatPreset = function (button) {
            var eventType = button.dataset.eventType;
            var form = button.closest("form");
            var textarea = form ? form.querySelector("textarea[name=payloadJson]") : null;
            if (!textarea || !eventType) return;
            var container = document.getElementById("twitchat-presets-body");
            var username = container ? container.dataset.channelUsername : null;
            if (!username) return;
            var id = "twitchat-test-" + Math.random().toString(36).slice(2, 8);
            var frame = {
                type: "request",
                id: id,
                action: "mvc",
                method: "POST",
                path: "/channels/" + username + "/settings/twitchat/presets/test",
                headers: { "HX-Request": "true" },
                params: { eventType: eventType, payloadJson: textarea.value },
                csrfToken: window.__wsCsrfToken || null
            };
            var onResponse = function (e) {
                if (!e.detail || e.detail.id !== id) return;
                document.removeEventListener("ws:response", onResponse);
                if (e.detail.status && e.detail.status >= 400) {
                    notifyTwitchat(container.dataset.i18nTestError, "error");
                } else {
                    notifyTwitchat(container.dataset.i18nTestSuccess, "success");
                }
            };
            document.addEventListener("ws:response", onResponse);
            var sent = window.catapultWs && window.catapultWs.send(frame);
            if (!sent) {
                document.removeEventListener("ws:response", onResponse);
                notifyTwitchat(container.dataset.i18nTestConnectionLost, "error");
            }
        };

        // #twitchat-presets-body is fully replaced (outerHTML swap) on every preset
        // create/update/delete/activate — via ws-actions.js's applyResponse(), which uses
        // DOMParser + replaceWith(), so this whole <script> block never re-executes after the
        // very first render (see channel-tabs.js's executeScripts() comment for the same
        // underlying DOM-spec behaviour). Every function below is therefore written to be
        // safely callable from freshly-swapped-in markup via plain (non-th:) onclick/onchange
        // attributes, which the browser always re-wires on parse regardless of how the DOM was
        // inserted — unlike addEventListener calls made from inside this script tag, which only
        // ever run once. The quick-configs JSON itself is likewise re-read from the DOM on every
        // call rather than cached in this closure, since its <script> data tag gets swapped out
        // along with everything else in the fragment.
        function getTwitchatQuickConfigs() {
            var dataEl = document.getElementById("twitchat-quick-configs-data");
            try { return JSON.parse((dataEl && dataEl.textContent) || "[]"); } catch (e) { return []; }
        }

        // Builds the "action" checkboxes below the Lien/Trigger select — one per groupKey
        // (a "-link"/"-chat" pair sharing the same action, e.g. "disable the bot on stream
        // start"), deduped from the quick-configs JSON. Static list, built once per modal
        // lifetime (the container is never swapped afterwards, unlike the select).
        window.populateQuickConfigModal = function () {
            var container = document.getElementById("quickConfigModalTargets");
            if (!container || container.dataset.populated) return; // already populated
            container.dataset.populated = "true";
            var seenGroups = {};
            getTwitchatQuickConfigs().forEach(function (qc) {
                if (seenGroups[qc.groupKey]) return;
                seenGroups[qc.groupKey] = true;
                var label = document.createElement("label");
                label.style.cssText = "display:flex; align-items:center; gap:6px; margin-top:4px; cursor:pointer";
                var input = document.createElement("input");
                input.type = "checkbox";
                input.className = "quick-config-target-action";
                input.value = qc.groupKey;
                var span = document.createElement("span");
                span.textContent = qc.groupLabel;
                label.appendChild(input);
                label.appendChild(span);
                container.appendChild(label);
            });
        };

        // Refreshes the description ("tutoriel") text and, for the "chat" (trigger) variant,
        // the single shared "command name" input — every chat quick config uses the same
        // {{param:command}} placeholder, so one input covers every checked action at once
        // rather than asking for a command name per action.
        window.onQuickConfigModalVariantChange = function () {
            var select = document.getElementById("quickConfigModalSelect");
            var container = document.getElementById("twitchat-presets-body");
            var description = document.getElementById("quickConfigModalDescription");
            var paramsContainer = document.getElementById("quickConfigModalParams");
            paramsContainer.innerHTML = "";
            if (select.value === "link") {
                description.textContent = container.dataset.i18nQuickConfigLinkHelp || "";
            } else if (select.value === "chat") {
                description.textContent = container.dataset.i18nQuickConfigChatHelp || "";
                var input = document.createElement("input");
                input.type = "text";
                input.placeholder = container.dataset.i18nQuickConfigCommandLabel || "";
                input.dataset.paramKey = "command";
                input.className = "quick-config-param-input";
                paramsContainer.appendChild(input);
            } else {
                description.textContent = "";
            }
        };

        // The "Toutes les actions" checkbox is a one-shot convenience: checking/unchecking it
        // sets every individual action checkbox to match, but doesn't keep tracking them
        // afterwards — a streamer can still fine-tune the selection by hand.
        window.onQuickConfigModalTargetAllChange = function () {
            var checked = document.getElementById("quickConfigModalTargetAll").checked;
            document.querySelectorAll(".quick-config-target-action").forEach(function (cb) {
                cb.checked = checked;
            });
        };

        window.applyQuickConfigFromModal = function () {
            var select = document.getElementById("quickConfigModalSelect");
            var variant = select.value;
            if (!variant) return;
            var commandInput = document.querySelector('#quickConfigModalParams .quick-config-param-input[data-param-key="command"]');
            var commandValue = commandInput ? commandInput.value : "";
            var configs = getTwitchatQuickConfigs();
            var groupKeys = Array.prototype.map.call(
                document.querySelectorAll(".quick-config-target-action:checked"),
                function (cb) { return cb.value; });
            groupKeys.forEach(function (groupKey) {
                var qc = configs.find(function (q) { return q.groupKey === groupKey && q.variant === variant; });
                if (!qc) return;
                var json = qc.templateJson;
                if (commandInput) json = json.split("{{param:command}}").join(commandValue);
                try {
                    json = JSON.stringify(JSON.parse(json), null, 2);
                } catch (e) {
                    // leave json as-is if parameter substitution produced invalid JSON
                }
                var details = document.querySelector(".twitchat-new-preset[data-event-type=\"" + qc.eventType + "\"]");
                var textarea = details ? details.querySelector("textarea[name=payloadJson]") : null;
                if (textarea) textarea.value = json;
                if (details) details.open = true;
            });
            document.getElementById("quickConfigModal").style.display = "none";
        };
    </script>
</div>
</body>
</html>
