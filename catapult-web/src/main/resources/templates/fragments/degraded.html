<!--/* catapult-api's degraded mode (DegradedState): folded to its title and where to read why, unfolded to what
     runs slower. Shown from the model; degraded.js words the effects' lines from data-view (the initial
     DegradedView), then keeps them up to date. Its texts are labels (data-labels: property → label), the JS has none. */-->
<div id="degraded-banner" class="degraded-banner" th:fragment="banner" role="status"
     th:hidden="${!degraded.degraded}"
     th:attr="data-labels=${degradedLabelsJson},data-label-normal=#{degraded.normal('{0}')},data-view=${degradedJson},data-label-incident=#{degraded.link.incident},data-label-status=#{degraded.link.status}">
    <details class="degraded-banner-details">
        <summary>
            <mdui-icon name="speed"></mdui-icon>
            <strong th:text="#{degraded.title}">degraded.title</strong>
            <span class="degraded-banner-toggle"><span th:text="#{degraded.details}">degraded.details</span>
                <mdui-icon name="expand_more" class="degraded-banner-chevron"></mdui-icon></span>
        </summary>
        <ul class="degraded-banner-effects">
            <!--/* The effects' lines go before this one (degraded.js). */-->
            <li data-degraded-line="rest" th:text="#{degraded.effect.rest}">degraded.effect.rest</li>
        </ul>
    </details>
    <!--/* Out of the details, to be seen folded; out of the summary too, where it would also fold the banner. */-->
    <a data-degraded-link class="degraded-banner-link" target="_blank" rel="noopener noreferrer"
       th:attr="href=${degraded.link}" th:hidden="${degraded.link == null}"
       th:text="${degraded.incident} ? #{degraded.link.incident} : #{degraded.link.status}">degraded.link.status</a>
    <mdui-button-icon icon="close" data-degraded-dismiss
                      th:attr="aria-label=#{degraded.dismiss}"></mdui-button-icon>
</div>
