<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*@thymesvar id="assignments" type="java.util.List"*/-->

<div th:fragment="widget(assignments)" id="experiment-feedback-widget"
     th:if="${!#lists.isEmpty(assignments)}"
     style="position:fixed; bottom:1rem; right:1rem; z-index:1000;">

    <div id="feedback-toggle">
        <button onclick="document.getElementById('feedback-panel').style.display='block'; this.style.display='none';"
                class="btn btn-sm btn-outline" style="border-radius:2rem;">
            💬 Donner mon avis
        </button>
    </div>

    <div id="feedback-panel" style="display:none; background:var(--surface); border:1px solid var(--border); border-radius:0.5rem; padding:1rem; width:280px; box-shadow:0 4px 12px rgba(0,0,0,.15);">
        <div style="display:flex; justify-content:space-between; margin-bottom:0.75rem;">
            <strong>Votre avis</strong>
            <button onclick="document.getElementById('feedback-panel').style.display='none'; document.getElementById('feedback-toggle').style.display='block';"
                    style="background:none; border:none; cursor:pointer; font-size:1.1rem;">✕</button>
        </div>

        <form ws:post="@{/experiments/feedback}" ws:target="#experiment-feedback-widget" ws:swap="outerHTML"> <!-- nosemgrep -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${assignments.size() > 1}" style="margin-bottom:0.5rem;">
                <label>Feature testée</label>
                <select name="experimentId" class="form-control" style="width:100%;" aria-label="Feature testée">
                    <option th:each="a : ${assignments}"
                            th:value="${a.experiment.id}"
                            th:text="${a.experiment.name}"></option>
                </select>
            </div>
            <input th:if="${assignments.size() == 1}" type="hidden" name="experimentId"
                   th:value="${assignments[0].experiment.id}"/>

            <div style="margin-bottom:0.5rem;">
                <label style="display:block; margin-bottom:0.25rem;">Score (0 = mauvais, 10 = excellent)</label>
                <div style="display:flex; gap:2px; flex-wrap:wrap;">
                    <label th:each="i : ${#numbers.sequence(0, 10)}" style="cursor:pointer;">
                        <input type="radio" name="npsScore" th:value="${i}" required style="display:none;"
                               th:id="'nps-' + ${i}"/>
                        <span th:text="${i}" class="nps-btn"
                              style="display:inline-block; width:22px; text-align:center; padding:2px; border:1px solid var(--border); border-radius:3px; font-size:0.85rem;"
                              onclick="document.querySelectorAll('#feedback-panel .nps-btn').forEach(s=>{s.style.background='';s.style.color='';}); document.getElementById('nps-' + this.innerText.trim()).checked=true; this.style.background='var(--primary)'; this.style.color='white';"></span>
                    </label>
                </div>
            </div>

            <div style="margin-bottom:0.75rem;">
                <textarea name="comment" placeholder="Dites-nous en plus…" aria-label="Commentaire"
                          style="width:100%; resize:none; height:60px; padding:0.25rem; border:1px solid var(--border); border-radius:3px;" maxlength="500"></textarea>
            </div>

            <button type="submit" class="btn btn-sm btn-primary" style="width:100%;">Envoyer</button>
        </form>
    </div>
</div>

<div th:fragment="confirmed" id="experiment-feedback-widget"
     style="position:fixed; bottom:1rem; right:1rem; z-index:1000; background:var(--surface); border:1px solid var(--border); border-radius:0.5rem; padding:0.75rem 1rem; box-shadow:0 4px 12px rgba(0,0,0,.15); animation: expWidgetFadeOut 0.5s ease-in 2.5s forwards;">
    <style>@keyframes expWidgetFadeOut { to { opacity: 0; pointer-events: none; } }</style>
    ✅ Merci pour votre avis !
</div>

</body>
</html>
