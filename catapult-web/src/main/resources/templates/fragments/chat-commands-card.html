<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:ws="https://catapult.enimaloc.fr/ws">
<body>
<section th:fragment="chat-commands-card" class="card">
    <div class="card-header">
        <h3 th:text="#{chat_commands.page.title}">Chat commands</h3>
        <button class="btn-help"
                ws:get="@{/help/chat-commands}"
                ws:target="#help-panel-body"
                ws:swap="innerHTML"
                ws:after="help-loaded"
                th:title="#{help.panel.title}">?</button>
    </div>
    <p class="text-muted mb-16" th:text="#{chat_commands.intro}">
        Tous les presets sont pré-enregistrés désactivés. Coche « Activé » et clique « Enregistrer ».
    </p>

<!--    <div id="chatCommandsBotModBanner" class="banner banner-warning" hidden style="margin-bottom:.75rem;">-->
<!--        <span th:text="#{chat_commands.bot_not_modded}">The Catapult bot is not a moderator.</span>-->
<!--    </div>-->

    <table class="commands-table" style="width:100%; border-collapse:collapse;">
        <thead>
            <tr style="text-align:left; border-bottom:1px solid var(--border); color:var(--text-muted);">
                <th style="padding:.5rem .5rem;" th:text="#{chat_commands.column.name}">Name</th>
                <th style="padding:.5rem .5rem;" th:text="#{chat_commands.column.permission}">Permission</th>
                <th style="padding:.5rem .5rem; text-align:center;" th:text="#{chat_commands.column.enabled}">Enabled</th>
                <th style="padding:.5rem .5rem;" th:text="#{chat_commands.column.actions}">Actions</th>
            </tr>
        </thead>
        <tbody id="chatCommandsTbody"></tbody>
    </table>

    <details style="margin-top:1.25rem;">
        <summary style="cursor:pointer; font-weight:600;" th:text="#{chat_commands.add_custom}">Add custom command</summary>
        <form id="chatCommandsCustomForm" hx-boost="false"
              style="display:flex; flex-direction:column; gap:.75rem; margin-top:.75rem; max-width:600px;">
            <div class="form-field">
                <label for="customChatCmdName" th:text="#{chat_commands.column.name}">Name</label>
                <input id="customChatCmdName" class="form-input" type="text" name="name"
                       th:placeholder="#{chat_commands.field.name.placeholder}"
                       pattern="^![a-z][a-z0-9_]{0,30}$" required style="font-family:monospace;">
            </div>
            <div class="form-field">
                <label for="customChatCmdTemplate" th:text="#{chat_commands.column.response}">Response</label>
                <textarea id="customChatCmdTemplate" class="form-input" name="template" rows="2"
                          required maxlength="500"
                          th:placeholder="#{chat_commands.field.template.placeholder}"></textarea>
            </div>
            <div class="form-field">
                <label for="customChatCmdPermission" th:text="#{chat_commands.column.permission}">Permission</label>
                <select id="customChatCmdPermission" class="form-input" name="permission" style="width:auto;">
                    <option value="EVERYONE" th:text="#{chat_commands.permission.everyone}">Everyone</option>
                    <option value="MODERATOR" th:text="#{chat_commands.permission.moderator}">Moderator</option>
                    <option value="BROADCASTER" th:text="#{chat_commands.permission.broadcaster}">Broadcaster</option>
                </select>
            </div>
            <div><button type="submit" class="btn btn-primary" th:text="#{chat_commands.action.create}">Create</button></div>
        </form>
    </details>

    <details style="margin-top:1.25rem;">
        <summary style="cursor:pointer; font-weight:600;" th:text="#{chat_commands.params.title}">Parameters</summary>
        <p class="text-muted" th:text="#{chat_commands.params.intro}">Free-form key=value pairs...</p>
        <table style="width:100%; border-collapse:collapse; max-width:600px;">
            <tbody id="chatCommandParamsTbody"></tbody>
        </table>
        <form id="chatCommandParamsAddForm" style="display:flex; gap:.5rem; margin-top:.5rem; max-width:600px;">
            <input id="chatCommandParamKeyInput" class="form-input" type="text" name="key"
                   th:placeholder="#{chat_commands.params.key_placeholder}"
                   pattern="^[A-Za-z_][A-Za-z0-9_]*$" required style="font-family:monospace;">
            <input id="chatCommandParamValueInput" class="form-input" type="text" name="value"
                   th:placeholder="#{chat_commands.params.value_placeholder}" required>
            <button type="submit" class="btn btn-primary" th:text="#{chat_commands.params.add}">Add</button>
        </form>
    </details>

    <template id="chatCommandParamRowTpl">
        <tr style="border-bottom:1px solid var(--border);">
            <td style="padding:.35rem .5rem; font-family:monospace;"><span class="param-key-display"></span></td>
            <td style="padding:.35rem .5rem;"><input type="text" class="form-input param-value-input"></td>
            <td style="padding:.35rem .5rem; white-space:nowrap;">
                <button type="button" class="btn param-save-btn" th:text="#{chat_commands.action.edit}">Save</button>
                <button type="button" class="btn param-delete-btn" th:text="#{chat_commands.action.delete}">Delete</button>
            </td>
        </tr>
    </template>

    <template id="chatCommandsRowTpl">
        <tr style="border-bottom:1px solid var(--border); vertical-align:top;">
            <td style="padding:.5rem .5rem; white-space:nowrap;">
                <span class="cmd-name-display" style="font-family:monospace;"></span>
                <span class="builtin-badge" hidden
                      th:text="#{chat_commands.badge.builtin}"
                      style="display:inline-block; font-size:.7em; margin-left:.25em; padding:.1em .35em; border:1px solid var(--border); border-radius:.25em; color:var(--text-muted);">built-in</span>
            </td>
            <td style="padding:.5rem .5rem;">
                <span class="cmd-permission-display"></span>
            </td>
            <td style="padding:.5rem .5rem; text-align:center;">
                <label class="toggle-label" style="display:inline-flex; margin:0;">
                    <input type="checkbox" class="enabled-toggle">
                    <span class="toggle-slider"></span>
                </label>
            </td>
            <td style="padding:.5rem .5rem; white-space:nowrap;">
                <button type="button" class="btn edit-btn" th:text="#{chat_commands.action.edit}">Modifier</button>
                <button type="button" class="btn delete-btn" th:text="#{chat_commands.action.delete}">Delete</button>
            </td>
        </tr>
    </template>

    <script th:inline="javascript">
    (function () {
        const I18N = {
            deleteConfirm: /*[[#{chat_commands.action.delete_confirm(' ')}]]*/ 'Supprimer  ?',
            builtinTooltip: /*[[#{chat_commands.badge.builtin.tooltip}]]*/ 'Java command — name not editable'
        };

        const PERMISSION_LABELS = {
            EVERYONE: /*[[#{chat_commands.permission.everyone}]]*/ 'Everyone',
            MODERATOR: /*[[#{chat_commands.permission.moderator}]]*/ 'Moderator',
            BROADCASTER: /*[[#{chat_commands.permission.broadcaster}]]*/ 'Broadcaster'
        };

        function reportError(err) {
            const code = err && err.error ? err.error.code : 'ERROR';
            const message = err && err.error ? err.error.message : String(err);
            const text = code + ' : ' + message;
            if (window.catapultOverlay && window.catapultOverlay.showToast) {
                window.catapultOverlay.showToast(text, { kind: 'error', duration: 6000 });
            } else {
                alert(text);
            }
        }

        function reportSuccess(msg) {
            if (window.catapultOverlay && window.catapultOverlay.showToast) {
                window.catapultOverlay.showToast(msg, { kind: 'success', duration: 2500 });
            }
        }

        function buildRow(tpl, cmd) {
            const node = tpl.cloneNode(true);
            const row = node.querySelector('tr');
            row.dataset.id = cmd.id;
            row.querySelector('.cmd-name-display').textContent = cmd.name;
            row.querySelector('.cmd-permission-display').textContent =
                PERMISSION_LABELS[cmd.permission] || cmd.permission;
            row.querySelector('.enabled-toggle').checked = cmd.enabled;

            const editBtn = row.querySelector('.edit-btn');
            editBtn.onclick = () => {
                // chat-command-editor.js waits for Blockly (a large, separately-loaded
                // script) before wiring itself up — openEditor may not exist yet if the
                // user clicks Modifier immediately after the page loads.
                if (!window.chatCommandEditor || !window.chatCommandEditor.openEditor) {
                    reportError({ error: { code: 'NOT_READY', message: 'Éditeur en cours de chargement, réessaie dans un instant' } });
                    return;
                }
                window.chatCommandEditor.openEditor(cmd);
            };

            row.querySelector('.enabled-toggle').onchange = async (e) => {
                try {
                    const resp = await window.catapultWs.request('chat-commands.update', {
                        id: cmd.id,
                        enabled: e.target.checked
                    });
                    Object.assign(cmd, resp.result);
                    reportSuccess(cmd.name + ' enregistrée');
                } catch (err) {
                    reportError(err);
                    e.target.checked = !e.target.checked;
                }
            };

            const deleteBtn = row.querySelector('.delete-btn');
            deleteBtn.onclick = async () => {
                if (!confirm(I18N.deleteConfirm.replace('  ', ' ' + cmd.name + ' '))) return;
                if (deleteBtn.disabled) return;
                deleteBtn.disabled = true;
                try {
                    await window.catapultWs.request('chat-commands.delete', { id: cmd.id });
                    row.remove();
                    reportSuccess(cmd.name + ' supprimée');
                } catch (err) {
                    reportError(err);
                    deleteBtn.disabled = false;
                }
            };

            const isBuiltin = cmd.presetKey && cmd.presetKey.indexOf('builtin:') === 0;
            if (isBuiltin) {
                const badge = row.querySelector('.builtin-badge');
                badge.hidden = false;
                badge.title = I18N.builtinTooltip;
                deleteBtn.remove();
            }
            return node;
        }

        async function loadList() {
            try {
                const resp = await window.catapultWs.request('chat-commands.list', {});
                const data = resp.result || {};
                const tbody = document.getElementById('chatCommandsTbody');
                const tpl = document.getElementById('chatCommandsRowTpl').content;
                tbody.replaceChildren();
                for (const cmd of (data.commands || [])) {
                    tbody.appendChild(buildRow(tpl, cmd));
                }
            } catch (err) { reportError(err); }
        }

        document.getElementById('chatCommandsCustomForm').onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            try {
                const resp = await window.catapultWs.request('chat-commands.create', {
                    name: fd.get('name'),
                    template: fd.get('template'),
                    permission: fd.get('permission'),
                    enabled: true,
                    fallbacks: {}
                });
                const tbody = document.getElementById('chatCommandsTbody');
                const tpl = document.getElementById('chatCommandsRowTpl').content;
                tbody.appendChild(buildRow(tpl, resp.result));
                e.target.reset();
                reportSuccess(resp.result.name + ' créée');
            } catch (err) { reportError(err); }
        };

        // Re-list after the editor modal saves, so the row's name/permission
        // display and the in-memory cmd snapshot reflect the edit.
        window.chatCommandEditor = window.chatCommandEditor || {};
        window.chatCommandEditor.onSaved = loadList;

        // Wait for the WS session to be authenticated before the first list
        // call — chat-commands.list requires an auth-ok session.
        if (window.__wsCsrfToken) {
            loadList();
        } else {
            document.addEventListener('ws:auth.ok', loadList, { once: true });
        }

        const PARAMS_I18N = {
            deleteConfirm: /*[[#{chat_commands.params.delete_confirm(' ')}]]*/ 'Delete parameter  ?',
            invalidKey: /*[[#{chat_commands.params.invalid_key}]]*/ 'Invalid key'
        };

        function buildParamRow(tpl, param) {
            const node = tpl.cloneNode(true);
            const row = node.querySelector('tr');
            row.dataset.key = param.key;
            row.querySelector('.param-key-display').textContent = param.key;
            const valueInput = row.querySelector('.param-value-input');
            valueInput.value = param.value;

            row.querySelector('.param-save-btn').onclick = async () => {
                try {
                    await window.catapultWs.request('chat-commands.params.set', {
                        key: param.key,
                        value: valueInput.value
                    });
                    reportSuccess(param.key + ' enregistré');
                } catch (err) { reportError(err); }
            };

            row.querySelector('.param-delete-btn').onclick = async () => {
                if (!confirm(PARAMS_I18N.deleteConfirm.replace('  ', ' ' + param.key + ' '))) return;
                try {
                    await window.catapultWs.request('chat-commands.params.delete', { key: param.key });
                    row.remove();
                    reportSuccess(param.key + ' supprimé');
                } catch (err) { reportError(err); }
            };

            return node;
        }

        async function loadParams() {
            try {
                const resp = await window.catapultWs.request('chat-commands.params.list', {});
                const params = resp.result || [];
                const tbody = document.getElementById('chatCommandParamsTbody');
                const tpl = document.getElementById('chatCommandParamRowTpl').content;
                tbody.replaceChildren();
                for (const param of params) {
                    tbody.appendChild(buildParamRow(tpl, param));
                }
            } catch (err) { reportError(err); }
        }

        document.getElementById('chatCommandParamsAddForm').onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const key = fd.get('key');
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) {
                reportError({ error: { code: 'INVALID_KEY', message: PARAMS_I18N.invalidKey } });
                return;
            }
            try {
                await window.catapultWs.request('chat-commands.params.set', { key: key, value: fd.get('value') });
                e.target.reset();
                await loadParams();
                reportSuccess(key + ' ajouté');
            } catch (err) { reportError(err); }
        };

        if (window.__wsCsrfToken) {
            loadParams();
        } else {
            document.addEventListener('ws:auth.ok', loadParams, { once: true });
        }
    })();
    </script>

    <div th:replace="~{fragments/chat-command-editor-modal :: chat-command-editor-modal}"></div>
    <script th:src="@{/js/chat-command-editor.js}"></script>
</section>
</body>
</html>
