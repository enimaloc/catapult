<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Bouton flottant + formulaire -->
<div th:fragment="widget" id="feedback-widget"
     hx-preserve="true"
     style="position:fixed; bottom:4rem; right:1rem;">

    <div id="feedback-toggle">
        <button onclick="document.getElementById('feedback-panel').style.display='block';
        document.getElementById('feedback-toggle').style.display='none';"
                class="btn btn-sm btn-outline" style="border-radius:2rem;">
            🐛 Signaler / Suggérer
        </button>
    </div>

    <div id="feedback-panel" style="display:none; background:var(--surface); border:1px solid var(--border);
         border-radius:0.5rem; padding:1rem; width:300px; box-shadow:0 4px 12px rgba(0,0,0,.15);">

        <div style="display:flex; justify-content:space-between; margin-bottom:0.75rem;">
            <strong>Signaler / Suggérer</strong>
            <button onclick="document.getElementById('feedback-panel').style.display='none';
                             document.getElementById('feedback-toggle').style.display='block';"
                    style="color: var(--text); background:none; border:none; cursor:pointer; font-size:1.1rem;">✕</button>
        </div>

        <form ws:post="@{/feedback}" ws:target="#feedback-widget" ws:swap="outerHTML"> <!-- nosemgrep -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div style="margin-bottom:0.5rem;">
                <label style="display:block; margin-bottom:0.25rem;">Type</label>
                <select name="type" class="form-control" style="width:100%;" aria-label="Type de retour">
                    <option value="BUG">🐛 Bug</option>
                    <option value="FEATURE">✨ Suggestion</option>
                </select>
            </div>

            <div style="margin-bottom:0.5rem;">
                <label style="display:block; margin-bottom:0.25rem;">Titre <span style="color:var(--danger)">*</span></label>
                <input type="text" name="title" required maxlength="255" class="form-control"
                       placeholder="Résumé en une phrase" style="width:100%;"/>
            </div>

            <div style="margin-bottom:0.75rem;">
                <label style="display:block; margin-bottom:0.25rem;">Description</label>
                <textarea name="description" maxlength="2000" aria-label="Description"
                          style="width:100%; resize:none; height:80px; padding:0.25rem;
                                 border:1px solid var(--border); border-radius:3px;"
                          placeholder="Étapes pour reproduire, contexte…"></textarea>
            </div>

            <button type="submit" class="btn btn-sm btn-primary" style="width:100%;">Envoyer</button>
        </form>
    </div>
</div>

<!-- Fragment retourné après soumission réussie -->
<div th:fragment="submitted" id="feedback-widget"
     style="position:fixed; bottom:4rem; right:1rem; background:var(--surface);
            border:1px solid var(--border); border-radius:0.5rem; padding:0.75rem 1rem;
            box-shadow:0 4px 12px rgba(0,0,0,.15); animation: fbWidgetFadeOut 0.5s ease-in 3s forwards;">
    <style>@keyframes fbWidgetFadeOut { to { opacity:0; pointer-events:none; } }</style>
    ✅ Merci ! Votre retour a été soumis. Vous serez notifié des mises à jour.
</div>

<!-- Fragment retourné après désabonnement -->
<span th:fragment="unsubscribed(submission)" th:with="s=${submission}">
    <span style="color:var(--muted); font-size:0.85rem;">Désabonné</span>
</span>

</body>
</html>
