<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:ws="https://catapult.enimaloc.fr/ws">
<body>
<!--/*@thymesVar id="isPendingDeletion" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="user" type="fr.enimaloc.catapult.domain.UserAccount"*/-->
<!--/*@thymesVar id="isOwner" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="app" type="fr.enimaloc.catapult.web.GlobalModelAdvice$App"*/-->
<div th:fragment="danger-zone" th:if="${isOwner}">
    <section th:unless="${isPendingDeletion}" class="card card-danger">
        <div class="card-header">
            <h3 th:text="#{danger_zone.title}">Zone danger</h3>
            <button class="btn-help"
                    ws:get="@{/help/danger-zone}"
                    ws:target="#help-panel-body"
                    ws:swap="innerHTML"
                    ws:after="help-loaded"
                    th:title="#{help.panel.title}">?</button>
        </div>
        <p th:utext="#{danger_zone.description(${app.account.deletionDelayDays})}">La suppression de compte est irréversible après <strong th:text="|${app.account.deletionDelayDays} jours|"></strong>.</p>
        <button type="button" class="btn btn-danger"
                onclick="document.getElementById('deleteModal').style.display='flex'"
                th:text="#{danger_zone.delete_button}">
            Supprimer mon compte
        </button>
    </section>

    <section th:if="${isPendingDeletion}" class="card card-danger">
        <div class="card-header">
            <h3 th:text="#{danger_zone.pending_title}">Suppression en cours</h3>
            <button class="btn-help"
                    ws:get="@{/help/danger-zone}"
                    ws:target="#help-panel-body"
                    ws:swap="innerHTML"
                    ws:after="help-loaded"
                    th:title="#{help.panel.title}">?</button>
        </div>
        <p>
            <span th:text="#{danger_zone.pending_description}">Ton compte sera supprimé définitivement le</span>
            <strong th:text="${#temporals.format(user.deletionRequestedAt, #messages.msg('common.date-format'))}"></strong>.
        </p>
        <form th:action="@{/channels/{u}/settings/cancel-deletion(u=${channelUsername})}" method="post"> <!-- nosemgrep -->
            <button type="submit" class="btn btn-outline" th:text="#{danger_zone.cancel_button}">Annuler la suppression</button>
        </form>
    </section>
</div>
</body>
</html>
