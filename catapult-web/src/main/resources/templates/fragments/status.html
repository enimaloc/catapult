<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*@thymesvar id="botEnabled" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="isLive" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="currentGame" type="fr.enimaloc.catapult.getter.DetectedGame"*/-->
<!--
    The status fragment renders BOTH states of each toggleable block (bot
    enabled/disabled, stream live/offline, game detected/cleared) and hides
    the inactive one with hidden=true. channel-page.js toggles the visibility
    on WS events without needing a server round-trip or client-side i18n.
-->
<div th:fragment="status" id="status-card">
    <div class="card">
        <div class="card-header">
            <h3 th:text="#{status.bot_title}">État du bot</h3>
            <button class="btn-help"
                    hx-get="/help/status"
                    hx-target="#help-panel-body"
                    hx-swap="innerHTML"
                    hx-on::after-request="openHelpPanel()"
                    th:title="#{help.panel.title}">?</button>
        </div>
        <div id="bot-status-active" class="status status-active" th:hidden="${!botEnabled}">
            <span class="status-dot"></span> <span th:text="#{status.active}">Actif</span>
            <form th:action="@{/channels/{u}/settings/bot(u=${channelUsername})}" method="post" > <!-- nosemgrep -->
                <button type="submit" class="btn btn-primary" th:text="#{common.disable}">Désactiver</button>
            </form>
        </div>
        <div id="bot-status-inactive" class="status status-inactive" th:hidden="${botEnabled}">
            <span class="status-dot"></span> <span th:text="#{status.inactive}">Inactif</span>
            <form th:action="@{/channels/{u}/settings/bot(u=${channelUsername})}" method="post" > <!-- nosemgrep -->
                <button type="submit" class="btn btn-primary" th:text="#{common.enable}">Activer</button>
            </form>
        </div>
        <div class="divider"></div>
        <h3 th:text="#{status.stream_title}">Stream</h3>
        <div id="stream-status-live" class="status status-active" th:hidden="${!isLive}">
            <span class="status-dot"></span> <span th:text="#{status.live}">En live</span>
        </div>
        <div id="stream-status-offline" class="status status-inactive" th:hidden="${isLive}">
            <span class="status-dot"></span> <span th:text="#{status.offline}">Hors ligne</span>
        </div>
        <div class="divider"></div>
        <h3 th:text="#{status.current_game_title}">Jeu en cours</h3>
        <div id="current-game-info" th:hidden="${currentGame == null}">
            <p>
                <strong id="current-game-name" th:text="${currentGame != null ? currentGame.sourceName : ''}"></strong>
                <span class="badge" id="current-game-source" th:text="${currentGame != null ? currentGame.sourceType : ''}"></span>
            </p>
        </div>
        <div id="current-game-none" th:hidden="${currentGame != null}">
            <p class="text-muted" th:text="#{status.no_game}">Aucun jeu détecté</p>
        </div>
    </div>
</div>
</body>
</html>
