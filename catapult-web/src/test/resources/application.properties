spring.application.name=Catapult-Web-Test

# Disable Redis auto-configuration for tests (Phase 2a doesn't use Redis at runtime).
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.RedisRepositoriesAutoConfiguration

# Fake api URL (ApiClient only validates this is non-blank at construction).
catapult.api.url=http://localhost:0
catapult.api.public-url=http://localhost:0
catapult.jwt.secret=test-secret-dummy-value-for-tests-only

# Mute admin web-config bootstrap so tests are quiet.
app.admin.web-config.exposed-prefixes=catapult.,app.
app.admin.web-config.secret-patterns=.*\\.secret$,.*\\.password$
app.admin.web-config.taboo-keys=catapult.jwt.secret

# Management endpoints port shouldn't collide with random server port.
management.server.port=-1
