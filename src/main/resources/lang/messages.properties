# ---- help panel ------------------------------------------------------------
help.panel.title=Help

help.connections.title=Connections
help.connections.body=<p>This section shows the services connected to your {2} account.</p><ul><li><strong>Twitch</strong> is the main provider. To disconnect from Twitch, use the Logout button in the navigation bar.</li><li><strong>Steam</strong> lets {2} detect the game you are currently playing. Connect your Steam account to enable automatic detection.</li></ul>

help.status.title=Status
help.status.body=<p>This panel shows the real-time status of {2}.</p><ul><li><strong>Bot</strong>: indicates whether the bot is active and monitoring your stream.</li><li><strong>Stream</strong>: indicates whether you are currently live on Twitch.</li><li><strong>Current game</strong>: the game detected from your active source (Steam, etc.).</li></ul>

help.bindings.title=Associations
help.bindings.body=<p>An association links a game (detected via Steam or another source) to a Twitch category and content labels.</p><ul><li><strong>AUTO</strong>: the category was set automatically by {2}.</li><li><strong>MANUAL</strong>: you set the category yourself.</li><li><strong>INCOMPLETE</strong>: no Twitch category has been assigned to this game yet.</li><li>The <strong>Content labels</strong> toggle enables or disables content restrictions for this game.</li><li>The <strong>Ignored</strong> toggle excludes this game from automatic updates.</li></ul>

help.bot.title=Bot
help.bot.body=<p>The {2} bot watches your stream and automatically updates your Twitch category based on the detected game.</p><p>Enable it so {2} changes your category whenever you switch games.</p><p>When the bot is disabled, no automatic updates are performed.</p>

help.no-game.title=Default category
help.no-game.body=<p>This category is applied automatically when no game is detected.</p><p>Configure the Twitch category and content labels to use when you are live without playing a recognised game (e.g. {1}).</p>

help.danger-zone.title=Danger zone
help.danger-zone.body=<p>This section lets you permanently delete your {2} account.</p><ul><li>Deletion is <strong>irreversible</strong> after a {0}-day delay.</li><li>During that delay you can cancel the deletion.</li><li>All your data (bindings, settings, connections) will be erased.</li></ul>

