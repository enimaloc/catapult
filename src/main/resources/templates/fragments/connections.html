<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*@thymesvar id="hasSteamProvider" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="hasSteam" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="steamProfilePrivate" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="steamRateLimited" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="isOwner" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="hasSteamPersonalToken" type="java.lang.Boolean"*/-->
<section th:fragment="connections" id="connections-section" class="card"
         th:attr="hx-get=@{/channels/{u}/fragments/connections(u=${channelUsername})}"
         hx-trigger="every 30s"
         hx-swap="outerHTML">
    <div class="card-header">
        <h3 th:text="#{connections.title}">Connexions</h3>
        <button class="btn-help"
                hx-get="/help/connections"
                hx-target="#help-panel-body"
                hx-swap="innerHTML"
                hx-on::after-request="openHelpPanel()"
                th:title="#{help.panel.title}">?</button>
    </div>
    <div class="provider-grid">
        <div class="provider-card">
            <strong>Twitch</strong>
            <span class="badge badge-connected" th:text="#{connections.connected}">Connecté</span>
            <p class="text-muted text-sm" th:text="#{connections.twitch_note}">Provider principal — déconnexion via logout</p>
        </div>
        <div th:if="${hasSteamProvider}" class="provider-card">
            <div style="display:flex; align-items:center; gap:0.5rem;">
                <strong>Steam</strong>
                <span th:if="${hasSteam}" class="badge badge-connected" th:text="#{connections.connected}">Connecté</span>
                <span th:unless="${hasSteam}" class="badge badge-disconnected" th:text="#{connections.not_connected}">Non connecté</span>
                <!-- Rate-limited indicator -->
                <button th:if="${hasSteam and isOwner and steamRateLimited}"
                        type="button" class="btn-help"
                        onclick="document.getElementById('steamRateLimitModal').style.display='flex'"
                        th:title="#{connections.steam.rate_limited.help_title}">!</button>
            </div>

            <!-- Private warning with resolve button -->
            <div th:if="${hasSteam and isOwner and steamProfilePrivate and !hasSteamPersonalToken}" class="provider-warning">
                <p th:text="#{connections.steam.private_warning}">Your Steam profile is private — game detection won't work.</p>
                <button type="button" class="btn btn-sm btn-primary"
                        onclick="document.getElementById('steamPrivacyModal').style.display='flex'"
                        th:text="#{connections.steam.resolve}">Résoudre →</button>
            </div>

            <!-- Personal token saved indicator -->
            <div th:if="${hasSteam and isOwner and hasSteamPersonalToken}" class="provider-info">
                <span class="badge badge-connected" th:text="#{connections.steam.personal_token_set}">Token personnel ✓</span>
                <form th:action="@{/channels/{u}/settings/steam-personal-token/delete(u=${channelUsername})}" method="post" style="display:inline"> <!-- nosemgrep -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-danger" th:text="#{connections.steam.delete_personal_token}">Supprimer le token</button>
                </form>
            </div>

            <div th:if="${hasSteam and isOwner}">
                <form th:action="@{/channels/{u}/settings/disconnect(u=${channelUsername})}" method="post"> <!-- nosemgrep -->
                    <input type="hidden" name="provider" value="STEAM"/>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-danger" th:text="#{connections.disconnect}">Déconnecter</button>
                </form>
            </div>
            <div th:if="${isOwner and !hasSteam}">
                <a target="_blank" th:href="@{/connect/steam}" class="btn btn-primary" th:text="#{connections.connect}">Connecter</a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
