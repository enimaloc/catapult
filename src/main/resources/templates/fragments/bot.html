<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*@thymesvar id="botEnabled" type="java.lang.Boolean"*/-->
<section th:fragment="bot" class="card">
    <div class="card-header">
        <h3 th:text="#{bot.title}">Bot</h3>
        <button class="btn-help"
                hx-get="/help/bot"
                hx-target="#help-panel-body"
                hx-swap="innerHTML"
                hx-on::after-request="openHelpPanel()"
                th:title="#{help.panel.title}">?</button>
    </div>
    <form th:action="@{/channels/{u}/settings/bot(u=${channelUsername})}" method="post"> <!-- nosemgrep -->
        <label class="toggle">
            <input type="checkbox" name="enabled" th:checked="${botEnabled}">
            <span th:text="#{bot.enable_label}">Activer le bot</span>
        </label>
        <button type="submit" class="btn btn-primary" th:text="#{common.save}">Enregistrer</button>
    </form>
</section>
</body>
</html>
