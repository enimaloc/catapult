<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{template::layout(~{::title}, 'app', ~{::div#main-content}, ~{::style}, 'container', ~{::aside#left-panel}, ~{::aside#right-panel})}"
      xmlns:exp="http://www.w3.org/1999/xhtml">
<head>
    <title>Catapult</title>
</head>
<body>
    <div id="main-content">
        <div th:replace="~{fragments/connections :: connections}"></div>
        <div th:attr="hx-get=@{/channels/{u}/fragments/no-game-settings(u=${channelUsername})}" hx-trigger="load" hx-swap="outerHTML">
            <div class="card"><p class="text-muted" style="padding:16px" th:text="#{app.loading}">Chargement…</p></div>
        </div>
        <div th:attr="hx-get=@{/channels/{u}/fragments/incomplete-fallback-settings(u=${channelUsername})}" hx-trigger="load" hx-swap="outerHTML">
            <div class="card"><p class="text-muted" style="padding:16px" th:text="#{app.loading}">Chargement…</p></div>
        </div>
        <div exp:show-for="sidebar-layout:control"><div th:replace="~{fragments/bot :: bot}"></div></div>
        <div th:replace="~{fragments/bindings :: bindings}"></div>
        <div th:replace="~{fragments/danger-zone :: danger-zone}"></div>

        <!-- Modal suppression -->
        <div id="deleteModal" class="modal" style="display:none">
            <div class="modal-content">
                <h3 th:text="#{app.modal.title}">Confirmer la suppression</h3>
                <p th:text="#{app.modal.prompt}">Saisis ton nom d'utilisateur Twitch pour confirmer :</p>
                <form th:action="@{/channels/{u}/settings/delete-account(u=${channelUsername})}" method="post"> <!-- nosemgrep -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="text" name="confirmUsername" th:placeholder="#{app.modal.username_placeholder}" th:aria-label="#{app.modal.username_placeholder}" required>
                    <div class="modal-actions">
                        <button type="button"
                                onclick="document.getElementById('deleteModal').style.display='none'"
                                class="btn btn-outline" th:text="#{common.cancel}">Annuler</button>
                        <button type="submit" class="btn btn-danger" th:text="#{app.modal.confirm_button}">Supprimer définitivement</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <aside id="left-panel">
        <div th:replace="~{fragments/status :: status}"></div>
        <div th:replace="~{fragments/activity-log :: activity-log}"></div>
        <div exp:show-for="sidebar-layout:bot-left"><div th:replace="~{fragments/bot :: bot}"></div></div>
    </aside>

    <aside id="right-panel">
        <div exp:show-for="sidebar-layout:bot-right"><div th:replace="~{fragments/bot :: bot}"></div></div>
    </aside>

    <script th:inline="javascript">
        const channelUsername = /*[[${channelUsername}]]*/ '';

        // Connections: refresh when a new account is linked
        function refreshConnections() {
            htmx.ajax('GET', '/channels/' + channelUsername + '/fragments/connections', {
                target: '#connections-section',
                swap: 'outerHTML'
            });
        }
        // BroadcastChannel: receives the message from the popup (same browser, same origin)
        const connectionsBc = new BroadcastChannel('catapult-connections');
        connectionsBc.onmessage = function (e) {
            if (e.data === 'steam-linked') refreshConnections();
        };
        // SSE: covers multiple browser sessions on the same account
        (function () {
            const es = new EventSource('/channels/' + channelUsername + '/connections');
            es.addEventListener('steam-linked', refreshConnections);
        })();

        // Activity log SSE
        (function () {
            const list = document.getElementById('log-list');
            const placeholder = document.getElementById('log-placeholder');
            const MAX_LINES = 50;
            const es = new EventSource('/channels/' + channelUsername + '/logs');
            es.onmessage = function (e) {
                if (placeholder) placeholder.remove();
                const li = document.createElement('li');
                li.textContent = e.data;
                li.style.borderBottom = '1px solid #eee';
                li.style.padding = '2px 0';
                list.appendChild(li);
                while (list.children.length > MAX_LINES) list.removeChild(list.firstChild);
            };
            es.onerror = function () { es.close(); };
        })();
    </script>
</body>
</html>
