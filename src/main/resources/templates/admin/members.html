<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{template::layout(~{::title}, 'members', ~{::body}, null, 'container', null, null)}">
<head>
    <title>Catapult — Membres</title>
</head>
<body>
<!--/*@thymesvar id="members" type="java.util.List"*/-->
<!--/*@thymesvar id="liveStatus" type="java.util.Map"*/-->
<!--/*@thymesvar id="isMockProfile" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="canMockSteam" type="java.lang.Boolean"*/-->
<!--/*@thymesvar id="privateSteamProfiles" type="java.util.Set"*/-->
<!--/*@thymesvar id="currentUserTwitchId" type="java.lang.String"*/-->
    <h2 th:text="#{admin.members.title}">Administration — Membres</h2>

    <div th:if="${#lists.isEmpty(members)}" class="text-muted">
        <p th:text="#{admin.members.empty}">Aucun membre en base.</p>
    </div>

    <div th:unless="${#lists.isEmpty(members)}" class="card">
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th th:text="#{admin.members.column.twitch_user}">Utilisateur Twitch</th>
                        <th th:text="#{admin.members.column.steam_id}">Steam ID</th>
                        <th th:text="#{admin.members.column.bot}">Bot</th>
                        <th th:text="#{admin.members.column.status}">Statut</th>
                        <th th:text="#{admin.members.column.created_at}">Créé le</th>
                        <th th:if="${canMockSteam}" th:text="#{admin.members.column.mock_steam}">Mock Steam</th>
                        <th th:text="#{admin.members.column.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!--/*@thymesvar id="member" type="fr.enimaloc.catapult.domain.UserAccount"*/-->
                    <tr th:each="member : ${members}">
                        <td>
                            <strong th:text="${member.twitchUsername}"></strong><br>
                            <span class="badge" th:text="${member.twitchId}"></span>
                        </td>
                        <td th:text="${member.steamId ?: '—'}"></td>
                        <td>
                            <form th:action="@{/admin/members/{id}/bot/toggle(id=${member.id})}" method="post"> <!-- nosemgrep -->
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <div class="pill-toggle"
                                     th:classappend="${member.botEnabled ? 'pill-toggle--active' : 'pill-toggle--inactive'}">
                                    <span class="pill-toggle__label"
                                          th:text="${member.botEnabled} ? #{admin.members.bot.active} : #{admin.members.bot.inactive}"></span>
                                    <button type="submit" class="pill-toggle__btn"
                                            th:text="${member.botEnabled} ? #{admin.members.bot.disable} : #{admin.members.bot.enable}"></button>
                                </div>
                            </form>
                        </td>
                        <td>
                            <th:block th:unless="${isMockProfile}">
                                <span th:if="${member.status.name() == 'ACTIVE'}" class="badge badge-live" th:text="${member.status}"></span>
                                <span th:unless="${member.status.name() == 'ACTIVE'}" class="badge" th:text="${member.status}"></span>
                            </th:block>
                            <th:block th:if="${isMockProfile}">
                                <form th:if="${liveStatus[member.id]}" th:action="@{/admin/members/{id}/twitch/offline(id=${member.id})}" method="post"> <!-- nosemgrep -->
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <div class="pill-toggle pill-toggle--live">
                                        <span class="pill-toggle__label">🔴 Live</span>
                                        <button type="submit" class="pill-toggle__btn">■ Offline</button>
                                    </div>
                                </form>
                                <form th:unless="${liveStatus[member.id]}" th:action="@{/admin/members/{id}/twitch/online(id=${member.id})}" method="post"> <!-- nosemgrep -->
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <div class="pill-toggle pill-toggle--offline">
                                        <span class="pill-toggle__label">⬛ Offline</span>
                                        <button type="submit" class="pill-toggle__btn">▶ Online</button>
                                    </div>
                                </form>
                            </th:block>
                        </td>
                        <td th:text="${member.createdAt}"></td>
                        <td th:if="${canMockSteam}">
                            <div th:if="${member.steamId != null}" style="display:flex;gap:6px;align-items:flex-end">
                                <form th:action="@{/admin/members/{id}/steam/set(id=${member.id})}" method="post"> <!-- nosemgrep -->
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <div class="search-wrapper">
                                        <input th:id="'steam-search-' + ${member.id}"
                                               th:placeholder="#{common.search_placeholder}"
                                               th:aria-label="#{common.search_placeholder}"
                                               oninput="gameSearch(event)"
                                               autocomplete="off"
                                               th:attr="data-results-id='steam-results-' + ${member.id},
                                                        data-gameid-field='steam-gameId-' + ${member.id},
                                                        data-gamename-field='steam-gameName-' + ${member.id}"
                                               data-search-url="/admin/members/igdb/search"
                                               style="width:180px;padding:2px 4px">
                                        <ul th:id="'steam-results-' + ${member.id}" class="game-results"></ul>
                                    </div>
                                    <input type="hidden" name="gameId"   th:id="'steam-gameId-'   + ${member.id}" required>
                                    <input type="hidden" name="gameName" th:id="'steam-gameName-' + ${member.id}" required>
                                    <button type="submit" class="btn btn-sm btn-primary">Set</button>
                                </form>
                                <form th:action="@{/admin/members/{id}/steam/clear(id=${member.id})}" method="post"> <!-- nosemgrep -->
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm">Clear</button>
                                </form>
                                <form th:action="@{/admin/members/{id}/steam/toggle-private(id=${member.id})}" method="post"> <!-- nosemgrep -->
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit"
                                            th:class="${privateSteamProfiles.contains(member.steamId)} ? 'btn btn-sm btn-danger' : 'btn btn-sm'"
                                            th:text="${privateSteamProfiles.contains(member.steamId)} ? '🔒 Private' : '🌐 Public'">
                                    </button>
                                </form>
                            </div>
                            <span th:if="${member.steamId == null}">—</span>
                        </td>
                        <td>
                            <div class="dropdown">
                                <button class="btn btn-sm" type="button"
                                        th:onclick="|toggleDropdown('menu-' + ${member.id})|">⋮</button>
                                <div class="dropdown-menu" th:id="'menu-' + ${member.id}">
                                    <form th:action="@{/admin/impersonate}" method="post"> <!-- nosemgrep -->
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <input type="hidden" name="username" th:value="${member.twitchUsername}"/>
                                        <button type="submit" class="dropdown-item"
                                                th:disabled="${member.twitchId == currentUserTwitchId}"
                                                th:text="#{admin.members.actions.impersonate}">Impersonner</button>
                                    </form>
                                    <form th:if="${member.steamId != null}" th:action="@{/admin/members/{id}/steam/unlink(id=${member.id})}" method="post"> <!-- nosemgrep -->
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="dropdown-item"
                                                th:text="#{admin.members.actions.steam_unlink}">Délier Steam</button>
                                    </form>
                                    <button type="button" class="dropdown-item"
                                            th:data-source-id="${member.id}"
                                            th:data-source-name="${member.twitchUsername}"
                                            onclick="openMigrateModal(this)"
                                            th:text="#{admin.members.actions.migrate}">Migrer…</button>
                                    <hr class="dropdown-divider"/>
                                    <form th:action="@{/admin/members/{id}/delete(id=${member.id})}" method="post"> <!-- nosemgrep -->
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="dropdown-item dropdown-item--danger"
                                                th:disabled="${member.twitchId == currentUserTwitchId}"
                                                th:text="#{admin.members.actions.delete}"
                                                th:data-confirm="#{admin.members.actions.delete.confirm(${member.twitchUsername})}"
                                                onclick="return confirmDelete(this)">Supprimer</button>
                                    </form>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="migrate-modal" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeMigrateModal()">
        <div class="modal-dialog">
            <h3 id="migrate-modal-title" th:text="#{admin.members.migrate.modal_title_prefix}">Migrer les données de</h3>
            <form id="migrate-form" method="post"> <!-- nosemgrep -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" id="migrate-csrf"/>
                <div class="form-group">
                    <label th:text="#{admin.members.migrate.target}" for="migrate-target">Destination</label>
                    <select id="migrate-target" name="targetId" class="form-control" required>
                        <!--/*@thymesvar id="member" type="fr.enimaloc.catapult.domain.UserAccount"*/-->
                        <th:block th:each="member : ${members}">
                            <option th:value="${member.id}"
                                    th:text="${member.twitchUsername}"
                                    th:data-member-id="${member.id}"></option>
                        </th:block>
                    </select>
                </div>
                <fieldset>
                    <legend th:text="#{admin.members.migrate.what}">Migrer :</legend>
                    <label>
                        <input type="checkbox" name="migrateSettings" value="true"/>
                        <span th:text="#{admin.members.migrate.settings}">Paramètres (UserSettings)</span>
                    </label><br/>
                    <label>
                        <input type="checkbox" name="migrateGetters" value="true"/>
                        <span th:text="#{admin.members.migrate.getters}">Getters (GetterConfig)</span>
                    </label><br/>
                    <label>
                        <input type="checkbox" name="migrateBindings" value="true"/>
                        <span th:text="#{admin.members.migrate.bindings}">Bindings (GameBinding)</span>
                    </label>
                </fieldset>
                <div style="margin-top:1rem;display:flex;gap:8px;justify-content:flex-end">
                    <button type="button" class="btn btn-sm" onclick="closeMigrateModal()">Annuler</button>
                    <button type="submit" class="btn btn-sm btn-primary" th:text="#{admin.members.migrate.submit}">Migrer</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
