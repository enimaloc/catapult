<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catapult — Maintenance</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #f1f5f9;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .badge {
            display: inline-block;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 9999px;
            padding: 0.375rem 0.875rem;
            font-size: 0.8rem;
            color: #64748b;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #f59e0b;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .retry-hint {
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">🚀</span>
        <h1>Maintenance en cours</h1>
        <p>
            Catapult est temporairement indisponible le temps d'une mise à jour.<br>
            Revenez dans quelques instants.
        </p>
        <div class="badge">
            <span class="pulse"></span>Nous revenons bientôt
        </div>
        <p class="retry-hint" id="retry-hint">Vérification automatique en cours…</p>
    </div>
    <script>
        (function () {
            var attempts = 0;
            var interval = setInterval(function () {
                fetch('/up')
                    .then(function (r) {
                        if (r.ok) { clearInterval(interval); location.reload(); }
                    })
                    .catch(function () {
                        attempts++;
                        var hint = document.getElementById('retry-hint');
                        if (hint) hint.textContent = 'Nouvelle tentative dans 5s… (' + attempts + ')';
                    });
            }, 5000);
        })();
    </script>
</body>
</html>
