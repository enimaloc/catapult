# The throwaway stack of the timing runs (perf/run.sh), never a real deployment: always used as
#   docker compose -p catapult-verify-perf -f perf/compose.yml ...
# so it shares no container, network, volume or port with docker-compose.yml. No container_name, no named
# volume (postgres and redis keep their data in anonymous volumes, removed by `down -v`), and the only
# published port is the site's, on the loopback.
#
# Networks: perf-internal is internal (no route out), so api, db and redis cannot reach the internet. web
# is also on edge, for its published port, which gives it a route out too. perf/compose.sentry.yml puts
# api on edge as well, when a Sentry DSN is given.
#
# Secrets (POSTGRES_PASSWORD, TOKEN_ENCRYPTION_KEY, JWT_SECRET) are generated by run.sh for each run;
# empty by default only so that a bare `down` works (postgres refuses to start without a password).
# JVMs: each app's heap is capped at 1 GiB (-Xmx1g) and its container at 1.5 GiB (heap plus metaspace, code
# cache and thread stacks), so that a run measures the same on any host: uncapped, the JVM sizes its heap
# from the host's RAM and G1 grows it instead of collecting, and the memory measured is mostly the host's.
# G1 is named because under 1792 MiB of container memory the JVM would pick the serial collector instead.
# Sentry: API_SENTRY_DSN, SENTRY_DSN and SENTRY_TRACES_SAMPLE_RATE come from the shell when set; never
# SENTRY_ENVIRONMENT nor ENVIRONMENT, which would override the perf profile's sentry.environment=perf
# (catapult-api's PerfGuard refuses to start then).
name: catapult-verify-perf

services:
  api:
    build:
      context: ..
      dockerfile: catapult-api/Dockerfile
    networks:
      - perf-internal
    mem_limit: 1536m
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx1g -XX:+UseG1GC
      - SPRING_PROFILES_ACTIVE=perf
      - CATAPULT_PERF_ENABLED=true
      # catapult.perf.accounts: how many perf-streamer-NNN accounts PerfDataSeeder creates
      - CATAPULT_PERF_ACCOUNTS=${STREAMERS:-100}
      - DB_URL=jdbc:postgresql://db:5432/catapult
      - DB_USERNAME=catapult
      - DB_PASSWORD=${POSTGRES_PASSWORD:-}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      # Must start with "perf-" (PerfGuard): the test login's tokens are never signed with a real key
      - JWT_SECRET=${JWT_SECRET:-}
      - REDIS_HOST=redis
      # Who may relay X-Forwarded-*: web, on perf-internal (its fixed subnet below, minus the .1 Docker gives
      # the host-side bridge). As in production, the links api builds then point at the site, not at api:8081.
      # No braces: Compose would end the interpolation at the first one.
      - API_TRUSTED_PROXIES=10\.251\.251\.([2-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-4])
      - APP_BASE_URL=http://127.0.0.1:${WEB_PORT:-18081}
      - CATAPULT_WEB_URL=http://127.0.0.1:${WEB_PORT:-18081}
      # Passed only when set in the shell
      - API_SENTRY_DSN
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8091/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 3m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: catapult-web/Dockerfile
    networks:
      - perf-internal
      - edge
    ports:
      - "127.0.0.1:${WEB_PORT:-18081}:8080"
    mem_limit: 1536m
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx1g -XX:+UseG1GC
      - SPRING_PROFILES_ACTIVE=perf
      - CATAPULT_PERF_ENABLED=true
      - CATAPULT_API_URL=http://api:8081
      - REDIS_HOST=redis
      # Passed only when set in the shell
      - SENTRY_DSN
      - SENTRY_TRACES_SAMPLE_RATE
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8092/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 3m
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    networks:
      - perf-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    image: postgres:16-alpine
    networks:
      - perf-internal
    environment:
      POSTGRES_DB: catapult
      POSTGRES_USER: catapult
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catapult -d catapult"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  perf-internal:
    internal: true
    # Fixed so that API_TRUSTED_PROXIES can name it; clear of Docker's default pools (172.17-31.x, 192.168.x)
    # and of docker-compose.yml's api-internal (10.250.250.0/24).
    ipam:
      config:
        - subnet: 10.251.251.0/24
  edge: {}
