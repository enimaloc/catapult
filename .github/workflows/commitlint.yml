name: Commit lint

# Pull requests only: the commits pushed to dev were linted in their pull request.
on:
  pull_request:

# A new push to a pull request cancels its previous run; a dispatched run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    # Promotion and backport PRs carry commits already on a long-lived branch (old subjects, merge
    # commits): their job is skipped, and a skipped job still satisfies the required check.
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(
        (github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main') ||
        (github.event.pull_request.head.ref == 'main' && github.event.pull_request.base.ref == 'dev') ||
        (github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'beta') ||
        (github.event.pull_request.head.ref == 'beta' && github.event.pull_request.base.ref == 'main') ||
        (github.event.pull_request.head.ref == 'main' && github.event.pull_request.base.ref == 'beta') ||
        (github.event.pull_request.head.ref == 'beta' && github.event.pull_request.base.ref == 'dev')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
