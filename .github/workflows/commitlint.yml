name: Commit lint

on:
  pull_request:
  push:
    branches:
      - master # until it is renamed dev
      - dev
      - beta
      - main

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
