name: Publish

# Publishes only on an actual merge: a closed but unmerged promotion PR releases nothing. The tag is
# pushed with the App token, but release.yml is called directly rather than through the tag event.
on:
  pull_request:
    types: [closed]

concurrency:
  group: publish-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.base.ref == 'beta' && github.event.pull_request.head.ref == 'dev') ||
        (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'beta') ||
        (github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'hotfix/'))
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      prerelease: ${{ steps.publish.outputs.prerelease }}
      skip: ${{ steps.publish.outputs.skip }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: publish
        name: Tag the merge commit (and open the hotfix backports)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/release/publish.mjs --number "$NUMBER" --notes-file "$RUNNER_TEMP/notes.md"
      - id: notes
        name: Expose the release notes
        run: |
          delimiter="notes_$(openssl rand -hex 16)"
          {
            echo "notes<<$delimiter"
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: publish
    if: needs.publish.outputs.skip != 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.publish.outputs.tag }}
      notes: ${{ needs.publish.outputs.notes }}
    secrets: inherit
