name: Publish

# Tags the merge commit only on an actual merge: a closed but unmerged promotion PR releases nothing.
# The tag is pushed with the App token, whose pushes do trigger workflows: that tag push runs
# release.yml, the single publication path. A stable or a hotfix opens its backport to dev:
# main -> dev while beta is skipped (.github/release/lib/flow.mjs); with beta, a merged hotfix
# backport main -> beta opens beta -> dev.
on:
  pull_request:
    types: [closed]

concurrency:
  group: publish-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev') ||
        (github.event.pull_request.base.ref == 'beta' && github.event.pull_request.head.ref == 'dev') ||
        (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'beta') ||
        (github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'hotfix/')) ||
        (github.event.pull_request.base.ref == 'beta' && github.event.pull_request.head.ref == 'main' &&
          contains(github.event.pull_request.labels.*.name, 'backport'))
      )
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag the merge commit (and open the backports to dev)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/release/publish.mjs --number "$NUMBER"

  # The beta -> main promotion was titled before this beta's tag existed: retitled once it is. In promote.yml's
  # promote-beta group, as that workflow's run for the same push to beta is: two refreshes in parallel would both
  # open the promotion. Apart from the publish job, whose run the group's single pending slot must never drop.
  refresh-stable:
    needs: publish
    if: github.event.pull_request.base.ref == 'beta' && github.event.pull_request.head.ref == 'dev'
    concurrency:
      group: promote-beta
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # The script reads everything through the API: no git history needed
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retitle the beta -> main promotion
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: node .github/release/promote.mjs --source beta --target main
