name: Tests

# Pull requests (into any branch, stacked ones included) rather than `push`: a push to a branch with
# an open PR ran the same job twice. dev's head is checked by its dev -> main promotion PR, main's by
# the backport main -> dev, and a version tag push runs release.yml.
on:
  # Lets renovate-merge.yml run it on dev after a checkbox merge, which GITHUB_TOKEN pushes cannot trigger
  workflow_dispatch:
  pull_request:

# A new push to a pull request cancels its previous run; a dispatched run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite runs as parallel shards (-PtestShard, root build.gradle.kts); together they run every
  # verification task `check` does: the modules' tests, englishConventions and jsTest
  shard:
    name: shard (${{ matrix.key }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: api-1, tasks: ':catapult-api:test -PtestShard=0/3' }
          - { key: api-2, tasks: ':catapult-api:test -PtestShard=1/3' }
          - { key: api-3, tasks: ':catapult-api:test -PtestShard=2/3' }
          - { key: web-1, tasks: ':catapult-web:test -PtestShard=0/2' }
          - { key: web-2, tasks: ':catapult-web:test -PtestShard=1/2' }
          - { key: rest, tasks: ':catapult-common:test :catapult-bgs:test :catapult-api:englishConventions :catapult-web:jsTest' }

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: catapult_test
          POSTGRES_USER: catapult
          POSTGRES_PASSWORD: catapult
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # catapult-web's tests install the browser-script toolchain (npm ci), jsTest runs Vitest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: catapult-web/package-lock.json

      # --continue reports every failing module rather than stopping at the first
      - name: Run tests
        run: ./gradlew ${{ matrix.tasks }} --continue
        env:
          DB_URL: jdbc:postgresql://localhost:5432/catapult_test
          DB_USERNAME: catapult
          DB_PASSWORD: catapult
          TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
          TWITCH_CLIENT_ID: test
          TWITCH_CLIENT_SECRET: test
          DISCORD_CLIENT_ID: test
          DISCORD_CLIENT_SECRET: test
          STEAM_CLIENT_ID: test
          STEAM_CLIENT_SECRET: test
          IGDB_CLIENT_ID: test
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

      # Every shard's coverage is named test.exec: renamed per shard so the final job can merge them
      - name: Collect coverage data
        if: always()
        run: |
          for exec in */build/jacoco/test.exec; do
            [ -f "$exec" ] || continue
            module="${exec%%/*}"
            mkdir -p "coverage/$module"
            cp "$exec" "coverage/$module/test-${{ matrix.key }}.exec"
          done

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.key }}
          path: |
            coverage/
            */build/test-results/test/
            */build/test-results/englishConventions/
            catapult-web/build/reports/js-coverage/
          if-no-files-found: ignore
          retention-days: 1

  # The required check: fails when any shard did, then merges the shards' coverage and applies each
  # module's floor (root build.gradle.kts) for catapult-common, catapult-api and catapult-web
  test:
    name: test
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the shards
        if: needs.shard.result != 'success'
        run: |
          echo "At least one test shard did not succeed (result: ${{ needs.shard.result }})"
          exit 1

      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download shard results
        uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: shards

      # The tests already ran in the shards: only the reports and the coverage floors run here
      - name: Merge coverage and check the floors
        run: ./gradlew jacocoTestCoverageVerification -x test -x englishConventions -PjacocoExecDir=shards --continue

      - name: Coverage summary
        if: always()
        run: |
          for module in catapult-common catapult-api catapult-web; do
            report="$module/build/reports/jacoco/test/jacocoTestReport.xml"
            [ -f "$report" ] || { echo "$module: no coverage report" >> "$GITHUB_STEP_SUMMARY"; continue; }
            grep -o '<counter type="LINE"[^>]*>' "$report" | tail -1 | \
            awk -v m="$module" '{for(i=1;i<=NF;i++){if($i~/^missed=/){split($i,a,"\"");mi=a[2]} if($i~/^covered=/){split($i,a,"\"");c=a[2]}}}
                 END{printf "%s line coverage: %.1f%%\n", m, c/(mi+c)*100}' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            */build/reports/jacoco/
            shards/*/*/build/test-results/
            shards/*/catapult-web/build/reports/js-coverage/
          retention-days: 7
