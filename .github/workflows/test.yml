name: Tests

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: catapult_test
          POSTGRES_USER: catapult
          POSTGRES_PASSWORD: catapult
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        run: ./gradlew :catapult-api:test :catapult-api:jacocoTestReport
        env:
          DB_URL: jdbc:postgresql://localhost:5432/catapult_test
          DB_USERNAME: catapult
          DB_PASSWORD: catapult
          TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
          TWITCH_CLIENT_ID: test
          TWITCH_CLIENT_SECRET: test
          DISCORD_CLIENT_ID: test
          DISCORD_CLIENT_SECRET: test
          STEAM_CLIENT_ID: test
          STEAM_CLIENT_SECRET: test
          IGDB_CLIENT_ID: test
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

      - name: Coverage summary
        if: always()
        run: |
          grep 'type="INSTRUCTION"' catapult-api/build/reports/jacoco/test/jacocoTestReport.xml | tail -1 | \
          awk '{for(i=1;i<=NF;i++){if($i~/^missed=/){split($i,a,"\"");m=a[2]} if($i~/^covered=/){split($i,a,"\"");c=a[2]}}}
               END{printf "Coverage: %.1f%%\n", c/(m+c)*100}' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            catapult-api/build/reports/jacoco/
            catapult-api/build/test-results/test/
          retention-days: 7
