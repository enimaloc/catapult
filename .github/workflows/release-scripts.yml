name: Release scripts

# Pull requests only, no `push`: a branch push with an open PR would run the same job twice.
on:
  pull_request:

# A new push to a pull request cancels its previous run; a dispatched run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Not `test`: ready.mjs requires the check named `test` (Tests workflow) before merging a release.
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test ".github/release/test/*.test.mjs"
