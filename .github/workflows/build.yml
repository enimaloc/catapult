name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # assemble: compile and package every module (catapult-common included) without `check`,
      # which the Tests workflow runs (catapult-web's would need Node for jsTest)
      - name: Build with Gradle
        run: ./gradlew assemble
