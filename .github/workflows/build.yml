name: Build

on:
  push:
  # Lets renovate-merge.yml run it on master after a checkbox merge, which GITHUB_TOKEN pushes cannot trigger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew :catapult-api:build :catapult-web:build -x test
