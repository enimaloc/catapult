name: Build

on:
  push:
  # Lets renovate-merge.yml run it on dev after a checkbox merge, which GITHUB_TOKEN pushes cannot trigger
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - beta
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # assemble: compile and package every module (catapult-common included) without `check`,
      # which the Tests workflow runs (catapult-web's would need Node for jsTest)
      - name: Build with Gradle
        run: ./gradlew assemble
