name: Build

# Pull requests (into any branch, stacked ones included) rather than `push`: a push to a branch with
# an open PR ran the same job twice. dev's head is checked by its dev -> main promotion PR, main's by
# the backport main -> dev, and a version tag push runs release.yml.
on:
  # Lets renovate-merge.yml run it on dev after a checkbox merge, which GITHUB_TOKEN pushes cannot trigger
  workflow_dispatch:
  pull_request:

# A new push to a pull request cancels its previous run; a dispatched run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # assemble: compile and package every module (catapult-common included) without `check`,
      # which the Tests workflow runs (catapult-web's would need Node for jsTest)
      - name: Build with Gradle
        run: ./gradlew assemble
