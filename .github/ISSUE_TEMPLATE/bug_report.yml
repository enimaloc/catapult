name: 🐛 Bug report
description: Signaler un comportement inattendu
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Que devrait-il se passer ?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Observer '...'
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module concerné
      options:
        - catapult-api
        - catapult-web
        - catapult-maintenance
        - nginx-router
        - Chat commands
        - Admin / CCL
        - Autre / inconnu
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version de Catapult
      placeholder: ex. 0.2.3-BETA
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
    validations:
      required: false
