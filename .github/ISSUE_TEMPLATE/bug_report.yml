name: 🐛 Bug report
description: Signaler un comportement inattendu
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Que devrait-il se passer ?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Observer '...'
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Domaine
      description: "Le domaine correspond au label `area: …` que le mainteneur posera."
      options:
        - "area: api"
        - "area: web"
        - "area: obs"
        - "area: twitch"
        - "area: twitchat"
        - "area: chat-commands"
        - "area: ci"
        - Autre / inconnu
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version de Catapult
      description: Visible dans le pied de page du site ou dans le tag de l'image Docker.
      placeholder: ex. v1.0.0-BETA.97
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
    validations:
      required: false
