services:
  catapult-api:
    build:
      context: .
      dockerfile: catapult-api/Dockerfile
    image: registry.gitlab.com/enimaloc/catapult/api:latest
    ports:
      - "8080:8080"
      - "8090:8090"
    environment:
      DB_URL: jdbc:postgresql://db:5432/catapult
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_OWNER_ID: ${APP_OWNER_ID:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      STEAM_API_KEY: ${STEAM_API_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET}
      CATAPULT_WEB_URL: ${CATAPULT_WEB_URL:-http://catapult-web:8081}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  catapult-web:
    build:
      context: .
      dockerfile: catapult-web/Dockerfile
    image: registry.gitlab.com/enimaloc/catapult/web:latest
    ports:
      - "8081:8081"
      - "8091:8091"
    environment:
      CATAPULT_API_URL: ${CATAPULT_API_URL:-http://catapult-api:8080}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - catapult-api
    restart: unless-stopped

  catapult-maintenance:
    build:
      context: catapult-maintenance
    image: registry.gitlab.com/enimaloc/catapult/maintenance:latest
    restart: unless-stopped

  nginx-router:
    build:
      context: nginx-router
    image: registry.gitlab.com/enimaloc/catapult/nginx-router:latest
    ports:
      - "80:80"
    depends_on:
      - catapult-web
      - catapult-maintenance
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catapult
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d catapult"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
