services:
  catapult-api:
    build:
      context: .
      dockerfile: catapult-api/Dockerfile
    networks:
      default:
      api-internal:
        aliases:
          - catapult-api-internal
    environment:
      - DB_URL=jdbc:postgresql://catapult-db:5432/${POSTGRES_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - APP_BASE_URL=${APP_BASE_URL}
      - APP_OWNER_ID=${APP_OWNER_ID}
      # Empty = no profile; "degraded" on the backup server
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - WHITELIST=${WHITELIST}
      - JWT_SECRET=${JWT_SECRET}
      - CATAPULT_WEB_URL=${CATAPULT_WEB_URL}
      - REDIS_HOST=catapult-redis
      # Empty = Sentry off (only members in debug mode are ever sent)
      - API_SENTRY_DSN=${API_SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      # Who may relay X-Forwarded-* (a Java regex on the peer address): catapult-web, on api-internal only.
      # Must describe the same subnet as API_NETWORK_SUBNET below. No braces: Compose would end the
      # interpolation at the first one.
      - API_TRUSTED_PROXIES=${API_TRUSTED_PROXIES:-10\.250\.250\.[0-9]+}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    depends_on:
      catapult-db:
        condition: service_healthy
      catapult-redis:
        condition: service_healthy
    restart: unless-stopped

  catapult-web:
    build:
      context: .
      dockerfile: catapult-web/Dockerfile
    # The site's only entry point: it relays catapult-api's public paths itself (ApiRelayController).
    # Several instances can run behind the TLS proxy in front (sessions and browser events go through
    # Redis): raise CATAPULT_WEB_REPLICAS, or `docker compose up --scale catapult-web=N`, and give
    # WEB_PORTS one host port per instance (e.g. 8081-8083) for the proxy to balance across. No fixed
    # container_name, so the replicas don't collide. Published on the loopback only (WEB_BIND): catapult-web
    # trusts the X-Forwarded-* of private addresses, which only the TLS proxy in front may send it.
    networks:
      - default
      - api-internal
    deploy:
      replicas: ${CATAPULT_WEB_REPLICAS:-1}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORTS:-80}:8081"
    environment:
      # The alias exists on api-internal only, so catapult-web always reaches catapult-api from the trusted
      # network (on `default` its X-Forwarded-Host would be ignored and the login's redirect_uri wrong).
      - CATAPULT_API_URL=${CATAPULT_API_URL:-http://catapult-api-internal:8080}
      - REDIS_HOST=catapult-redis
      # Empty = no profile; "degraded" on the backup server
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      # Empty = Sentry off
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      # Empty = no link to the status page in the degraded banner
      - INSTATUS_PAGE_URL=${INSTATUS_PAGE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8092/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    depends_on:
      catapult-redis:
        condition: service_healthy
    restart: unless-stopped

  catapult-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  catapult-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catapult -d catapult"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  # catapult-api <-> catapult-web only. internal: no gateway, so neither the Docker host nor the outside can
  # open a connection on it. API_NETWORK_SUBNET and API_TRUSTED_PROXIES must describe the same subnet.
  api-internal:
    internal: true
    ipam:
      config:
        - subnet: ${API_NETWORK_SUBNET:-10.250.250.0/24}

volumes:
  postgres_data: