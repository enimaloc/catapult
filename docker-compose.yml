services:
  catapult-api:
    build:
      context: .
      dockerfile: catapult-api/Dockerfile
    environment:
      - DB_URL=jdbc:postgresql://catapult-db:5432/${POSTGRES_DB}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - APP_BASE_URL=${APP_BASE_URL}
      - APP_OWNER_ID=${APP_OWNER_ID}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - WHITELIST=${WHITELIST}
      - JWT_SECRET=${JWT_SECRET}
      - CATAPULT_WEB_URL=${CATAPULT_WEB_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    depends_on:
      catapult-db:
        condition: service_healthy
    restart: unless-stopped

  catapult-web:
    build:
      context: .
      dockerfile: catapult-web/Dockerfile
    environment:
      - CATAPULT_API_URL=${CATAPULT_API_URL:-http://catapult-api:8080}
      - JWT_SECRET=${JWT_SECRET}
      # Empty = use relative URL for OAuth so nginx routes /oauth2/** to catapult-api correctly
      - CATAPULT_API_PUBLIC_URL=
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    restart: unless-stopped

  catapult-maintenance:
    build:
      context: catapult-maintenance
    restart: unless-stopped

  catapult-router:
    build:
      context: nginx-router
    ports:
      - "${ROUTER_PORT:-80}:8080"
    environment:
      - UPSTREAM_FRONTEND=${UPSTREAM_FRONTEND:-catapult-web:8081}
      - UPSTREAM_BACKEND=${UPSTREAM_BACKEND:-catapult-api:8080}
      - UPSTREAM_MAINTENANCE=${UPSTREAM_MAINTENANCE:-catapult-maintenance:80}
      # In local/dev (no TLS termination), force http to avoid Spring building https redirect URIs
      - FORWARDED_PROTO=${FORWARDED_PROTO:-$$scheme}
    # nginx resolves upstreams at startup — wait for services to exist in Docker DNS
    depends_on:
      - catapult-api
      - catapult-web
      - catapult-maintenance
    restart: unless-stopped

  catapult-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catapult -d catapult"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: